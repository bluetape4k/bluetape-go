name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TESTCONTAINERS_RYUK_DISABLED: "true"
  DOCKER_HOST: "unix:///var/run/docker.sock"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Docker for Testcontainers
        run: |
          docker version
          docker info

      - name: Check formatting
        run: make fmt-check

      - name: Check module tidiness
        run: make tidy-check

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Test with Testcontainers and coverage
        run: make coverage

      - name: Summarize coverage
        if: always()
        run: |
          if [ -f coverage/coverage.txt ]; then
            {
              echo "## Coverage"
              echo
              echo '```text'
              tail -n 20 coverage/coverage.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-go
          path: coverage/
          retention-days: 30
          if-no-files-found: warn

      - name: Race test with Testcontainers
        run: make race
