<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">jwt/mongo Provider Sequence</title>
  <desc id="desc">Sequence diagram for jwt/mongo showing caller-owned Mongo client setup, facade New delegation to jwt.NewMongoRepository, distributed HMAC provider creation, ComposeContext, repository-backed key-chain storage, ParseContext, and external operational ownership.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="seqArrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6"/>
    </marker>
    <marker id="seqArrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c1842f" stroke="#c1842f"/>
    </marker>
    <marker id="seqArrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8d3e" stroke="#5f8d3e"/>
    </marker>
    <marker id="seqArrow-teal" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f8f8a" stroke="#2f8f8a"/>
    </marker>
    <marker id="seqArrow-red" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b65b67" stroke="#b65b67"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .participant-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .role, .msg, .region, .footer { font-family: "Comic Mono", "SFMono-Regular", monospace; fill: #526276; }
      .subtitle { font-size: 17px; }
      .participant-title { font-size: 22px; }
      .role { font-size: 13px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: 0.88; }
      .call, .return, .error { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .call { stroke-width: 3; }
      .return, .error { stroke-width: 2.7; stroke-dasharray: 9 8; }
      .phase { fill: none; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .phase-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 15; }
      .badge { stroke-width: 1.6; }
      .badgeText { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1320"/>
  <rect class="frame" x="34" y="30" width="1732" height="1256" rx="8"/>
  <text class="title" x="72" y="88">jwt/mongo Provider Sequence</text>
  <text class="subtitle" x="76" y="120">The facade creates the repository import boundary; distributed signing, parsing, rotation, and cache behavior stay in the parent jwt package.</text>

  <rect class="participant" x="72" y="174" width="214" height="72" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="participant-title" x="179" y="202" text-anchor="middle">Caller</text>
  <text class="role" x="179" y="224" text-anchor="middle">owns client + ctx</text>
  <line class="lifeline" x1="179" y1="246" x2="179" y2="1210"/>

  <rect class="participant" x="366" y="174" width="220" height="72" fill="#f3efff" stroke="#9b7aec"/>
  <text class="participant-title" x="476" y="202" text-anchor="middle">Mongo client</text>
  <text class="role" x="476" y="224" text-anchor="middle">external lifecycle</text>
  <line class="lifeline" x1="476" y1="246" x2="476" y2="1210"/>

  <rect class="participant" x="668" y="174" width="212" height="72" fill="#edf9f4" stroke="#63b891"/>
  <text class="participant-title" x="774" y="202" text-anchor="middle">jwt/mongo</text>
  <text class="role" x="774" y="224" text-anchor="middle">facade New</text>
  <line class="lifeline" x1="774" y1="246" x2="774" y2="1210"/>

  <rect class="participant" x="966" y="174" width="222" height="72" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="participant-title" x="1077" y="202" text-anchor="middle">parent jwt</text>
  <text class="role" x="1077" y="224" text-anchor="middle">provider owner</text>
  <line class="lifeline" x1="1077" y1="246" x2="1077" y2="1210"/>

  <rect class="participant" x="1268" y="174" width="218" height="72" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="participant-title" x="1377" y="202" text-anchor="middle">Repository</text>
  <text class="role" x="1377" y="224" text-anchor="middle">Mongo key-chain</text>
  <line class="lifeline" x1="1377" y1="246" x2="1377" y2="1210"/>

  <rect class="participant" x="1562" y="174" width="206" height="72" fill="#fff4de" stroke="#d59c3f"/>
  <text class="participant-title" x="1665" y="202" text-anchor="middle">Mongo collection</text>
  <text class="role" x="1665" y="224" text-anchor="middle">keys + current kid</text>
  <line class="lifeline" x1="1665" y1="246" x2="1665" y2="1210"/>

  <rect class="activation" x="172" y="296" width="14" height="876" rx="7"/>
  <rect class="activation" x="469" y="310" width="14" height="122" rx="7"/>
  <rect class="activation" x="767" y="470" width="14" height="126" rx="7"/>
  <rect class="activation" x="1070" y="550" width="14" height="486" rx="7"/>
  <rect class="activation" x="1370" y="630" width="14" height="406" rx="7"/>
  <rect class="activation" x="1658" y="710" width="14" height="326" rx="7"/>

  <rect class="phase" x="626" y="436" width="794" height="204" rx="16"/>
  <rect class="phase-label" x="648" y="454" width="198" height="30" rx="15"/>
  <text class="region" x="672" y="474">repository setup</text>

  <rect class="phase" x="1028" y="674" width="686" height="388" rx="16"/>
  <rect class="phase-label" x="1050" y="692" width="192" height="30" rx="15"/>
  <text class="region" x="1074" y="712">provider behavior</text>

  <path class="call" d="M179 320H476" stroke="#8a65d6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="246" y="278" width="164" height="30" rx="15"/>
  <circle class="badge" cx="266" cy="293" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="266" y="297" text-anchor="middle">1</text>
  <text class="msg" x="334" y="298" text-anchor="middle" fill="#4f86c6">Connect</text>

  <path class="return" d="M476 420H179" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="226" y="378" width="204" height="30" rx="15"/>
  <circle class="badge" cx="248" cy="393" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="248" y="397" text-anchor="middle">2</text>
  <text class="msg" x="334" y="398" text-anchor="middle" fill="#5f8d3e">*mongo.Client</text>

  <path class="call" d="M179 500H774" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="380" y="458" width="198" height="30" rx="15"/>
  <circle class="badge" cx="402" cy="473" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="402" y="477" text-anchor="middle">3</text>
  <text class="msg" x="486" y="478" text-anchor="middle" fill="#4f86c6">mongojwt.New</text>

  <path class="call" d="M774 580H1077" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="806" y="538" width="240" height="30" rx="15"/>
  <circle class="badge" cx="828" cy="553" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="828" y="557" text-anchor="middle">4</text>
  <text class="msg" x="932" y="558" text-anchor="middle" fill="#4f86c6">NewMongoRepository</text>

  <path class="return" d="M1377 660H179" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="674" y="618" width="208" height="30" rx="15"/>
  <circle class="badge" cx="696" cy="633" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="696" y="637" text-anchor="middle">5</text>
  <text class="msg" x="784" y="638" text-anchor="middle" fill="#5f8d3e">Repository alias</text>

  <path class="call" d="M179 740H1077" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="480" y="698" width="306" height="30" rx="15"/>
  <circle class="badge" cx="502" cy="713" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="502" y="717" text-anchor="middle">6</text>
  <text class="msg" x="638" y="718" text-anchor="middle" fill="#4f86c6">NewDistributedHMACProvider</text>

  <path class="call" d="M1077 820H1377" stroke="#64748b" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="1154" y="778" width="146" height="30" rx="15"/>
  <circle class="badge" cx="1174" cy="793" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="1174" y="797" text-anchor="middle">7</text>
  <text class="msg" x="1232" y="798" text-anchor="middle" fill="#2f8f8a">load keys</text>

  <path class="call" d="M1377 900H1665" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="1448" y="858" width="146" height="30" rx="15"/>
  <circle class="badge" cx="1468" cy="873" r="13" fill="#c1842f" stroke="#c1842f"/>
  <text class="badgeText" x="1468" y="877" text-anchor="middle">8</text>
  <text class="msg" x="1526" y="878" text-anchor="middle" fill="#c1842f">read/write</text>

  <path class="call" d="M179 980H1077" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="516" y="938" width="244" height="30" rx="15"/>
  <circle class="badge" cx="538" cy="953" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="538" y="957" text-anchor="middle">9</text>
  <text class="msg" x="642" y="958" text-anchor="middle" fill="#4f86c6">Compose / Parse</text>

  <path class="return" d="M1077 1060H179" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="530" y="1018" width="220" height="30" rx="15"/>
  <circle class="badge" cx="552" cy="1033" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="552" y="1037" text-anchor="middle">10</text>
  <text class="msg" x="642" y="1038" text-anchor="middle" fill="#5f8d3e">token / reader</text>

  <path class="error" d="M476 1140H179" stroke="#b65b67" marker-end="url(#seqArrow-red)"/>
  <rect class="pill" x="206" y="1098" width="244" height="30" rx="15"/>
  <circle class="badge" cx="228" cy="1113" r="13" fill="#b65b67" stroke="#b65b67"/>
  <text class="badgeText" x="228" y="1117" text-anchor="middle">11</text>
  <text class="msg" x="334" y="1118" text-anchor="middle" fill="#b65b67">Disconnect outside</text>

  <rect class="pill" x="346" y="1234" width="1108" height="34" rx="17"/>
  <text class="footer" x="900" y="1256" text-anchor="middle">Authentication, TLS, backups, collection access, reset, and retention authorization remain operational concerns outside the facade.</text>
</svg>
