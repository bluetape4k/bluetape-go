<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity=".22"/></filter>
</defs>
<style>
  @font-face{font-family:'Architects Daughter';src:local('Architects Daughter');}
  @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
  .bg{fill:#f8fafc}.title{font:42px 'Architects Daughter','Comic Sans MS',cursive;fill:#111827}.sub{font:20px 'Comic Mono','Courier New',monospace;fill:#475569}.card-title{font:24px 'Comic Mono','Courier New',monospace;font-weight:700;fill:#111827}.body{font:17px 'Comic Mono','Courier New',monospace;fill:#334155}.small{font:15px 'Comic Mono','Courier New',monospace;fill:#475569}.label{font:16px 'Comic Mono','Courier New',monospace;fill:#2563eb;font-weight:700}.line{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.line-green{stroke:#059669;stroke-width:3.5;fill:none;marker-end:url(#arrow-green)}.line-red{stroke:#dc2626;stroke-width:3.5;fill:none;marker-end:url(#arrow-red)}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke-width:4}.alt{fill:#f59e0b;fill-opacity:.12;stroke:#f59e0b;stroke-opacity:.55;stroke-dasharray:10 8;stroke-width:3}
</style>
<rect class="bg" width="1440" height="820"/>
<text class="title" x="56" y="72">Workreport Failure Policy Flow</text>
<text class="sub" x="60" y="112">Aggregate combines terminal child reports into one copied report tree without running work itself.</text>
<rect class="card" x="70" y="180" width="290" height="180" rx="16" fill="#eff6ff" stroke="#2563eb" filter="url(#shadow)"/>
<text class="card-title" x="96" y="220">Child reports</text>
<text class="body" x="98" y="256">Completed / Failed</text>
<text class="body" x="98" y="283">Partial / Aborted</text>
<text class="body" x="98" y="310">Cancelled</text>
<text class="body" x="98" y="337">unknown is not terminal</text>
<rect class="card" x="500" y="135" width="330" height="220" rx="16" fill="#ecfdf5" stroke="#059669" filter="url(#shadow)"/>
<text class="card-title" x="528" y="175">StopOnFailure</text>
<text class="body" x="530" y="212">walk children in order</text>
<text class="body" x="530" y="239">include through first</text>
<text class="body" x="530" y="266">non-completed child</text>
<text class="body" x="530" y="293">parent inherits child status</text>
<text class="body" x="530" y="320">Err/Reason preserved</text>
<rect class="card" x="500" y="455" width="330" height="190" rx="16" fill="#fff7ed" stroke="#ea580c" filter="url(#shadow)"/>
<text class="card-title" x="528" y="495">ContinueOnFailure</text>
<text class="body" x="530" y="532">copy every child</text>
<text class="body" x="530" y="559">any non-completed</text>
<text class="body" x="530" y="586">parent = StatusPartial</text>
<text class="body" x="530" y="613">all completed -> completed</text>
<rect class="card" x="970" y="205" width="330" height="205" rx="16" fill="#f5f3ff" stroke="#7c3aed" filter="url(#shadow)"/>
<text class="card-title" x="998" y="245">Parent Report</text>
<text class="body" x="1000" y="282">Name + Status</text>
<text class="body" x="1000" y="309">StartedAt / EndedAt</text>
<text class="body" x="1000" y="336">Err or Reason</text>
<text class="body" x="1000" y="363">Children copied</text>
<rect class="card" x="970" y="520" width="330" height="135" rx="16" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
<text class="card-title" x="998" y="560">Invalid policy</text>
<text class="body" x="1000" y="596">FailurePolicyError</text>
<text class="body" x="1000" y="623">errors.Is unknown policy</text>
<path class="line" d="M360 258 L500 245"/><text class="label" x="393" y="238">stop path</text>
<path class="line" d="M360 305 C420 430 455 520 500 550"/><text class="label" x="385" y="460">continue path</text>
<path class="line-green" d="M830 245 L970 295"/><text class="label" x="862" y="255">inherit status</text>
<path class="line-green" d="M830 555 L970 345"/><text class="label" x="845" y="470">partial or complete</text>
<path class="line-red" d="M830 615 L970 590"/><text class="label" x="850" y="632">policy error</text>
<path class="dash" d="M1110 410 L1110 520"/><text class="label" x="1128" y="470">errors.Is</text>
<rect class="alt" x="70" y="720" width="1240" height="58" rx="16"/>
<text class="small" x="96" y="755">Boundary: workreport does not start goroutines, retry work, own cancellation, or run workflow branches; workflow owns runner behavior.</text>
</svg>