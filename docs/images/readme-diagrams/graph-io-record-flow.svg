<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
<title id="title">graph/graphio Record Flow</title>
<desc id="desc">Bounded readers and writers move graph vertices and edges through NDJSON and paired CSV streams without claiming backend or GraphML ownership.</desc>
<defs>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke="#059669" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style><![CDATA[
@font-face{font-family:'Architects Daughter';src:url('/Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf');}
@font-face{font-family:'Comic Mono';src:url('/Users/debop/Library/Fonts/ComicMono.ttf');font-weight:400;}
@font-face{font-family:'Comic Mono';src:url('/Users/debop/Library/Fonts/ComicMono-Bold.ttf');font-weight:700;}
.bg{fill:#f8fafc}.title{font-family:'Architects Daughter','Comic Mono';font-size:31px;fill:#111827}.sub{font-family:'Comic Mono','Architects Daughter';font-size:14px;fill:#475569}.lane{rx:14;fill:#ffffff;stroke:#cbd5e1;stroke-width:1.4}.laneTitle{font-family:'Comic Mono','Architects Daughter';font-size:13px;font-weight:700;fill:#334155;letter-spacing:.04em}.card{rx:12;stroke-width:2.2}.cardTitle{font-family:'Comic Mono','Architects Daughter';font-size:16px;font-weight:700;fill:#111827}.cardText{font-family:'Comic Mono','Architects Daughter';font-size:12px;fill:#374151}.arrowImport{fill:none;stroke:#2563eb;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-blue)}.arrowExport{fill:none;stroke:#059669;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-green)}.arrowDefer{fill:none;stroke:#64748b;stroke-width:2.8;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-gray)}.label{font-family:'Comic Mono','Architects Daughter';font-size:12px;font-weight:700}.labelImport{fill:#1d4ed8}.labelExport{fill:#047857}.labelDefer{fill:#475569}.pill{rx:9;fill:#ffffff;stroke:#cbd5e1}.footer{font-family:'Comic Mono','Architects Daughter';font-size:12px;fill:#475569}
  ]]></style>
</defs>
<rect class="bg" x="0" y="0" width="1180" height="620"/>
<text class="title" x="48" y="54">graph/graphio Record Flow</text>
<text class="sub" x="50" y="84">NDJSON and paired CSV stay at the bounded record-stream boundary; GraphML, filesystem ownership, and backends remain deferred.</text>
<rect class="lane" x="42" y="118" width="1096" height="196" fill-opacity="0.94"/>
<text class="laneTitle" x="64" y="146">IMPORT: untrusted bytes become validated graph values</text>
<rect class="lane" x="42" y="352" width="1096" height="170" fill-opacity="0.94"/>
<text class="laneTitle" x="64" y="380">EXPORT: graph values become deterministic interchange records</text>
<rect class="card" x="64" y="172" width="220" height="104" fill="#eff6ff" stroke="#2563eb"/>
<text class="cardTitle" x="82" y="204">NDJSON / CSV input</text>
<text class="cardText" x="82" y="230">one NDJSON stream</text>
<text class="cardText" x="82" y="250">or vertex + edge CSV</text>
<rect class="card" x="342" y="162" width="230" height="124" fill="#ecfdf5" stroke="#059669"/>
<text class="cardTitle" x="360" y="194">Bounded readers</text>
<text class="cardText" x="360" y="220">MaxLine / Record / Field</text>
<text class="cardText" x="360" y="240">MaxColumns + MaxRecords</text>
<text class="cardText" x="360" y="260">context checked per record</text>
<rect class="card" x="630" y="162" width="230" height="124" fill="#fff7ed" stroke="#f97316"/>
<text class="cardTitle" x="648" y="194">Policy checks</text>
<text class="cardText" x="648" y="220">duplicate vertex policy</text>
<text class="cardText" x="648" y="240">missing endpoint policy</text>
<text class="cardText" x="648" y="260">redacted graphio.Error</text>
<rect class="card" x="918" y="172" width="190" height="104" fill="#fdf2f8" stroke="#db2777"/>
<text class="cardTitle" x="936" y="204">graph values</text>
<text class="cardText" x="936" y="230">graph.Vertex</text>
<text class="cardText" x="936" y="250">graph.Edge</text>
<rect class="card" x="64" y="410" width="220" height="86" fill="#fdf2f8" stroke="#db2777"/>
<text class="cardTitle" x="82" y="442">graph values</text>
<text class="cardText" x="82" y="468">validated Vertex / Edge</text>
<rect class="card" x="342" y="400" width="230" height="106" fill="#f0fdfa" stroke="#0f766e"/>
<text class="cardTitle" x="360" y="432">Record helpers</text>
<text class="cardText" x="360" y="458">VertexRecord / EdgeRecord</text>
<text class="cardText" x="360" y="478">one-of validation</text>
<rect class="card" x="630" y="400" width="230" height="106" fill="#faf5ff" stroke="#9333ea"/>
<text class="cardTitle" x="648" y="432">Writers</text>
<text class="cardText" x="648" y="458">vertices before edges</text>
<text class="cardText" x="648" y="478">CSVFormulaEscape default</text>
<rect class="card" x="918" y="410" width="190" height="86" fill="#eff6ff" stroke="#2563eb"/>
<text class="cardTitle" x="936" y="442">NDJSON / CSV output</text>
<text class="cardText" x="936" y="468">bounded interchange</text>
<path class="arrowImport" data-connector="import-read" marker-end="url(#arrow-blue)" d="M 284 224 L 342 224"/>
<text class="label labelImport" x="298" y="211">read()</text>
<path class="arrowImport" data-connector="import-validate" marker-end="url(#arrow-blue)" d="M 572 224 L 630 224"/>
<text class="label labelImport" x="590" y="211">validate</text>
<path class="arrowImport" data-connector="import-values" marker-end="url(#arrow-blue)" d="M 860 224 L 918 224"/>
<text class="label labelImport" x="870" y="204">return</text>
<text class="label labelImport" x="876" y="219">values</text>
<path class="arrowExport" data-connector="export-wrap" marker-end="url(#arrow-green)" d="M 284 453 L 342 453"/>
<text class="label labelExport" x="302" y="440">wrap</text>
<path class="arrowExport" data-connector="export-write" marker-end="url(#arrow-green)" d="M 572 453 L 630 453"/>
<text class="label labelExport" x="590" y="440">write()</text>
<path class="arrowExport" data-connector="export-emit" marker-end="url(#arrow-green)" d="M 860 453 L 918 453"/>
<text class="label labelExport" x="878" y="440">emit</text>
<path class="arrowDefer" data-connector="deferred-boundary" marker-end="url(#arrow-gray)" d="M 742 400 L 742 326"/>
<text class="label labelDefer" x="760" y="358">defer GraphML / backend contracts</text>
<rect class="pill" x="64" y="546" width="592" height="42"/>
<path class="arrowImport" d="M 86 567 L 128 567"/>
<text class="footer" x="140" y="571">import path</text>
<path class="arrowExport" d="M 250 567 L 292 567"/>
<text class="footer" x="304" y="571">export path</text>
<path class="arrowDefer" d="M 414 567 L 456 567"/>
<text class="footer" x="468" y="571">explicitly deferred capability</text>
</svg>
