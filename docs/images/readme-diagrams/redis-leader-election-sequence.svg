<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1010" viewBox="0 0 1500 1010" role="img" aria-labelledby="title desc">
  <title id="title">Redis Leader Election Sequence</title>
  <desc id="desc">Campaign, renewal, action ownership, release, and lazy group-slot cleanup happen in Redis time order.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4f77c9"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#319873"/></marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#cf8428"/></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#c85d73"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#7e62d9"/></marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7d9c"/></marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .part-title, .card-title, .panel-title { font-family: "Architects Daughter"; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .body, .small, .msg, .region, .footer { font-family: "Comic Mono"; fill: #526276; }
      .subtitle { font-size: 17px; }
      .panel-title { font-size: 24px; }
      .card-title { font-size: 22px; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 12px; font-weight: 700; }
      .footer { font-size: 14px; }
      .panel { stroke: #d0deeb; stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card { stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card-divider { stroke-width: 1.1; opacity: .45; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: .88; }
      .route { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .alt { fill: #f7f2ff; fill-opacity: .22; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .alt-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .else-line { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 14; }
      .badge { stroke-width: 1.6; }
      .badge-text { font-family: "Comic Mono"; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .legend { fill: #ffffff; stroke: #d4e0ec; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect class="canvas" width="1500" height="1010"/>
  <rect class="frame" x="34" y="30" width="1432" height="946" rx="8"/>
  <text class="title" x="72" y="88">Redis Leader Election Sequence</text>
  <text class="subtitle" x="76" y="120">Campaign, renewal, action ownership, release, and lazy group-slot cleanup happen in Redis time order.</text>
  <rect class="participant" x="70" y="174" width="160" height="68" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="part-title" x="150" y="202" text-anchor="middle">Member</text>
  <text class="small" x="150" y="224" text-anchor="middle">caller</text>
  <line class="lifeline" x1="150" y1="242" x2="150" y2="884"/>
  <rect class="participant" x="280" y="174" width="160" height="68" fill="#fff4de" stroke="#d59c3f"/>
  <text class="part-title" x="360" y="202" text-anchor="middle">Elector</text>
  <text class="small" x="360" y="224" text-anchor="middle">Go API</text>
  <line class="lifeline" x1="360" y1="242" x2="360" y2="884"/>
  <rect class="participant" x="510" y="174" width="160" height="68" fill="#fff0f0" stroke="#dc2626"/>
  <text class="part-title" x="590" y="202" text-anchor="middle">Redis Lua</text>
  <text class="small" x="590" y="224" text-anchor="middle">ownership</text>
  <line class="lifeline" x1="590" y1="242" x2="590" y2="884"/>
  <rect class="participant" x="750" y="174" width="160" height="68" fill="#f3efff" stroke="#9b7aec"/>
  <text class="part-title" x="830" y="202" text-anchor="middle">Redis keys</text>
  <text class="small" x="830" y="224" text-anchor="middle">TTL/ZSET</text>
  <line class="lifeline" x1="830" y1="242" x2="830" y2="884"/>
  <rect class="participant" x="980" y="174" width="160" height="68" fill="#edf9f4" stroke="#63b891"/>
  <text class="part-title" x="1060" y="202" text-anchor="middle">Action</text>
  <text class="small" x="1060" y="224" text-anchor="middle">user work</text>
  <line class="lifeline" x1="1060" y1="242" x2="1060" y2="884"/>
  <rect class="participant" x="1200" y="174" width="160" height="68" fill="#f8fafc" stroke="#64748b"/>
  <text class="part-title" x="1280" y="202" text-anchor="middle">Contender</text>
  <text class="small" x="1280" y="224" text-anchor="middle">same group</text>
  <line class="lifeline" x1="1280" y1="242" x2="1280" y2="884"/>
  <rect class="activation" x="353" y="298" width="14" height="384" rx="7"/>
  <rect class="activation" x="583" y="358" width="14" height="484" rx="7"/>
  <rect class="activation" x="823" y="418" width="14" height="424" rx="7"/>
  <rect class="alt" x="78" y="330" width="1276" height="290" rx="16"/>
  <rect class="alt-label" x="96" y="348" width="156" height="30" rx="15"/>
  <text class="region" x="118" y="368">alt acquired</text>
  <line class="else-line" x1="92" y1="615" x2="1340" y2="615"/>
  <rect class="alt-label" x="96" y="633" width="264" height="30" rx="15"/>
  <text class="region" x="118" y="653">else conflict or waiting</text>
  <rect class="alt" x="78" y="720" width="1276" height="140" rx="16"/>
  <rect class="alt-label" x="96" y="738" width="156" height="30" rx="15"/>
  <text class="region" x="118" y="758">lazy cleanup</text>
  <path class="route" d="M150 310 L360 310" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <rect class="pill" x="180" y="268" width="150" height="30" rx="15"/>
  <circle class="badge" cx="198" cy="283" r="13" fill="#4f77c9"/>
  <text class="badge-text" x="198" y="287" text-anchor="middle">1</text>
  <text class="msg" x="270" y="288" text-anchor="middle" fill="#4f77c9">Campaign(ctx)</text>
  <path class="route" d="M360 370 L590 370" stroke="#cf8428" marker-end="url(#arrow-amber)"/>
  <rect class="pill" x="364" y="328" width="222" height="30" rx="15"/>
  <circle class="badge" cx="382" cy="343" r="13" fill="#cf8428"/>
  <text class="badge-text" x="382" y="347" text-anchor="middle">2</text>
  <text class="msg" x="490" y="348" text-anchor="middle" fill="#cf8428">SET NX PX or ZADD slot</text>
  <path class="route" d="M590 430 L830 430" stroke="#319873" marker-end="url(#arrow-green)"/>
  <rect class="pill" x="607" y="388" width="206" height="30" rx="15"/>
  <circle class="badge" cx="625" cy="403" r="13" fill="#319873"/>
  <text class="badge-text" x="625" y="407" text-anchor="middle">3</text>
  <text class="msg" x="725" y="408" text-anchor="middle" fill="#319873">store token + expiry</text>
  <path class="return" d="M590 490 L360 490" stroke="#319873" marker-end="url(#arrow-green)"/>
  <rect class="pill" x="409" y="448" width="132" height="30" rx="15"/>
  <circle class="badge" cx="427" cy="463" r="13" fill="#319873"/>
  <text class="badge-text" x="427" y="467" text-anchor="middle">4a</text>
  <text class="msg" x="490" y="468" text-anchor="middle" fill="#319873">acquired</text>
  <path class="route" d="M360 550 L1060 550" stroke="#319873" marker-end="url(#arrow-green)"/>
  <rect class="pill" x="623" y="508" width="174" height="30" rx="15"/>
  <circle class="badge" cx="641" cy="523" r="13" fill="#319873"/>
  <text class="badge-text" x="641" y="527" text-anchor="middle">5a</text>
  <text class="msg" x="725" y="528" text-anchor="middle" fill="#319873">run elected work</text>
  <path class="route" d="M360 650 L590 650" stroke="#cf8428" marker-end="url(#arrow-amber)"/>
  <rect class="pill" x="332" y="608" width="286" height="30" rx="15"/>
  <circle class="badge" cx="350" cy="623" r="13" fill="#cf8428"/>
  <text class="badge-text" x="350" y="627" text-anchor="middle">6</text>
  <text class="msg" x="490" y="628" text-anchor="middle" fill="#cf8428">renew/release if token matches</text>
  <path class="route" d="M1280 750 L590 750" stroke="#7e62d9" marker-end="url(#arrow-purple)"/>
  <rect class="pill" x="840" y="708" width="190" height="30" rx="15"/>
  <circle class="badge" cx="858" cy="723" r="13" fill="#7e62d9"/>
  <text class="badge-text" x="858" y="727" text-anchor="middle">7</text>
  <text class="msg" x="950" y="728" text-anchor="middle" fill="#7e62d9">next group acquire</text>
  <path class="route" d="M590 810 L830 810" stroke="#7e62d9" marker-end="url(#arrow-purple)"/>
  <rect class="pill" x="587" y="768" width="246" height="30" rx="15"/>
  <circle class="badge" cx="605" cy="783" r="13" fill="#7e62d9"/>
  <text class="badge-text" x="605" y="787" text-anchor="middle">8</text>
  <text class="msg" x="725" y="788" text-anchor="middle" fill="#7e62d9">prune expired slots first</text>
  <rect class="legend" x="82" y="932" width="1336" height="40" rx="8"/>
  <text class="footer" x="750" y="958" text-anchor="middle">Release and renew scripts mutate Redis only when the stored token still matches this member.</text>
</svg>
