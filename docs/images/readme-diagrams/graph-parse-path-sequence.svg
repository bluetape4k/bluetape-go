<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">graph Parse and Path Sequence</title>
  <desc id="desc">Sequence diagram for the graph package showing ParseVertex, ParseEdge, scalar value validation, shallow property cloning, PathStep creation, NewPath validation, and redacted ValidationError reporting.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="seqArrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6"/>
    </marker>
    <marker id="seqArrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c1842f" stroke="#c1842f"/>
    </marker>
    <marker id="seqArrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8d3e" stroke="#5f8d3e"/>
    </marker>
    <marker id="seqArrow-teal" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f8f8a" stroke="#2f8f8a"/>
    </marker>
    <marker id="seqArrow-red" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b65b67" stroke="#b65b67"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .participant-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .role, .msg, .region, .footer { font-family: "Comic Mono", "SFMono-Regular", monospace; fill: #526276; }
      .subtitle { font-size: 17px; }
      .participant-title { font-size: 22px; }
      .role { font-size: 13px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: 0.88; }
      .call, .return, .error { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .call { stroke-width: 3; }
      .return, .error { stroke-width: 2.7; stroke-dasharray: 9 8; }
      .phase { fill: none; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .phase-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 15; }
      .badge { stroke-width: 1.6; }
      .badgeText { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1320"/>
  <rect class="frame" x="34" y="30" width="1732" height="1256" rx="8"/>
  <text class="title" x="72" y="88">graph Parse and Path Sequence</text>
  <text class="subtitle" x="76" y="120">Raw IDs and labels are normalized at the boundary, values are validated, and Path remains a container rather than a traversal proof.</text>

  <rect class="participant" x="72" y="174" width="220" height="72" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="participant-title" x="182" y="202" text-anchor="middle">Caller</text>
  <text class="role" x="182" y="224" text-anchor="middle">adapter/example</text>
  <line class="lifeline" x1="182" y1="246" x2="182" y2="1210"/>

  <rect class="participant" x="386" y="174" width="230" height="72" fill="#f3efff" stroke="#9b7aec"/>
  <text class="participant-title" x="501" y="202" text-anchor="middle">Scalar constructors</text>
  <text class="role" x="501" y="224" text-anchor="middle">ID + Label</text>
  <line class="lifeline" x1="501" y1="246" x2="501" y2="1210"/>

  <rect class="participant" x="724" y="174" width="250" height="72" fill="#edf9f4" stroke="#63b891"/>
  <text class="participant-title" x="849" y="202" text-anchor="middle">Vertex / Edge</text>
  <text class="role" x="849" y="224" text-anchor="middle">parse + new</text>
  <line class="lifeline" x1="849" y1="246" x2="849" y2="1210"/>

  <rect class="participant" x="1082" y="174" width="240" height="72" fill="#fff4de" stroke="#d59c3f"/>
  <text class="participant-title" x="1202" y="202" text-anchor="middle">Properties</text>
  <text class="role" x="1202" y="224" text-anchor="middle">shallow clone</text>
  <line class="lifeline" x1="1202" y1="246" x2="1202" y2="1210"/>

  <rect class="participant" x="1408" y="174" width="210" height="72" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="participant-title" x="1513" y="202" text-anchor="middle">Path builder</text>
  <text class="role" x="1513" y="224" text-anchor="middle">steps + weight</text>
  <line class="lifeline" x1="1513" y1="246" x2="1513" y2="1210"/>

  <rect class="participant" x="1644" y="174" width="124" height="72" fill="#fff0f0" stroke="#d56b7d"/>
  <text class="participant-title" x="1706" y="202" text-anchor="middle">Error</text>
  <text class="role" x="1706" y="224" text-anchor="middle">redacted</text>
  <line class="lifeline" x1="1706" y1="246" x2="1706" y2="1210"/>

  <rect class="activation" x="175" y="296" width="14" height="862" rx="7"/>
  <rect class="activation" x="494" y="390" width="14" height="286" rx="7"/>
  <rect class="activation" x="842" y="310" width="14" height="548" rx="7"/>
  <rect class="activation" x="1195" y="530" width="14" height="126" rx="7"/>
  <rect class="activation" x="1506" y="790" width="14" height="254" rx="7"/>
  <rect class="activation" x="1699" y="1080" width="14" height="78" rx="7"/>

  <rect class="phase" x="690" y="274" width="566" height="416" rx="16"/>
  <rect class="phase-label" x="712" y="292" width="176" height="30" rx="15"/>
  <text class="region" x="736" y="312">element parse</text>

  <rect class="phase" x="1372" y="754" width="280" height="318" rx="16"/>
  <rect class="phase-label" x="1394" y="772" width="164" height="30" rx="15"/>
  <text class="region" x="1418" y="792">path scope</text>

  <path class="call" d="M182 320H849" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="410" y="278" width="214" height="30" rx="15"/>
  <circle class="badge" cx="432" cy="293" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="432" y="297" text-anchor="middle">1</text>
  <text class="msg" x="522" y="298" text-anchor="middle" fill="#4f86c6">ParseVertex(...)</text>

  <path class="call" d="M849 400H501" stroke="#8a65d6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="570" y="358" width="214" height="30" rx="15"/>
  <circle class="badge" cx="592" cy="373" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="592" y="377" text-anchor="middle">2</text>
  <text class="msg" x="680" y="378" text-anchor="middle" fill="#4f86c6">NewID/Label</text>

  <path class="return" d="M501 480H849" stroke="#2f8f8a" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="566" y="438" width="222" height="30" rx="15"/>
  <circle class="badge" cx="588" cy="453" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="588" y="457" text-anchor="middle">3</text>
  <text class="msg" x="680" y="458" text-anchor="middle" fill="#2f8f8a">typed scalars</text>

  <path class="call" d="M849 560H1202" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="916" y="518" width="216" height="30" rx="15"/>
  <circle class="badge" cx="938" cy="533" r="13" fill="#c1842f" stroke="#c1842f"/>
  <text class="badgeText" x="938" y="537" text-anchor="middle">4</text>
  <text class="msg" x="1030" y="538" text-anchor="middle" fill="#c1842f">Properties.Clone</text>

  <path class="return" d="M1202 640H849" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="922" y="598" width="210" height="30" rx="15"/>
  <circle class="badge" cx="944" cy="613" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="944" y="617" text-anchor="middle">5</text>
  <text class="msg" x="1030" y="618" text-anchor="middle" fill="#5f8d3e">shallow copy</text>

  <path class="return" d="M849 720H182" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="386" y="678" width="264" height="30" rx="15"/>
  <circle class="badge" cx="408" cy="693" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="408" y="697" text-anchor="middle">6</text>
  <text class="msg" x="522" y="698" text-anchor="middle" fill="#5f8d3e">Vertex / Edge value</text>

  <path class="call" d="M182 800H1513" stroke="#64748b" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="704" y="758" width="288" height="30" rx="15"/>
  <circle class="badge" cx="726" cy="773" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="726" y="777" text-anchor="middle">7</text>
  <text class="msg" x="852" y="778" text-anchor="middle" fill="#2f8f8a">VertexStep / EdgeStep</text>

  <path class="call" d="M1513 880H849" stroke="#64748b" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="1078" y="838" width="210" height="30" rx="15"/>
  <circle class="badge" cx="1100" cy="853" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="1100" y="857" text-anchor="middle">8</text>
  <text class="msg" x="1186" y="858" text-anchor="middle" fill="#2f8f8a">Validate()</text>

  <path class="call" d="M182 960H1513" stroke="#64748b" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="728" y="918" width="240" height="30" rx="15"/>
  <circle class="badge" cx="750" cy="933" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="750" y="937" text-anchor="middle">9</text>
  <text class="msg" x="852" y="938" text-anchor="middle" fill="#2f8f8a">NewPath(steps)</text>

  <path class="return" d="M1513 1040H182" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="720" y="998" width="258" height="30" rx="15"/>
  <circle class="badge" cx="742" cy="1013" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="742" y="1017" text-anchor="middle">10</text>
  <text class="msg" x="852" y="1018" text-anchor="middle" fill="#5f8d3e">Path length/weight</text>

  <path class="error" d="M182 1120H1706" stroke="#b65b67" marker-end="url(#seqArrow-red)"/>
  <rect class="pill" x="774" y="1078" width="348" height="30" rx="15"/>
  <circle class="badge" cx="796" cy="1093" r="13" fill="#b65b67" stroke="#b65b67"/>
  <text class="badgeText" x="796" y="1097" text-anchor="middle">11</text>
  <text class="msg" x="952" y="1098" text-anchor="middle" fill="#b65b67">ValidationError without raw value</text>

  <rect class="pill" x="392" y="1234" width="1016" height="34" rx="17"/>
  <text class="footer" x="900" y="1256" text-anchor="middle">NewPath validates step values and weight only; endpoint continuity and traversal correctness are owned by future adapters or algorithms.</text>
</svg>
