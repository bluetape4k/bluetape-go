<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760">
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity=".22"/></filter></defs>

<style>@font-face{font-family:'Architects Daughter';src:local('Architects Daughter');}@font-face{font-family:'Comic Mono';src:local('Comic Mono');}.bg{fill:#f8fafc}.title{font:42px 'Architects Daughter','Comic Sans MS',cursive;fill:#111827}.sub{font:21px 'Comic Mono','Courier New',monospace;fill:#475569}.card-title{font:24px 'Comic Mono','Courier New',monospace;font-weight:700;fill:#111827}.body{font:17px 'Comic Mono','Courier New',monospace;fill:#334155}.small{font:15px 'Comic Mono','Courier New',monospace;fill:#475569}.label{font:16px 'Comic Mono','Courier New',monospace;fill:#2563eb;font-weight:700}.arrow{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#64748b;stroke-width:3;stroke-dasharray:10 9;fill:none;marker-end:url(#arrow-gray)}.card{fill:#fff;stroke-width:4}.alt{fill:#f59e0b;fill-opacity:.12;stroke:#f59e0b;stroke-opacity:.55;stroke-dasharray:10 8;stroke-width:3}</style>

<rect class="bg" width="1320" height="760"/>
<text class="title" x="52" y="72">Redis Bloom Key Layout</text>
<text class="sub" x="56" y="112">One hash-tagged namespace keeps bitmap bits and immutable config in the same Redis Cluster slot.</text>
<rect class="card" x="60" y="180" width="300" height="160" rx="16" fill="#eff6ff" stroke="#2563eb" filter="url(#shadow)"/>
<text class="card-title" x="82" y="218">Bloom caller</text>
<text class="body" x="84" y="252">Put / MightContain</text>
<text class="body" x="84" y="279">BitCount / IsEmpty</text>
<text class="body" x="84" y="306">Clear is operator action</text>
<rect class="card" x="470" y="150" width="350" height="215" rx="16" fill="#ecfdf5" stroke="#059669" filter="url(#shadow)"/>
<text class="card-title" x="492" y="188">Lua script guard</text>
<text class="body" x="494" y="222">fingerprint required</text>
<text class="body" x="494" y="249">config mismatch fails</text>
<text class="body" x="494" y="276">config corrupt fails</text>
<text class="body" x="494" y="303">offsets from hasher</text>
<rect class="card" x="930" y="135" width="330" height="225" rx="16" fill="#f5f3ff" stroke="#7c3aed" filter="url(#shadow)"/>
<text class="card-title" x="952" y="173">{namespace}:config</text>
<text class="body" x="954" y="207">hash metadata</text>
<text class="body" x="954" y="234">version + family</text>
<text class="body" x="954" y="261">bit size + hash count</text>
<text class="body" x="954" y="288">hasher key + fingerprint</text>
<rect class="card" x="930" y="455" width="330" height="145" rx="16" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
<text class="card-title" x="952" y="493">{namespace}:bits</text>
<text class="body" x="954" y="527">bitmap string</text>
<text class="body" x="954" y="554">GETBIT / SETBIT</text>
<text class="body" x="954" y="581">BITCOUNT / STRLEN</text>
<image href="data:image/svg+xml;base64," x="1170" y="160" width="58" height="58"/>
<path class="arrow" d="M360 255 L470 255"/><text class="label" x="392" y="243">operation</text>
<path class="arrow" d="M820 245 L930 245"/><text class="label" x="845" y="233">check</text>
<path class="arrow" d="M645 365 C700 455 820 520 930 520"/><text class="label" x="720" y="458">read/write bits</text>
<path class="dashed" d="M930 300 C790 380 705 445 645 365"/><text class="label" x="805" y="400">hash slot</text>
<rect class="alt" x="58" y="650" width="1200" height="70" rx="16"/><text class="small" x="82" y="680">alt: missing config, mismatched fingerprint, or evicted bits are operational incidents; rebuild into a new namespace when needed.</text>
<text class="small" x="82" y="705">Boundary: namespaces are operational identifiers; do not put raw users, emails, secrets, or bearer tokens in the namespace.</text>
</svg>
