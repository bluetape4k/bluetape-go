<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">batch Step and Job Flow</title>
  <desc id="desc">A Job runs Steps sequentially; each Step reads, processes, chunks, writes, and checkpoints progress.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4f77c9" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#319873" stroke-dasharray="none"/></marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#cf8428"/></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#c85d73" stroke-dasharray="none"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#7e62d9" stroke-dasharray="none"/></marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7d9c"/></marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .part-title, .card-title, .panel-title { font-family: "Architects Daughter"; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .body, .small, .msg, .region, .footer { font-family: "Comic Mono"; fill: #526276; }
      .subtitle { font-size: 17px; }
      .panel-title { font-size: 24px; }
      .card-title { font-size: 22px; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 12px; font-weight: 700; }
      .footer { font-size: 14px; }
      .panel { stroke: #d0deeb; stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card { stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card-divider { stroke-width: 1.1; opacity: .45; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: .88; }
      .route { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .alt { fill: #f7f2ff; fill-opacity: .22; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .alt-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .else-line { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 14; }
      .badge { stroke-width: 1.6; }
      .badge-text { font-family: "Comic Mono"; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .legend { fill: #ffffff; stroke: #d4e0ec; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect class="canvas" width="1500" height="920"/>
  <rect class="frame" x="34" y="30" width="1432" height="856" rx="8"/>
  <text class="title" x="72" y="88">batch Step and Job Flow</text>
  <text class="subtitle" x="76" y="120">A Job runs Steps sequentially; each Step reads, processes, chunks, writes, and checkpoints progress.</text>
  <rect class="card" x="92" y="205" width="330" height="180" rx="8" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="card-title" x="257" y="247" text-anchor="middle">Job</text>
  <path class="card-divider" d="M92 267H422" stroke="#6d9df0"/>
  <path class="card-divider" d="M92 337H422" stroke="#6d9df0"/>
  <text class="body" x="116" y="295">ordered Runner list</text>
  <text class="body" x="116" y="319">stops on failure/cancel</text>
  <text class="body" x="116" y="361">children reports retained</text>
  <rect class="card" x="520" y="175" width="390" height="240" rx="8" fill="#edf9f4" stroke="#63b891"/>
  <text class="card-title" x="715" y="217" text-anchor="middle">Step[I,O]</text>
  <path class="card-divider" d="M520 237H910" stroke="#63b891"/>
  <path class="card-divider" d="M520 307H910" stroke="#63b891"/>
  <text class="body" x="544" y="265">Reader -&gt; Processor</text>
  <text class="body" x="544" y="289">Writer receives chunks</text>
  <text class="body" x="544" y="331">RetryPolicy and SkipPolicy</text>
  <text class="body" x="544" y="355">CheckpointStore optional</text>
  <rect class="card" x="1030" y="180" width="370" height="230" rx="8" fill="#fff4de" stroke="#d59c3f"/>
  <text class="card-title" x="1215" y="222" text-anchor="middle">Report</text>
  <path class="card-divider" d="M1030 242H1400" stroke="#d59c3f"/>
  <path class="card-divider" d="M1030 312H1400" stroke="#d59c3f"/>
  <text class="body" x="1054" y="270">completed / failed</text>
  <text class="body" x="1054" y="294">cancelled / partial</text>
  <text class="body" x="1054" y="336">read/write/skip counts</text>
  <text class="body" x="1054" y="360">first error preserved</text>
  <rect class="card" x="312" y="545" width="370" height="165" rx="8" fill="#f3efff" stroke="#9b7aec"/>
  <text class="card-title" x="497" y="587" text-anchor="middle">Checkpoint</text>
  <path class="card-divider" d="M312 607H682" stroke="#9b7aec"/>
  <path class="card-divider" d="M312 674H682" stroke="#9b7aec"/>
  <text class="body" x="336" y="635">restore before read</text>
  <text class="body" x="336" y="659">save after writes</text>
  <text class="body" x="336" y="701">reader owns position</text>
  <rect class="card" x="865" y="545" width="390" height="165" rx="8" fill="#fff0f0" stroke="#dc2626"/>
  <text class="card-title" x="1060" y="587" text-anchor="middle">Resource cleanup</text>
  <path class="card-divider" d="M865 607H1255" stroke="#dc2626"/>
  <path class="card-divider" d="M865 674H1255" stroke="#dc2626"/>
  <text class="body" x="889" y="635">open reader/writer</text>
  <text class="body" x="889" y="659">close with WithoutCancel</text>
  <text class="body" x="889" y="701">close error can fail report</text>
  <path class="route" d="M422 300H520" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <text class="msg" x="470" y="282" text-anchor="middle" fill="#4f77c9">Run(ctx)</text>
  <path class="route" d="M910 300H1030" stroke="#319873" marker-end="url(#arrow-green)"/>
  <text class="msg" x="970" y="282" text-anchor="middle" fill="#319873">finish</text>
  <path class="route" d="M690 415 V430 Q640 500 490 530 V545" stroke="#7e62d9" marker-end="url(#arrow-purple)"/>
  <text class="msg" x="595" y="494" text-anchor="middle" fill="#7e62d9">restore/save</text>
  <path class="route" d="M720 415 V430 Q780 500 955 530 V545" stroke="#c85d73" marker-end="url(#arrow-red)"/>
  <text class="msg" x="820" y="494" text-anchor="middle" fill="#c85d73">defer close</text>
  <rect class="legend" x="82" y="842" width="1336" height="40" rx="8"/>
  <text class="footer" x="750" y="868" text-anchor="middle">Use batch for deterministic chunk-oriented work; reports explain exactly where execution stopped.</text>
</svg>
