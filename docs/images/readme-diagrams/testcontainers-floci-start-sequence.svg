  <text class="msg" x="928" y="1138" text-anchor="middle" fill="#4f86c6">NewFromConfig + client opts</text>

  <path class="call" d="M1681 1240H951" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="1204" y="1198" width="226" height="30" rx="15"/>
  <circle class="badge" cx="1226" cy="1213" r="13" fill="#c1842f" stroke="#c1842f"/>
