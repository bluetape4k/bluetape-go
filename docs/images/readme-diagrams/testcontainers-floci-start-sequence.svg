  <path class="error" d="M164 1320H1681" stroke="#b65b67" marker-end="url(#seqArrow-red)"/>
  <rect class="pill" x="800" y="1278" width="244" height="30" rx="15"/>
  <circle class="badge" cx="822" cy="1293" r="13" fill="#b65b67" stroke="#b65b67"/>
