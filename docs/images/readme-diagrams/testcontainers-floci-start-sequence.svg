  <text class="msg" x="928" y="1298" text-anchor="middle" fill="#b65b67">optional ExportEnv</text>

  <path class="error" d="M164 1380H951" stroke="#b65b67" marker-end="url(#seqArrow-red)"/>
  <rect class="pill" x="456" y="1338" width="206" height="30" rx="15"/>
  <circle class="badge" cx="478" cy="1353" r="13" fill="#b65b67" stroke="#b65b67"/>
  <text class="badgeText" x="478" y="1357" text-anchor="middle">14</text>
  <text class="msg" x="566" y="1358" text-anchor="middle" fill="#b65b67">t.Cleanup Stop</text>

  <rect class="pill" x="254" y="1438" width="1292" height="34" rx="17"/>
  <text class="footer" x="900" y="1460" text-anchor="middle">Run Docker-backed Floci packages serially; enable the smoke lane with BLUETAPE_FLOCI_SMOKE=1.</text>
