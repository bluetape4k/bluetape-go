<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1520" viewBox="0 0 1800 1520" role="img" aria-labelledby="title desc">
  <title id="title">testcontainers/floci Start Sequence</title>
  <desc id="desc">Sequence diagram for testcontainers/floci showing Start, upstream Floci builder creation, service config application, container start and readiness, Details extraction, AWS SDK config loading, service client smoke tests, optional env export, and cleanup Stop.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="seqArrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8d3e" stroke="#5f8d3e" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c1842f" stroke="#c1842f" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-teal" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f8f8a" stroke="#2f8f8a" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-red" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b65b67" stroke="#b65b67" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .participant-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .role, .msg, .region, .footer { font-family: "Comic Mono", "SFMono-Regular", monospace; fill: #526276; }
      .subtitle { font-size: 17px; }
      .participant-title { font-size: 21px; }
      .role { font-size: 13px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: 0.88; }
      .call, .return, .error { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .call { stroke-width: 3; }
      .return, .error { stroke-width: 2.7; stroke-dasharray: 9 8; }
      .phase { fill: none; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .phase-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 15; }
      .badge { stroke-width: 1.6; }
      .badgeText { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1520"/>
  <rect class="frame" x="34" y="30" width="1732" height="1456" rx="8"/>
  <text class="title" x="72" y="88">testcontainers/floci Start Sequence</text>
  <text class="subtitle" x="76" y="120">The helper owns startup/config extraction; tests own clients, service assertions, optional env export, and Docker-lane execution policy.</text>

  <rect class="participant" x="72" y="174" width="184" height="72" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="participant-title" x="164" y="202" text-anchor="middle">Test</text>
  <text class="role" x="164" y="224" text-anchor="middle">ctx + testing.TB</text>
  <line class="lifeline" x1="164" y1="246" x2="164" y2="1412"/>

  <rect class="participant" x="314" y="174" width="216" height="72" fill="#edf9f4" stroke="#63b891"/>
  <text class="participant-title" x="422" y="202" text-anchor="middle">flocitestcontainer</text>
  <text class="role" x="422" y="224" text-anchor="middle">Start / LoadConfig</text>
  <line class="lifeline" x1="422" y1="246" x2="422" y2="1412"/>

  <rect class="participant" x="588" y="174" width="204" height="72" fill="#f3efff" stroke="#9b7aec"/>
  <text class="participant-title" x="690" y="202" text-anchor="middle">Floci builder</text>
  <text class="role" x="690" y="224" text-anchor="middle">service config</text>
  <line class="lifeline" x1="690" y1="246" x2="690" y2="1412"/>

  <rect class="participant" x="846" y="174" width="210" height="72" fill="#fff4de" stroke="#d59c3f"/>
  <text class="participant-title" x="951" y="202" text-anchor="middle">Floci container</text>
  <text class="role" x="951" y="224" text-anchor="middle">endpoint + Stop</text>
  <line class="lifeline" x1="951" y1="246" x2="951" y2="1412"/>

  <rect class="participant" x="1112" y="174" width="178" height="72" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="participant-title" x="1201" y="202" text-anchor="middle">Details</text>
  <text class="role" x="1201" y="224" text-anchor="middle">connection map</text>
  <line class="lifeline" x1="1201" y1="246" x2="1201" y2="1412"/>

  <rect class="participant" x="1350" y="174" width="194" height="72" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="participant-title" x="1447" y="202" text-anchor="middle">AWS config</text>
  <text class="role" x="1447" y="224" text-anchor="middle">SDK v2 loader</text>
