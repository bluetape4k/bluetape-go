  <rect class="phase" x="1100" y="752" width="474" height="368" rx="16"/>
  <rect class="phase-label" x="1122" y="714" width="226" height="30" rx="15"/>
  <text class="region" x="1146" y="734">config extraction</text>

  <rect class="phase" x="1558" y="1100" width="156" height="196" rx="16"/>
  <rect class="phase-label" x="1396" y="1062" width="276" height="30" rx="15"/>
  <text class="region" x="1420" y="1082">caller-owned service use</text>

  <path class="call" d="M164 340H422" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="224" y="298" width="148" height="30" rx="15"/>
  <circle class="badge" cx="244" cy="313" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="244" y="317" text-anchor="middle">1</text>
  <text class="msg" x="304" y="318" text-anchor="middle" fill="#4f86c6">Start</text>

  <path class="call" d="M422 420H690" stroke="#2f8f8a" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="474" y="378" width="168" height="30" rx="15"/>
  <circle class="badge" cx="494" cy="393" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="494" y="397" text-anchor="middle">2</text>
  <text class="msg" x="562" y="398" text-anchor="middle" fill="#2f8f8a">New builder</text>

  <path class="call" d="M422 500H690" stroke="#8a65d6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="450" y="458" width="224" height="30" rx="15"/>
  <circle class="badge" cx="472" cy="473" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="472" y="477" text-anchor="middle">3</text>
  <text class="msg" x="566" y="478" text-anchor="middle" fill="#4f86c6">apply service config</text>

  <path class="call" d="M690 580H951" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="756" y="538" width="128" height="30" rx="15"/>
  <circle class="badge" cx="776" cy="553" r="13" fill="#c1842f" stroke="#c1842f"/>
  <text class="badgeText" x="776" y="557" text-anchor="middle">4</text>
  <text class="msg" x="826" y="558" text-anchor="middle" fill="#c1842f">Start</text>

  <path class="return" d="M951 660H422" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
