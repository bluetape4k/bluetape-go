  <text class="badgeText" x="726" y="737" text-anchor="middle">6</text>
  <text class="msg" x="816" y="738" text-anchor="middle" fill="#2f8f8a">extract Details</text>

  <path class="return" d="M1201 860H164" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="562" y="818" width="246" height="30" rx="15"/>
  <circle class="badge" cx="584" cy="833" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="584" y="837" text-anchor="middle">7</text>
  <text class="msg" x="690" y="838" text-anchor="middle" fill="#5f8d3e">Details + cleanup</text>

  <path class="call" d="M164 940H422" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="210" y="898" width="168" height="30" rx="15"/>
  <circle class="badge" cx="232" cy="913" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="232" y="917" text-anchor="middle">8</text>
  <text class="msg" x="300" y="918" text-anchor="middle" fill="#4f86c6">LoadConfig</text>

  <path class="call" d="M422 1020H1447" stroke="#2f8f8a" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="794" y="978" width="278" height="30" rx="15"/>
  <circle class="badge" cx="816" cy="993" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="816" y="997" text-anchor="middle">9</text>
  <text class="msg" x="940" y="998" text-anchor="middle" fill="#2f8f8a">region endpoint credentials</text>

  <path class="return" d="M1447 1100H164" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="716" y="1058" width="174" height="30" rx="15"/>
  <circle class="badge" cx="738" cy="1073" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
