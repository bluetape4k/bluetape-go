<svg xmlns="http://www.w3.org/2000/svg" width="1275" height="800" viewBox="0 0 1275 800">
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity=".22"/></filter></defs>

<style>
@font-face{font-family:'Architects Daughter';src:local('Architects Daughter');}
@font-face{font-family:'Comic Mono';src:local('Comic Mono');}
.bg{fill:#f8fafc}.title{font:43px 'Architects Daughter','Comic Sans MS',cursive;fill:#111827}.sub{font:21px 'Comic Mono','Courier New',monospace;fill:#475569}.card-title{font:24px 'Comic Mono','Courier New',monospace;font-weight:700;fill:#111827}.body{font:17px 'Comic Mono','Courier New',monospace;fill:#334155}.small{font:15px 'Comic Mono','Courier New',monospace;fill:#475569}.label{font:16px 'Comic Mono','Courier New',monospace;fill:#2563eb;font-weight:700}.note{font:16px 'Comic Mono','Courier New',monospace;fill:#475569}.arrow{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#64748b;stroke-width:3;stroke-dasharray:10 9;fill:none;marker-end:url(#arrow-gray)}.card{fill:#fff;stroke-width:4}.alt{fill:#f59e0b;fill-opacity:.12;stroke:#f59e0b;stroke-opacity:.55;stroke-dasharray:10 8;stroke-width:3}.footer{fill:#fff;stroke:#cbd5e1;stroke-width:2}
</style>

<rect class="bg" width="1275" height="800"/>
<text class="title" x="52" y="72">Redis Lock Owner-Token Lifecycle</text>
<text class="sub" x="56" y="112">A single Redis key protects short coordination work with owner-safe unlock semantics.</text>
<rect class="card" x="65" y="190" width="285" height="150" rx="16" fill="#eff6ff" stroke="#2563eb" filter="url(#shadow)"/>
<text class="card-title" x="87" y="228">Caller</text>
<text class="body" x="89" y="262">TryLock(ctx)</text>
<text class="body" x="89" y="289">one acquire attempt</text>
<text class="body" x="89" y="316">context preserved</text>
<rect class="card" x="465" y="165" width="315" height="205" rx="16" fill="#ecfdf5" stroke="#059669" filter="url(#shadow)"/>
<text class="card-title" x="487" y="203">Mutex</text>
<text class="body" x="489" y="237">SET NX key token TTL</text>
<text class="body" x="489" y="264">random or custom token</text>
<text class="body" x="489" y="291">ErrNotAcquired on conflict</text>
<rect class="card" x="900" y="165" width="320" height="205" rx="16" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
<text class="card-title" x="922" y="203">Redis key</text>
<text class="body" x="924" y="237">value = owner token</text>
<text class="body" x="924" y="264">TTL cleans abandoned work</text>
<text class="body" x="924" y="291">single instance only</text>
<image href="data:image/svg+xml;base64," x="1130" y="190" width="58" height="58"/>
<rect class="card" x="465" y="465" width="315" height="135" rx="16" fill="#f5f3ff" stroke="#7c3aed" filter="url(#shadow)"/>
<text class="card-title" x="487" y="503">Lease</text>
<text class="body" x="489" y="537">Key() and Token()</text>
<text class="body" x="489" y="564">Unlock(ctx) returns bool</text>
<rect class="card" x="900" y="455" width="320" height="155" rx="16" fill="#fff7ed" stroke="#f97316" filter="url(#shadow)"/>
<text class="card-title" x="922" y="493">Unlock script</text>
<text class="body" x="924" y="527">GET key == token</text>
<text class="body" x="924" y="554">DEL only for owner</text>
<text class="body" x="924" y="581">mismatch leaves key intact</text>
<path class="arrow" d="M350 260 L465 260"/><text class="label" x="382" y="248">try</text>
<path class="arrow" d="M780 260 L900 260"/><text class="label" x="815" y="248">SET NX</text>
<path class="dashed" d="M900 335 C770 430 655 465 625 465"/><text class="label" x="735" y="420">lease token</text>
<path class="arrow" d="M780 532 L900 532"/><text class="label" x="815" y="520">Lua unlock</text>
<path class="dashed" d="M900 585 C700 690 230 610 210 340"/><text class="label" x="460" y="660">released or not owner</text>
<rect class="alt" x="58" y="690" width="1162" height="70" rx="16"/><text class="small" x="82" y="720">alt: this is not Redlock and does not issue fencing tokens; TTL renewal and blocking retries belong above this package.</text>
<text class="small" x="82" y="745">Pick a TTL that covers the protected operation, or compose a higher-level renewal strategy.</text>
</svg>
