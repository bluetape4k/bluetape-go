<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Redis Lock Owner-Token Runtime Map</title>
  <desc id="desc">One SET NX key protects short coordination work; owner-safe Lua unlock prevents deleting another lease.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4f77c9"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#319873"/></marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#cf8428"/></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#c85d73"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#7e62d9"/></marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7d9c"/></marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .part-title, .card-title, .panel-title { font-family: "Architects Daughter"; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .body, .small, .msg, .region, .footer { font-family: "Comic Mono"; fill: #526276; }
      .subtitle { font-size: 17px; }
      .panel-title { font-size: 24px; }
      .card-title { font-size: 22px; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 12px; font-weight: 700; }
      .footer { font-size: 14px; }
      .panel { stroke: #d0deeb; stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card { stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card-divider { stroke-width: 1.1; opacity: .45; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: .88; }
      .route { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .alt { fill: #f7f2ff; fill-opacity: .22; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .alt-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .else-line { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 14; }
      .badge { stroke-width: 1.6; }
      .badge-text { font-family: "Comic Mono"; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .legend { fill: #ffffff; stroke: #d4e0ec; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect class="canvas" width="1500" height="920"/>
  <rect class="frame" x="34" y="30" width="1432" height="856" rx="8"/>
  <text class="title" x="72" y="88">Redis Lock Owner-Token Runtime Map</text>
  <text class="subtitle" x="76" y="120">One SET NX key protects short coordination work; owner-safe Lua unlock prevents deleting another lease.</text>
  <rect class="card" x="92" y="210" width="310" height="150" rx="8" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="card-title" x="247" y="252" text-anchor="middle">Caller</text>
  <path class="card-divider" d="M92 272H402" stroke="#6d9df0"/>
  <text class="body" x="116" y="300">TryLock(ctx)</text>
  <text class="body" x="116" y="324">one acquire attempt</text>
  <text class="body" x="116" y="348">context preserved</text>
  <rect class="card" x="522" y="190" width="390" height="190" rx="8" fill="#edf9f4" stroke="#63b891"/>
  <text class="card-title" x="717" y="232" text-anchor="middle">Mutex</text>
  <path class="card-divider" d="M522 252H912" stroke="#63b891"/>
  <path class="card-divider" d="M522 322H912" stroke="#63b891"/>
  <text class="body" x="546" y="280">SET NX key token TTL</text>
  <text class="body" x="546" y="304">random or custom token</text>
  <text class="body" x="546" y="346">ErrNotAcquired on conflict</text>
  <rect class="card" x="1038" y="190" width="330" height="190" rx="8" fill="#fff0f0" stroke="#dc2626"/>
  <image href="data:image/svg+xml;base64," x="1058" y="208" width="46" height="46"/>
  <text class="card-title" x="1223" y="232" text-anchor="middle">Redis key</text>
  <path class="card-divider" d="M1038 252H1368" stroke="#dc2626"/>
  <path class="card-divider" d="M1038 322H1368" stroke="#dc2626"/>
  <text class="body" x="1062" y="280">value = owner token</text>
  <text class="body" x="1062" y="304">TTL cleans abandoned work</text>
  <text class="body" x="1062" y="346">single instance only</text>
  <rect class="card" x="522" y="530" width="390" height="145" rx="8" fill="#f3efff" stroke="#9b7aec"/>
  <text class="card-title" x="717" y="572" text-anchor="middle">Lease</text>
  <path class="card-divider" d="M522 592H912" stroke="#9b7aec"/>
  <text class="body" x="546" y="620">Key() and Token()</text>
  <text class="body" x="546" y="644">Unlock(ctx) returns bool</text>
  <rect class="card" x="1038" y="530" width="330" height="145" rx="8" fill="#fff4de" stroke="#d59c3f"/>
  <text class="card-title" x="1203" y="572" text-anchor="middle">Unlock script</text>
  <path class="card-divider" d="M1038 592H1368" stroke="#d59c3f"/>
  <text class="body" x="1062" y="620">GET key == token</text>
  <text class="body" x="1062" y="644">DEL only for owner</text>
  <text class="body" x="1062" y="668">mismatch leaves key intact</text>
  <path class="route" d="M402 285 L522 285" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <text class="msg" x="462" y="265" text-anchor="middle" fill="#4f77c9">try</text>
  <path class="route" d="M912 285 L1038 285" stroke="#319873" marker-end="url(#arrow-green)"/>
  <text class="msg" x="975" y="265" text-anchor="middle" fill="#319873">SET NX</text>
  <path class="return" d="M1203 380 C1070 455 912 485 717 530" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <text class="msg" x="900" y="485" text-anchor="middle" fill="#64748b">lease token</text>
  <path class="route" d="M912 602 L1038 602" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <text class="msg" x="975" y="582" text-anchor="middle" fill="#4f77c9">Lua unlock</text>
  <path class="return" d="M522 628 C360 690 238 540 247 360" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <text class="msg" x="520" y="730" text-anchor="middle" fill="#64748b">released or not owner</text>
  <rect class="legend" x="82" y="842" width="1336" height="40" rx="8"/>
  <text class="footer" x="750" y="868" text-anchor="middle">This is not Redlock and does not issue fencing tokens; choose TTL or compose renewal above the package.</text>
</svg>
