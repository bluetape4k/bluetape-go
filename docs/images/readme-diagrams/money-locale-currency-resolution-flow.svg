<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="1120" viewBox="0 0 2050 1120">
<defs>
  <style>
    .title { font-family: 'Architects Daughter'; font-size: 34px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-family: 'Comic Mono'; font-size: 16px; fill: #64748B; }
    .panel-label { font-family: 'Architects Daughter'; font-size: 20px; font-weight: 700; fill: #1E293B; }
    .card-title { font-family: 'Architects Daughter'; font-size: 22px; font-weight: 700; fill: #1E293B; }
    .detail { font-family: 'Comic Mono'; font-size: 14px; fill: #1E293B; }
    .route-label { font-family: 'Comic Mono'; font-size: 13px; font-weight: 700; }
    .footer { font-family: 'Comic Mono'; font-size: 14px; fill: #1E293B; }
  </style>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#94A3B8" flood-opacity="0.22"/>
  </filter>
  <marker id="2563EB" viewBox="0 0 5 5" refX="4.5" refY="2.5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2563EB"/>
  </marker>
<marker id="7C3AED" viewBox="0 0 5 5" refX="4.5" refY="2.5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7C3AED"/>
  </marker>
<marker id="16A34A" viewBox="0 0 5 5" refX="4.5" refY="2.5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#16A34A"/>
  </marker>
<marker id="D97706" viewBox="0 0 5 5" refX="4.5" refY="2.5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#D97706"/>
  </marker>
<marker id="DC2626" viewBox="0 0 5 5" refX="4.5" refY="2.5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#DC2626"/>
  </marker>
