<svg xmlns="http://www.w3.org/2000/svg" width="1285" height="760" viewBox="0 0 1285 760">
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity=".22"/></filter></defs>

<style>
@font-face{font-family:'Architects Daughter';src:local('Architects Daughter');}
@font-face{font-family:'Comic Mono';src:local('Comic Mono');}
.bg{fill:#f8fafc}.title{font:42px 'Architects Daughter';fill:#111827}.sub{font:21px 'Comic Mono';fill:#475569}.card-title{font:24px 'Comic Mono';font-weight:700;fill:#111827}.body{font:17px 'Comic Mono';fill:#334155}.small{font:15px 'Comic Mono';fill:#475569}.label{font:16px 'Comic Mono';fill:#2563eb;font-weight:700}.arrow{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#64748b;stroke-width:3;stroke-dasharray:10 9;fill:none;marker-end:url(#arrow-gray)}.card{fill:#fff;stroke-width:4}.alt{fill:#f59e0b;fill-opacity:.12;stroke:#f59e0b;stroke-opacity:.55;stroke-dasharray:10 8;stroke-width:3}
</style>

<rect class="bg" width="1285" height="760"/>
<text class="title" x="52" y="72">money Locale Currency Resolution Flow</text>
<text class="sub" x="56" y="112">Locale mapping is a convenience for explicit current-region tender only.</text>
<rect class="card" x="70" y="185" width="300" height="160" rx="16" fill="#eff6ff" stroke="#2563eb" filter="url(#shadow)"/>
<text class="card-title" x="92" y="223">BCP47 tag</text>
<text class="body" x="94" y="257">trim and normalize</text>
<text class="body" x="94" y="284">requires explicit region</text>
<text class="body" x="94" y="311">language.Parse guard</text>
<rect class="card" x="480" y="165" width="340" height="205" rx="16" fill="#ecfdf5" stroke="#059669" filter="url(#shadow)"/>
<text class="card-title" x="502" y="203">Region lookup</text>
<text class="body" x="504" y="237">golang.org/x/text</text>
<text class="body" x="504" y="264">CLDR current tender</text>
<text class="body" x="504" y="291">count tender currencies</text>
<rect class="card" x="930" y="185" width="300" height="160" rx="16" fill="#f5f3ff" stroke="#7c3aed" filter="url(#shadow)"/>
<text class="card-title" x="952" y="223">Currency</text>
<text class="body" x="954" y="257">ParseCurrency(code)</text>
<text class="body" x="954" y="284">reject XXX / 999</text>
<text class="body" x="954" y="311">return wrapper value</text>
<rect class="card" x="480" y="470" width="340" height="140" rx="16" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
<text class="card-title" x="502" y="508">Reject cases</text>
<text class="body" x="504" y="542">no explicit region</text>
<text class="body" x="504" y="569">zero current tender</text>
<text class="body" x="504" y="596">multiple current tenders</text>
<path class="arrow" d="M370 260 L480 260"/><text class="label" x="395" y="248">region</text>
<path class="arrow" d="M820 260 L930 260"/><text class="label" x="850" y="248">one tender</text>
<path class="dashed" d="M650 370 L650 470"/><text class="label" x="665" y="425">otherwise</text>
<rect class="alt" x="58" y="650" width="1172" height="70" rx="16"/><text class="small" x="82" y="680">alt: this is not accounting, trading, tax, settlement, or legal-tender authority.</text>
<text class="small" x="82" y="705">Ambiguous regions return ErrInvalidCurrency so callers choose the currency explicitly.</text>
</svg>
