<rect width="2050" height="1120" fill="#F8FAFC"/>
<rect x="48" y="48" width="1954" height="1024" rx="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
<text x="1025" y="96" class="title" text-anchor="middle" dominant-baseline="middle">money - Locale Currency Resolution</text>
<text x="1025" y="130" class="subtitle" text-anchor="middle" dominant-baseline="middle">Explicit region tags plus CLDR tender data prevent hidden currency guesses</text>

<rect x="92" y="190" width="330" height="740" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" />
<text x="257" y="224" class="panel-label" text-anchor="middle" dominant-baseline="middle">Caller Input</text>
<rect x="462" y="190" width="700" height="740" rx="18" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2" />
<text x="812" y="224" class="panel-label" text-anchor="middle" dominant-baseline="middle">BCP47 Region Policy</text>
<rect x="1202" y="190" width="390" height="740" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2" />
<text x="1397" y="224" class="panel-label" text-anchor="middle" dominant-baseline="middle">CLDR Tender Query</text>
<rect x="1632" y="190" width="326" height="740" rx="18" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2" />
<text x="1795" y="224" class="panel-label" text-anchor="middle" dominant-baseline="middle">Caller Outcome</text>

<rect x="120" y="350" width="260" height="130" rx="18" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2" />
<text x="250" y="394" class="card-title" text-anchor="middle" dominant-baseline="middle">Locale Tag</text>
<text x="250" y="424" class="detail" text-anchor="middle" dominant-baseline="middle">ko-KR, en_US</text>
<text x="250" y="446" class="detail" text-anchor="middle" dominant-baseline="middle">must name region</text>
<rect x="500" y="270" width="270" height="150" rx="18" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2" />
<text x="635" y="324" class="card-title" text-anchor="middle" dominant-baseline="middle">language.Parse</text>
<text x="635" y="354" class="detail" text-anchor="middle" dominant-baseline="middle">BCP47 syntax</text>
<text x="635" y="376" class="detail" text-anchor="middle" dominant-baseline="middle">canonical tag</text>
<rect x="850" y="255" width="280" height="170" rx="18" fill="#F3E8FF" stroke="#C4B5FD" stroke-width="2" />
<text x="990" y="319" class="card-title" text-anchor="middle" dominant-baseline="middle">Explicit Region?</text>
<text x="990" y="349" class="detail" text-anchor="middle" dominant-baseline="middle">use tag region only</text>
<text x="990" y="371" class="detail" text-anchor="middle" dominant-baseline="middle">no likely-region guess</text>
<rect x="850" y="560" width="280" height="132" rx="18" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="2" />
<text x="990" y="605" class="card-title" text-anchor="middle" dominant-baseline="middle">Unsupported</text>
<text x="990" y="635" class="detail" text-anchor="middle" dominant-baseline="middle">missing or invalid</text>
<text x="990" y="657" class="detail" text-anchor="middle" dominant-baseline="middle">ErrInvalidCurrency</text>
<rect x="1240" y="270" width="310" height="150" rx="18" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2" />
<text x="1395" y="324" class="card-title" text-anchor="middle" dominant-baseline="middle">currency.Query</text>
<text x="1395" y="354" class="detail" text-anchor="middle" dominant-baseline="middle">Region(region)</text>
<text x="1395" y="376" class="detail" text-anchor="middle" dominant-baseline="middle">current legal tender</text>
<rect x="1240" y="520" width="310" height="170" rx="18" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2" />
<text x="1395" y="584" class="card-title" text-anchor="middle" dominant-baseline="middle">Tender Count</text>
<text x="1395" y="614" class="detail" text-anchor="middle" dominant-baseline="middle">1 = deterministic</text>
<text x="1395" y="636" class="detail" text-anchor="middle" dominant-baseline="middle">0 or many = reject</text>
<rect x="1660" y="330" width="270" height="150" rx="18" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2" />
<text x="1795" y="384" class="card-title" text-anchor="middle" dominant-baseline="middle">Currency</text>
<text x="1795" y="414" class="detail" text-anchor="middle" dominant-baseline="middle">ParseCurrency</text>
<text x="1795" y="436" class="detail" text-anchor="middle" dominant-baseline="middle">ISO 4217 wrapper</text>
<rect x="1660" y="560" width="270" height="132" rx="18" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2" />
<text x="1795" y="605" class="card-title" text-anchor="middle" dominant-baseline="middle">Ambiguous</text>
<text x="1795" y="635" class="detail" text-anchor="middle" dominant-baseline="middle">multiple tender units</text>
<text x="1795" y="657" class="detail" text-anchor="middle" dominant-baseline="middle">caller must choose</text>
<rect x="1240" y="790" width="310" height="112" rx="18" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="2" />
<text x="1395" y="836" class="card-title" text-anchor="middle" dominant-baseline="middle">No Tender</text>
<text x="1395" y="866" class="detail" text-anchor="middle" dominant-baseline="middle">no current legal tender</text>

