<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">testcontainers/floci Contract Map</title>
  <desc id="desc">Class-style contract map for testcontainers/floci showing integration test ownership, flocitestcontainer facade functions, upstream Floci builder and container, Details connection values, AWS SDK config, env export, cleanup, Docker, and serial execution boundaries.</desc>
  <defs>
    <filter id="softShadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .card-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; fill: #24364f; }
      .title { font-size: 42px; }
      .subtitle, .section, .member, .label, .legend { font-family: "Comic Mono", "SFMono-Regular", monospace; fill: #526276; }
      .subtitle { font-size: 17px; }
      .section { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0; }
      .card-title { font-size: 25px; }
      .member { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; }
      .legend { font-size: 13px; }
      .card { stroke-width: 2.2; rx: 12; filter: url(#softShadow); }
      .rule { stroke-width: 1.2; opacity: 0.42; }
      .connector { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3.1; }
      .dependency { stroke-dasharray: 10 8; }
      .head { stroke-linejoin: round; stroke-dasharray: none; }
      .legendBox { fill: #ffffff; stroke: #d7e0ea; stroke-width: 1.4; rx: 12; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1000"/>
  <rect class="frame" x="34" y="30" width="1532" height="932" rx="8"/>
  <text class="title" x="72" y="88">testcontainers/floci Contract Map</text>
  <text class="subtitle" x="76" y="120">Floci is a Docker-backed AWS emulator fixture: the helper starts it, returns connection details, and builds shared AWS config.</text>

  <rect class="card" x="86" y="178" width="396" height="220" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="card-title" x="284" y="216" text-anchor="middle">Integration test</text>
  <text class="section" x="116" y="246">caller-owned behavior</text>
  <line class="rule" x1="116" y1="256" x2="452" y2="256" stroke="#6d9df0"/>
  <text class="member" x="116" y="284">context timeout + testing.TB</text>
  <text class="member" x="116" y="312">service clients from AWS SDK v2</text>
  <text class="member" x="116" y="340">S3 UsePathStyle stays with test</text>
  <text class="member" x="116" y="368">service assertions stay outside helper</text>

  <rect class="card" x="590" y="150" width="420" height="244" fill="#edf9f4" stroke="#63b891"/>
  <text class="card-title" x="800" y="188" text-anchor="middle">flocitestcontainer</text>
  <text class="section" x="622" y="218">facade functions</text>
  <line class="rule" x1="622" y1="228" x2="978" y2="228" stroke="#63b891"/>
  <text class="member" x="622" y="256">Start(ctx, tb, opts...)</text>
  <text class="member" x="622" y="284">StartContainer returns upstream handle</text>
  <text class="member" x="622" y="312">LoadConfig builds aws.Config</text>
  <text class="member" x="622" y="340">WithS3/SQS/SNS/DynamoDBConfig</text>
  <text class="member" x="622" y="368">DetailsFromContainer validates handle</text>

  <rect class="card" x="1118" y="178" width="396" height="220" fill="#f3efff" stroke="#9b7aec"/>
  <text class="card-title" x="1316" y="216" text-anchor="middle">Upstream Floci</text>
  <text class="section" x="1148" y="246">container owner</text>
  <line class="rule" x1="1148" y1="256" x2="1484" y2="256" stroke="#9b7aec"/>
  <text class="member" x="1148" y="284">testcontainers-floci-go</text>
  <text class="member" x="1148" y="312">floci/floci:latest image</text>
  <text class="member" x="1148" y="340">readiness before return</text>
  <text class="member" x="1148" y="368">Stop called from t.Cleanup</text>

  <rect class="card" x="86" y="588" width="396" height="210" fill="#fff4de" stroke="#d59c3f"/>
  <text class="card-title" x="284" y="626" text-anchor="middle">AWS SDK v2 config</text>
  <text class="section" x="116" y="656">client bootstrap</text>
  <line class="rule" x1="116" y1="666" x2="452" y2="666" stroke="#d59c3f"/>
  <text class="member" x="116" y="694">Region from Details</text>
  <text class="member" x="116" y="722">BaseEndpoint from Details</text>
  <text class="member" x="116" y="750">Static test credentials</text>
  <text class="member" x="116" y="778">caller may append LoadOptions</text>

  <rect class="card" x="590" y="588" width="420" height="210" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="card-title" x="800" y="626" text-anchor="middle">Details</text>
  <text class="section" x="622" y="656">connection values</text>
  <line class="rule" x1="622" y1="666" x2="978" y2="666" stroke="#94a3b8"/>
  <text class="member" x="622" y="694">Endpoint / Region</text>
  <text class="member" x="622" y="722">AccessKeyID / SecretAccessKey</text>
  <text class="member" x="622" y="750">AccountID / AvailabilityZone</text>
  <text class="member" x="622" y="778">DedicatedNetworkName + map export</text>

  <rect class="card" x="1118" y="588" width="396" height="210" fill="#fff0f0" stroke="#d56b7d"/>
  <text class="card-title" x="1316" y="626" text-anchor="middle">Operational boundary</text>
  <text class="section" x="1148" y="656">test runtime rules</text>
  <line class="rule" x1="1148" y1="666" x2="1484" y2="666" stroke="#d56b7d"/>
  <text class="member" x="1148" y="694">Docker runtime required</text>
  <text class="member" x="1148" y="722">BLUETAPE_FLOCI_SMOKE opt-in</text>
  <text class="member" x="1148" y="750">run Docker fixtures with -p 1</text>
  <text class="member" x="1148" y="778">Setenv export cannot use t.Parallel</text>

  <path class="connector" d="M482 288H590" stroke="#4f86c6"/>
  <polygon class="head" points="590,288 572,278 572,298" fill="#4f86c6" stroke="#4f86c6"/>
  <rect class="legendBox" x="498" y="252" width="82" height="28"/>
  <text class="label" x="539" y="271" text-anchor="middle" fill="#4f86c6">calls</text>

  <path class="connector" d="M1010 288H1118" stroke="#8a65d6"/>
  <polygon class="head" points="1118,288 1100,278 1100,298" fill="#8a65d6" stroke="#8a65d6"/>
  <rect class="legendBox" x="1022" y="252" width="96" height="28"/>
  <text class="label" x="1070" y="271" text-anchor="middle" fill="#8a65d6">wraps</text>

  <path class="connector" d="M800 394V588" stroke="#64748b"/>
  <polygon class="head" points="800,588 790,570 810,570" fill="#64748b" stroke="#64748b"/>
  <rect class="legendBox" x="826" y="478" width="110" height="28"/>
  <text class="label" x="881" y="497" text-anchor="middle" fill="#64748b">extracts</text>

  <path class="connector" d="M590 693H482" stroke="#c1842f"/>
  <polygon class="head" points="482,693 500,683 500,703" fill="#c1842f" stroke="#c1842f"/>
  <rect class="legendBox" x="502" y="657" width="74" height="28"/>
  <text class="label" x="539" y="676" text-anchor="middle" fill="#c1842f">feeds</text>

  <path class="connector" d="M1010 693H1118" stroke="#b65b67"/>
  <polygon class="head" points="1118,693 1100,683 1100,703" fill="#b65b67" stroke="#b65b67"/>
  <rect class="legendBox" x="1024" y="657" width="86" height="28"/>
  <text class="label" x="1067" y="676" text-anchor="middle" fill="#b65b67">exports</text>

  <path class="connector dependency" d="M1316 398V588" stroke="#d56b7d"/>
  <polygon class="head" points="1316,588 1306,570 1326,570" fill="#ffffff" stroke="#d56b7d" stroke-width="3.1"/>
  <rect class="legendBox" x="1338" y="478" width="104" height="28"/>
  <text class="label" x="1390" y="497" text-anchor="middle" fill="#d56b7d">requires</text>

  <rect class="legendBox" x="94" y="858" width="1110" height="64"/>
  <path class="connector" d="M126 884H196" stroke="#4f86c6"/>
  <polygon class="head" points="196,884 178,874 178,894" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="legend" x="216" y="889">solid = helper-owned start/config/detail flow</text>
  <path class="connector dependency" d="M616 884H686" stroke="#d56b7d"/>
  <polygon class="head" points="686,884 668,874 668,894" fill="#ffffff" stroke="#d56b7d" stroke-width="3.1"/>
  <text class="legend" x="706" y="889">dashed = Docker, cleanup, serial execution, and env mutation boundaries</text>
</svg>
