<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1140" viewBox="0 0 2000 1140">
<defs>
  <style>
    .title { font-family: 'Architects Daughter'; font-size: 34px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-family: 'Comic Mono'; font-size: 16px; fill: #64748B; }
