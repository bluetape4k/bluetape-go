<rect width="2000" height="1140" fill="#F8FAFC"/>
<rect x="48" y="48" width="1904" height="1044" rx="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
<text x="1000" y="96" class="title" text-anchor="middle" dominant-baseline="middle">jwt - Provider Cache Adapter Flow</text>
<text x="1000" y="130" class="subtitle" text-anchor="middle" dominant-baseline="middle">Optional parse-result cache keeps provider validation as the trust boundary</text>

<rect x="96" y="188" width="280" height="520" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2" />
<text x="236" y="222" class="panel-label" text-anchor="middle" dominant-baseline="middle">Caller Boundary</text>
<rect x="430" y="188" width="360" height="520" rx="18" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2" />
<text x="610" y="222" class="panel-label" text-anchor="middle" dominant-baseline="middle">Decorator Boundary</text>
<rect x="850" y="188" width="360" height="520" rx="18" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="2" />
<text x="1030" y="222" class="panel-label" text-anchor="middle" dominant-baseline="middle">Trust Boundary</text>
<rect x="1270" y="188" width="350" height="520" rx="18" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2" />
<text x="1445" y="222" class="panel-label" text-anchor="middle" dominant-baseline="middle">Expiry Boundary</text>
<rect x="1660" y="188" width="240" height="520" rx="18" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="2" />
<text x="1780" y="222" class="panel-label" text-anchor="middle" dominant-baseline="middle">Ops Boundary</text>
<rect x="96" y="760" width="1804" height="156" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
<text x="998" y="794" class="panel-label" text-anchor="middle" dominant-baseline="middle">Safety Contract</text>

<rect x="128" y="360" width="216" height="132" rx="18" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2" />
<text x="236" y="405" class="card-title" text-anchor="middle" dominant-baseline="middle">Caller</text>
<text x="236" y="435" class="detail" text-anchor="middle" dominant-baseline="middle">Parse / ParseContext</text>
<text x="236" y="457" class="detail" text-anchor="middle" dominant-baseline="middle">caller-owned options</text>
<rect x="462" y="302" width="296" height="216" rx="18" fill="#F3E8FF" stroke="#C4B5FD" stroke-width="2" />
<text x="610" y="378" class="card-title" text-anchor="middle" dominant-baseline="middle">CachedProvider</text>
<text x="610" y="408" class="detail" text-anchor="middle" dominant-baseline="middle">decorates provider</text>
<text x="610" y="430" class="detail" text-anchor="middle" dominant-baseline="middle">token digest key</text>
<text x="610" y="452" class="detail" text-anchor="middle" dominant-baseline="middle">parse profile key</text>
<rect x="882" y="260" width="296" height="148" rx="18" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2" />
<text x="1030" y="313" class="card-title" text-anchor="middle" dominant-baseline="middle">Reader Cache</text>
<text x="1030" y="343" class="detail" text-anchor="middle" dominant-baseline="middle">cache.Cache contract</text>
<text x="1030" y="365" class="detail" text-anchor="middle" dominant-baseline="middle">Get / Set / Delete / Clear</text>
<rect x="882" y="548" width="296" height="148" rx="18" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2" />
<text x="1030" y="601" class="card-title" text-anchor="middle" dominant-baseline="middle">Provider</text>
<text x="1030" y="631" class="detail" text-anchor="middle" dominant-baseline="middle">signature validation</text>
<text x="1030" y="653" class="detail" text-anchor="middle" dominant-baseline="middle">alg / kid / claims</text>
<rect x="1302" y="260" width="286" height="148" rx="18" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2" />
<text x="1445" y="313" class="card-title" text-anchor="middle" dominant-baseline="middle">TTL Clipper</text>
<text x="1445" y="343" class="detail" text-anchor="middle" dominant-baseline="middle">min(exp-now, maxTTL)</text>
<text x="1445" y="365" class="detail" text-anchor="middle" dominant-baseline="middle">zero means no cache</text>
<rect x="1302" y="548" width="286" height="148" rx="18" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2" />
<text x="1445" y="601" class="card-title" text-anchor="middle" dominant-baseline="middle">KeyChain Source</text>
<text x="1445" y="631" class="detail" text-anchor="middle" dominant-baseline="middle">local repository</text>
<text x="1445" y="653" class="detail" text-anchor="middle" dominant-baseline="middle">or distributed Redis</text>
<rect x="1690" y="374" width="178" height="204" rx="18" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="2" />
<text x="1779" y="444" class="card-title" text-anchor="middle" dominant-baseline="middle">Invalidate</text>
<text x="1779" y="474" class="detail" text-anchor="middle" dominant-baseline="middle">Clear cache</text>
<text x="1779" y="496" class="detail" text-anchor="middle" dominant-baseline="middle">after rotation</text>
<text x="1779" y="518" class="detail" text-anchor="middle" dominant-baseline="middle">or reset</text>
<rect x="184" y="812" width="360" height="76" rx="18" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="2" />
<text x="364" y="840" class="card-title" text-anchor="middle" dominant-baseline="middle">Failures Are Not Cached</text>
<text x="364" y="870" class="detail" text-anchor="middle" dominant-baseline="middle">malformed, wrong alg, wrong key, expired</text>
<rect x="634" y="812" width="360" height="76" rx="18" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2" />
<text x="814" y="840" class="card-title" text-anchor="middle" dominant-baseline="middle">Cache Is Not Trust</text>
<text x="814" y="870" class="detail" text-anchor="middle" dominant-baseline="middle">provider remains the validation authority</text>
<rect x="1084" y="812" width="360" height="76" rx="18" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2" />
<text x="1264" y="840" class="card-title" text-anchor="middle" dominant-baseline="middle">Bounded Lifetime</text>
<text x="1264" y="870" class="detail" text-anchor="middle" dominant-baseline="middle">entry cannot outlive claim expiry</text>
<rect x="1534" y="812" width="300" height="76" rx="18" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2" />
<text x="1684" y="840" class="card-title" text-anchor="middle" dominant-baseline="middle">Compose Bypasses Cache</text>
<text x="1684" y="870" class="detail" text-anchor="middle" dominant-baseline="middle">signing path is unchanged</text>

