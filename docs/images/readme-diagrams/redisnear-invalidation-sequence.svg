<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="840" viewBox="0 0 1300 840">
<defs>
<marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity=".22"/></filter>
</defs>

<style>
@font-face{font-family:'Architects Daughter';src:local('Architects Daughter');}
@font-face{font-family:'Comic Mono';src:local('Comic Mono');}
.bg{fill:#f8fafc}.title{font:44px 'Architects Daughter','Comic Sans MS',cursive;fill:#111827}.sub{font:22px 'Comic Mono','Courier New',monospace;fill:#475569}.card-title{font:25px 'Comic Mono','Courier New',monospace;font-weight:700;fill:#111827}.body{font:18px 'Comic Mono','Courier New',monospace;fill:#334155}.small{font:15px 'Comic Mono','Courier New',monospace;fill:#475569}.label{font:17px 'Comic Mono','Courier New',monospace;fill:#2563eb;font-weight:700}.note{font:16px 'Comic Mono','Courier New',monospace;fill:#475569}.arrow{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#64748b;stroke-width:3;stroke-dasharray:10 9;fill:none;marker-end:url(#arrow-gray)}.card{fill:#fff;stroke-width:4}.alt{fill:#f59e0b;fill-opacity:.12;stroke:#f59e0b;stroke-opacity:.55;stroke-dasharray:10 8;stroke-width:3}.footer{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
</style>

<rect class="bg" width="1300" height="840"/>
<text class="title" x="52" y="72">redisnear Invalidation Sequence</text>
<text class="sub" x="56" y="112">Values stay local; Redis Pub/Sub carries only versioned invalidation commands.</text>
<rect x="35" y="160" width="170" height="58" rx="14" fill="#fff" stroke="#2563eb" stroke-width="4" filter="url(#shadow)"/>
<text class="card-title" x="55" y="197">Process A</text>
<line x1="120" y1="218" x2="120" y2="720" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 8" opacity=".55"/>
<rect x="320" y="160" width="220" height="58" rx="14" fill="#fff" stroke="#dc2626" stroke-width="4" filter="url(#shadow)"/>
<text class="card-title" x="340" y="197">Redis Pub/Sub</text>
<line x1="430" y1="218" x2="430" y2="720" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 8" opacity=".55"/>
<rect x="660" y="160" width="170" height="58" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="4" filter="url(#shadow)"/>
<text class="card-title" x="680" y="197">Process B</text>
<line x1="745" y1="218" x2="745" y2="720" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 8" opacity=".55"/>
<rect x="910" y="160" width="280" height="58" rx="14" fill="#fff" stroke="#f97316" stroke-width="4" filter="url(#shadow)"/>
<text class="card-title" x="940" y="197">Local loader</text>
<line x1="1050" y1="218" x2="1050" y2="720" stroke="#f97316" stroke-width="3" stroke-dasharray="8 8" opacity=".55"/>
<path class="arrow" d="M120 270 L430 270"/><text class="label" x="230" y="258">Set/Delete/Clear</text>
<path class="arrow" d="M430 340 L745 340"/><text class="label" x="520" y="328">versioned message</text>
<path class="dashed" d="M745 410 L745 470"/><text class="label" x="765" y="444">delete local entry</text>
<path class="arrow" d="M745 610 L1050 610"/><text class="label" x="830" y="598">next miss loads</text>
<path class="dashed" d="M1050 675 L745 675"/><text class="label" x="850" y="663">fill only local</text>
<rect class="alt" x="82" y="492" width="690" height="112" rx="18"/>
<text class="small" x="104" y="520">alt: malformed payload, receive error, or foreign namespace</text>
<text class="small" x="104" y="548">OnError observes malformed messages.</text>
<text class="small" x="104" y="573">Receive errors clear local values before retry.</text>
<rect class="footer" x="54" y="760" width="1195" height="46" rx="12"/><text class="note" x="78" y="790">Contract: GetOrLoad never publishes invalidation, so peer caches refill on demand after a mutation command.</text>
</svg>
