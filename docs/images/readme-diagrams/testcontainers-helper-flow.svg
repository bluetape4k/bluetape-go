<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">testcontainers Helper Flow</title>
  <desc id="desc">Small Start helpers launch service containers, register cleanup, and return connection endpoints for tests.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4f77c9"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#319873"/></marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#cf8428"/></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#c85d73"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#7e62d9"/></marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7d9c"/></marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .part-title, .card-title, .panel-title { font-family: "Architects Daughter"; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .body, .small, .msg, .region, .footer { font-family: "Comic Mono"; fill: #526276; }
      .subtitle { font-size: 17px; }
      .panel-title { font-size: 24px; }
      .card-title { font-size: 22px; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 12px; font-weight: 700; }
      .footer { font-size: 14px; }
      .panel { stroke: #d0deeb; stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card { stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card-divider { stroke-width: 1.1; opacity: .45; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: .88; }
      .route { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .alt { fill: #f7f2ff; fill-opacity: .22; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .alt-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .else-line { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 14; }
      .badge { stroke-width: 1.6; }
      .badge-text { font-family: "Comic Mono"; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .legend { fill: #ffffff; stroke: #d4e0ec; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect class="canvas" width="1500" height="920"/>
  <rect class="frame" x="34" y="30" width="1432" height="856" rx="8"/>
  <text class="title" x="72" y="88">testcontainers Helper Flow</text>
  <text class="subtitle" x="76" y="120">Small Start helpers launch service containers, register cleanup, and return connection endpoints for tests.</text>
  <rect class="card" x="92" y="205" width="330" height="180" rx="8" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="card-title" x="257" y="247" text-anchor="middle">Go test</text>
  <path class="card-divider" d="M92 267H422" stroke="#6d9df0"/>
  <path class="card-divider" d="M92 337H422" stroke="#6d9df0"/>
  <text class="body" x="116" y="295">context from test</text>
  <text class="body" x="116" y="319">testing.TB cleanup</text>
  <text class="body" x="116" y="361">integration code uses endpoint</text>
  <rect class="card" x="500" y="175" width="390" height="235" rx="8" fill="#edf9f4" stroke="#63b891"/>
  <text class="card-title" x="695" y="217" text-anchor="middle">Start helper</text>
  <path class="card-divider" d="M500 237H890" stroke="#63b891"/>
  <path class="card-divider" d="M500 307H890" stroke="#63b891"/>
  <text class="body" x="524" y="265">module-specific image</text>
  <text class="body" x="524" y="289">wait strategy</text>
  <text class="body" x="524" y="331">endpoint extraction</text>
  <text class="body" x="524" y="355">t.Cleanup terminate</text>
  <rect class="card" x="1010" y="175" width="390" height="235" rx="8" fill="#fff4de" stroke="#d59c3f"/>
  <image href="data:image/svg+xml;base64," x="1030" y="193" width="46" height="46"/>
  <text class="card-title" x="1225" y="217" text-anchor="middle">Docker container</text>
  <path class="card-divider" d="M1010 237H1400" stroke="#d59c3f"/>
  <path class="card-divider" d="M1010 307H1400" stroke="#d59c3f"/>
  <text class="body" x="1034" y="265">Kafka brokers</text>
  <text class="body" x="1034" y="289">DB DSN</text>
  <text class="body" x="1034" y="331">NATS URL</text>
  <text class="body" x="1034" y="355">Redis address</text>
  <rect class="card" x="260" y="545" width="310" height="165" rx="8" fill="#f3efff" stroke="#9b7aec"/>
  <image href="data:image/svg+xml;base64," x="280" y="563" width="46" height="46"/>
  <text class="card-title" x="435" y="587" text-anchor="middle">Queue services</text>
  <path class="card-divider" d="M260 607H570" stroke="#9b7aec"/>
  <path class="card-divider" d="M260 674H570" stroke="#9b7aec"/>
  <text class="body" x="284" y="635">Kafka</text>
  <text class="body" x="284" y="659">NATS</text>
  <text class="body" x="284" y="701">broker URL returned</text>
  <rect class="card" x="640" y="545" width="310" height="165" rx="8" fill="#fff0f0" stroke="#dc2626"/>
  <image href="data:image/svg+xml;base64," x="660" y="563" width="46" height="46"/>
  <text class="card-title" x="815" y="587" text-anchor="middle">Databases</text>
  <path class="card-divider" d="M640 607H950" stroke="#dc2626"/>
  <path class="card-divider" d="M640 674H950" stroke="#dc2626"/>
  <text class="body" x="664" y="635">MySQL</text>
  <text class="body" x="664" y="659">PostgreSQL</text>
  <text class="body" x="664" y="701">DSN returned</text>
  <rect class="card" x="1020" y="545" width="310" height="165" rx="8" fill="#fff0f0" stroke="#dc2626"/>
  <image href="data:image/svg+xml;base64," x="1040" y="563" width="46" height="46"/>
  <text class="card-title" x="1195" y="587" text-anchor="middle">Redis</text>
  <path class="card-divider" d="M1020 607H1330" stroke="#dc2626"/>
  <path class="card-divider" d="M1020 674H1330" stroke="#dc2626"/>
  <text class="body" x="1044" y="635">redis:7-alpine</text>
  <text class="body" x="1044" y="659">host:port returned</text>
  <text class="body" x="1044" y="701">used by Redis modules</text>
  <path class="route" d="M422 300H500" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <text class="msg" x="452" y="274" text-anchor="middle" fill="#4f77c9">Start(ctx,t)</text>
  <path class="route" d="M890 300H1010" stroke="#319873" marker-end="url(#arrow-green)"/>
  <text class="msg" x="950" y="282" text-anchor="middle" fill="#319873">launch</text>
  <path class="route" d="M630 410C560 490 450 525 360 545" stroke="#7e62d9" marker-end="url(#arrow-purple)"/>
  <text class="msg" x="500" y="492" text-anchor="middle" fill="#7e62d9">mq</text>
  <path class="route" d="M695 410V545" stroke="#c85d73" marker-end="url(#arrow-red)"/>
  <text class="msg" x="742" y="492" text-anchor="middle" fill="#c85d73">sql</text>
  <path class="route" d="M760 410C835 490 945 525 1105 545" stroke="#c85d73" marker-end="url(#arrow-red)"/>
  <text class="msg" x="920" y="492" text-anchor="middle" fill="#c85d73">cache</text>
  <rect class="legend" x="82" y="842" width="1336" height="40" rx="8"/>
  <text class="footer" x="750" y="868" text-anchor="middle">The helpers own container lifecycle; tests should consume returned endpoints and avoid global ports.</text>
</svg>
