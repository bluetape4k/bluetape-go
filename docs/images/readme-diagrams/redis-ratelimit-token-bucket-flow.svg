<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity=".22"/></filter>
</defs>
<style>
  @font-face{font-family:'Architects Daughter';src:local('Architects Daughter');}
  @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
  .bg{fill:#f8fafc}
  .title{font:42px 'Architects Daughter','Comic Sans MS',cursive;fill:#111827}
  .sub{font:20px 'Comic Mono','Courier New',monospace;fill:#475569}
  .card-title{font:24px 'Comic Mono','Courier New',monospace;font-weight:700;fill:#111827}
  .body{font:17px 'Comic Mono','Courier New',monospace;fill:#334155}
  .small{font:15px 'Comic Mono','Courier New',monospace;fill:#475569}
  .label{font:16px 'Comic Mono','Courier New',monospace;fill:#2563eb;font-weight:700}
  .line{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#arrow)}
  .line-green{stroke:#059669;stroke-width:3.5;fill:none;marker-end:url(#arrow-green)}
  .line-red{stroke:#dc2626;stroke-width:3.5;fill:none;marker-end:url(#arrow-red)}
  .dash{stroke:#64748b;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}
  .card{fill:#fff;stroke-width:4}
  .alt{fill:#f59e0b;fill-opacity:.12;stroke:#f59e0b;stroke-opacity:.55;stroke-dasharray:10 8;stroke-width:3}
</style>
<rect class="bg" width="1440" height="820"/>
<text class="title" x="56" y="72">Redis Token Bucket Flow</text>
<text class="sub" x="60" y="112">One Allow call runs one Lua script: refill from Redis TIME, consume microtokens, persist the bucket, and refresh IdleTTL.</text>

<rect class="card" x="70" y="180" width="285" height="175" rx="16" fill="#eff6ff" stroke="#2563eb" filter="url(#shadow)"/>
<text class="card-title" x="95" y="219">Caller</text>
<text class="body" x="96" y="255">Allow(ctx, key, n)</text>
<text class="body" x="96" y="282">context deadline</text>
<text class="body" x="96" y="309">logical tenant key</text>

<rect class="card" x="465" y="150" width="330" height="230" rx="16" fill="#ecfdf5" stroke="#059669" filter="url(#shadow)"/>
<text class="card-title" x="490" y="189">Go limiter</text>
<text class="body" x="492" y="225">trim key</text>
<text class="body" x="492" y="252">MaxKeyBytes guard</text>
<text class="body" x="492" y="279">tokens &lt;= Burst</text>
<text class="body" x="492" y="306">scale to microtokens</text>
<text class="body" x="492" y="333">build bucket key</text>

<rect class="card" x="900" y="135" width="420" height="265" rx="16" fill="#f5f3ff" stroke="#7c3aed" filter="url(#shadow)"/>
<text class="card-title" x="926" y="174">Redis Lua script</text>
<text class="body" x="928" y="211">TIME uses Redis server clock</text>
<text class="body" x="928" y="238">HMGET tokens, updated_ms</text>
<text class="body" x="928" y="265">refill elapsed microtokens</text>
<text class="body" x="928" y="292">consume when enough tokens</text>
<text class="body" x="928" y="319">HSET state + PEXPIRE IdleTTL</text>
<text class="body" x="928" y="346">return allowed, remaining, retry</text>
<image href="data:image/svg+xml;base64," x="1245" y="160" width="58" height="58"/>

<rect class="card" x="900" y="500" width="420" height="145" rx="16" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
<text class="card-title" x="926" y="539">Redis hash bucket</text>
<text class="body" x="928" y="576">bluetape:ratelimit:&lt;ns&gt;:bucket:&lt;key&gt;</text>
<text class="body" x="928" y="603">tokens = remaining microtokens</text>
<text class="body" x="928" y="630">updated_ms = last Redis timestamp</text>

<path class="line" d="M355 265 L465 265"/><text class="label" x="388" y="252">request</text>
<path class="line-green" d="M795 265 L900 265"/><text class="label" x="823" y="252">EVAL</text>
<path class="line-green" d="M1110 400 L1110 500"/><text class="label" x="1128" y="455">HSET + PEXPIRE</text>
<path class="dash" d="M900 570 C740 580 650 460 630 380"/><text class="label" x="675" y="545">Result</text>
<path class="dash" d="M465 323 C380 420 310 405 250 355"/><text class="label" x="302" y="418">allowed or retry-after</text>

<rect class="alt" x="74" y="700" width="1240" height="72" rx="16"/>
<text class="small" x="100" y="730">alt: invalid key, tokens &gt; Burst, context cancellation, or Redis script failure returns an error instead of a rejection result.</text>
<text class="small" x="100" y="755">Boundary: rejected attempts are normal Result values; no FIFO fairness, reservations, waiting queue, or adaptive limit policy is provided.</text>
</svg>
