<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760">
<defs><marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity=".22"/></filter></defs>

<style>
@font-face{font-family:'Architects Daughter';src:local('Architects Daughter');}
@font-face{font-family:'Comic Mono';src:local('Comic Mono');}
.bg{fill:#f8fafc}.title{font:43px 'Architects Daughter';fill:#111827}.sub{font:21px 'Comic Mono';fill:#475569}.card-title{font:24px 'Comic Mono';font-weight:700;fill:#111827}.body{font:17px 'Comic Mono';fill:#334155}.small{font:15px 'Comic Mono';fill:#475569}.label{font:16px 'Comic Mono';fill:#2563eb;font-weight:700}.note{font:16px 'Comic Mono';fill:#475569}.arrow{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#64748b;stroke-width:3;stroke-dasharray:10 9;fill:none;marker-end:url(#arrow-gray)}.card{fill:#fff;stroke-width:4}.alt{fill:#f59e0b;fill-opacity:.12;stroke:#f59e0b;stroke-opacity:.55;stroke-dasharray:10 8;stroke-width:3}.footer{fill:#fff;stroke:#cbd5e1;stroke-width:2}
</style>

<rect class="bg" width="1260" height="760"/>
<text class="title" x="52" y="72">Redis Leader Election Lifecycle</text>
<text class="sub" x="56" y="112">TTL ownership backs single, bounded group, and strategic election modes.</text>
<rect class="card" x="60" y="175" width="275" height="165" rx="16" fill="#eff6ff" stroke="#2563eb" filter="url(#shadow)"/>
<text class="card-title" x="82" y="213">Member</text>
<text class="body" x="84" y="247">Campaign(ctx)</text>
<text class="body" x="84" y="274">memberID:random</text>
<text class="body" x="84" y="301">Resign releases owner</text>
<rect class="card" x="430" y="150" width="340" height="215" rx="16" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
<text class="card-title" x="452" y="188">Redis ownership</text>
<text class="body" x="454" y="222">single key + TTL</text>
<text class="body" x="454" y="249">group ZSET slots</text>
<text class="body" x="454" y="276">strategic candidate index</text>
<text class="body" x="454" y="303">expired entries pruned</text>
<rect class="card" x="880" y="160" width="330" height="185" rx="16" fill="#ecfdf5" stroke="#059669" filter="url(#shadow)"/>
<text class="card-title" x="902" y="198">Renew loop</text>
<text class="body" x="904" y="232">PEXPIRE only if token matches</text>
<text class="body" x="904" y="259">failure clears local owned</text>
<text class="body" x="904" y="286">IsLeader becomes false</text>
<image href="data:image/svg+xml;base64," x="700" y="175" width="58" height="58"/>
<rect class="card" x="430" y="455" width="340" height="145" rx="16" fill="#f5f3ff" stroke="#7c3aed" filter="url(#shadow)"/>
<text class="card-title" x="452" y="493">Strategic path</text>
<text class="body" x="454" y="527">list live candidates</text>
<text class="body" x="454" y="554">deterministic strategy</text>
<text class="body" x="454" y="581">run only elected member</text>
<rect class="card" x="880" y="455" width="330" height="145" rx="16" fill="#fff7ed" stroke="#f97316" filter="url(#shadow)"/>
<text class="card-title" x="902" y="493">Operational boundary</text>
<text class="body" x="904" y="527">Go-owned key format</text>
<text class="body" x="904" y="554">no JVM compatibility</text>
<text class="body" x="904" y="581">context controls waiting</text>
<path class="arrow" d="M335 250 L430 250"/><text class="label" x="355" y="238">acquire</text>
<path class="arrow" d="M770 245 L880 245"/><text class="label" x="795" y="232">renew</text>
<path class="dashed" d="M880 310 L770 310"/><text class="label" x="790" y="340">lost owner</text>
<path class="arrow" d="M600 365 L600 455"/><text class="label" x="615" y="415">rank</text>
<path class="arrow" d="M770 525 L880 525"/><text class="label" x="805" y="512">runbook</text>
<rect class="alt" x="58" y="650" width="1152" height="70" rx="16"/><text class="small" x="82" y="680">alt: duplicate Campaign on the same elector returns ErrAlreadyLeader; missing slot waits until context cancellation.</text>
<text class="small" x="82" y="705">Release and renew scripts mutate Redis only when the stored owner token still matches this member.</text>
</svg>
