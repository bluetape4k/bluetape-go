<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Redis Leader Election Runtime Map</title>
  <desc id="desc">TTL ownership supports single, bounded group, and strategy-selected Go leaders.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4f77c9"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#319873"/></marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#cf8428"/></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#c85d73"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#7e62d9"/></marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7d9c"/></marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .part-title, .card-title, .panel-title { font-family: "Architects Daughter"; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .body, .small, .msg, .region, .footer { font-family: "Comic Mono"; fill: #526276; }
      .subtitle { font-size: 17px; }
      .panel-title { font-size: 24px; }
      .card-title { font-size: 22px; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 12px; font-weight: 700; }
      .footer { font-size: 14px; }
      .panel { stroke: #d0deeb; stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card { stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card-divider { stroke-width: 1.1; opacity: .45; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: .88; }
      .route { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .alt { fill: #f7f2ff; fill-opacity: .22; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .alt-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .else-line { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 14; }
      .badge { stroke-width: 1.6; }
      .badge-text { font-family: "Comic Mono"; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .legend { fill: #ffffff; stroke: #d4e0ec; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect class="canvas" width="1500" height="920"/>
  <rect class="frame" x="34" y="30" width="1432" height="856" rx="8"/>
  <text class="title" x="72" y="88">Redis Leader Election Runtime Map</text>
  <text class="subtitle" x="76" y="120">TTL ownership supports single, bounded group, and strategy-selected Go leaders.</text>
  <rect class="card" x="92" y="198" width="310" height="165" rx="8" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="card-title" x="247" y="240" text-anchor="middle">Member instance</text>
  <path class="card-divider" d="M92 260H402" stroke="#6d9df0"/>
  <path class="card-divider" d="M92 327H402" stroke="#6d9df0"/>
  <text class="body" x="116" y="288">Campaign(ctx)</text>
  <text class="body" x="116" y="312">memberID:random token</text>
  <text class="body" x="116" y="354">Resign releases owner</text>
  <rect class="card" x="502" y="170" width="420" height="230" rx="8" fill="#fff8ed" stroke="#cf8428"/>
  <image href="data:image/svg+xml;base64," x="522" y="188" width="46" height="46"/>
  <text class="card-title" x="732" y="212" text-anchor="middle">Redis ownership</text>
  <path class="card-divider" d="M502 232H922" stroke="#cf8428"/>
  <path class="card-divider" d="M502 302H922" stroke="#cf8428"/>
  <text class="body" x="526" y="260">single key + TTL</text>
  <text class="body" x="526" y="284">group ZSET slots</text>
  <text class="body" x="526" y="326">strategy candidate index</text>
  <text class="body" x="526" y="350">expired entries pruned</text>
  <rect class="card" x="1038" y="198" width="330" height="165" rx="8" fill="#edf9f4" stroke="#63b891"/>
  <text class="card-title" x="1203" y="240" text-anchor="middle">Renew loop</text>
  <path class="card-divider" d="M1038 260H1368" stroke="#63b891"/>
  <path class="card-divider" d="M1038 327H1368" stroke="#63b891"/>
  <text class="body" x="1062" y="288">PEXPIRE if token matches</text>
  <text class="body" x="1062" y="312">lost owner clears local state</text>
  <text class="body" x="1062" y="354">IsLeader becomes false</text>
  <rect class="card" x="502" y="510" width="420" height="170" rx="8" fill="#f3efff" stroke="#9b7aec"/>
  <text class="card-title" x="712" y="552" text-anchor="middle">Strategic path</text>
  <path class="card-divider" d="M502 572H922" stroke="#9b7aec"/>
  <path class="card-divider" d="M502 642H922" stroke="#9b7aec"/>
  <text class="body" x="526" y="600">list live candidates</text>
  <text class="body" x="526" y="624">deterministic strategy</text>
  <text class="body" x="526" y="666">run only selected member</text>
  <rect class="card" x="1038" y="510" width="330" height="170" rx="8" fill="#fff4de" stroke="#d59c3f"/>
  <text class="card-title" x="1203" y="552" text-anchor="middle">Boundary</text>
  <path class="card-divider" d="M1038 572H1368" stroke="#d59c3f"/>
  <path class="card-divider" d="M1038 642H1368" stroke="#d59c3f"/>
  <text class="body" x="1062" y="600">Go-owned key format</text>
  <text class="body" x="1062" y="624">no JVM compatibility</text>
  <text class="body" x="1062" y="666">context controls waiting</text>
  <path class="route" d="M402 280 L502 280" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <text class="msg" x="452" y="260" text-anchor="middle" fill="#4f77c9">acquire</text>
  <path class="route" d="M922 280 L1038 280" stroke="#319873" marker-end="url(#arrow-green)"/>
  <text class="msg" x="980" y="260" text-anchor="middle" fill="#319873">renew</text>
  <path class="return" d="M1038 340 L922 340" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <text class="msg" x="980" y="368" text-anchor="middle" fill="#64748b">lost owner</text>
  <path class="route" d="M712 400 L712 510" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <text class="msg" x="745" y="458" text-anchor="middle" fill="#4f77c9">rank</text>
  <path class="route" d="M922 595 L1038 595" stroke="#7e62d9" marker-end="url(#arrow-purple)"/>
  <text class="msg" x="980" y="575" text-anchor="middle" fill="#7e62d9">runbook</text>
  <rect class="legend" x="82" y="842" width="1336" height="40" rx="8"/>
  <text class="footer" x="750" y="868" text-anchor="middle">Release and renew mutate Redis only when the stored owner token still matches this member.</text>
</svg>
