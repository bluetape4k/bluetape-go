<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1420" viewBox="0 0 1700 1420" role="img" aria-labelledby="title desc">
  <title id="title">encrypt Envelope Sequence</title>
  <desc id="desc">Encryptor creates a random-nonce AES-GCM AEAD, seals plaintext with associated data, writes the BTENC envelope, then parses and authenticates before returning plaintext or a safe error.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="seqArrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6"/>
    </marker>
    <marker id="seqArrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c1842f" stroke="#c1842f"/>
    </marker>
    <marker id="seqArrow-teal" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f8f8a" stroke="#2f8f8a"/>
    </marker>
    <marker id="seqArrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8d3e" stroke="#5f8d3e"/>
    </marker>
    <marker id="seqArrow-red" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b65b67" stroke="#b65b67"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .participant-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .role, .msg, .region, .footer { font-family: "Comic Mono", "SFMono-Regular", monospace; fill: #526276; }
      .subtitle { font-size: 17px; }
      .participant-title { font-size: 22px; }
      .role { font-size: 13px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: 0.88; }
      .call, .return, .error, .state { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .call, .state { stroke-width: 3; }
      .return, .error { stroke-width: 2.7; stroke-dasharray: 9 8; }
      .alt { fill: none; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .alt-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .branchDivider { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 15; }
      .badge { stroke-width: 1.6; }
      .badgeText { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1420"/>
  <rect class="frame" x="34" y="30" width="1632" height="1356" rx="8"/>
  <text class="title" x="72" y="88">encrypt Envelope Sequence</text>
  <text class="subtitle" x="76" y="120">Associated data is authenticated on both byte and string helper paths; failures return safe sentinel errors.</text>

  <rect class="participant" x="86" y="174" width="190" height="68" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="participant-title" x="181" y="202" text-anchor="middle">Caller</text>
  <text class="role" x="181" y="224" text-anchor="middle">owns key + AD</text>
  <line class="lifeline" x1="181" y1="242" x2="181" y2="1310"/>

  <rect class="participant" x="390" y="174" width="210" height="68" fill="#f3efff" stroke="#9b7aec"/>
  <text class="participant-title" x="495" y="202" text-anchor="middle">Encryptor</text>
  <text class="role" x="495" y="224" text-anchor="middle">facade</text>
  <line class="lifeline" x1="495" y1="242" x2="495" y2="1310"/>

  <rect class="participant" x="710" y="174" width="220" height="68" fill="#fff4de" stroke="#d59c3f"/>
  <text class="participant-title" x="820" y="202" text-anchor="middle">AES-GCM</text>
  <text class="role" x="820" y="224" text-anchor="middle">random nonce AEAD</text>
  <line class="lifeline" x1="820" y1="242" x2="820" y2="1310"/>

  <rect class="participant" x="1042" y="174" width="220" height="68" fill="#edf9f4" stroke="#63b891"/>
  <text class="participant-title" x="1152" y="202" text-anchor="middle">Envelope</text>
  <text class="role" x="1152" y="224" text-anchor="middle">BTENC header</text>
  <line class="lifeline" x1="1152" y1="242" x2="1152" y2="1310"/>

  <rect class="participant" x="1378" y="174" width="220" height="68" fill="#fff0f0" stroke="#d56b7d"/>
  <text class="participant-title" x="1488" y="202" text-anchor="middle">Error</text>
  <text class="role" x="1488" y="224" text-anchor="middle">safe sentinel</text>
  <line class="lifeline" x1="1488" y1="242" x2="1488" y2="1310"/>

  <rect class="activation" x="488" y="300" width="14" height="946" rx="7"/>
  <rect class="activation" x="813" y="380" width="14" height="846" rx="7"/>
  <rect class="activation" x="1145" y="560" width="14" height="300" rx="7"/>
  <rect class="activation" x="1481" y="1028" width="14" height="118" rx="7"/>

  <rect class="alt" x="94" y="1000" width="1510" height="296" rx="16"/>
  <rect class="alt-label" x="116" y="1018" width="230" height="30" rx="15"/>
  <text class="region" x="140" y="1038">alt authentication failed</text>
  <line class="branchDivider" x1="116" y1="1146" x2="1582" y2="1146"/>
  <rect class="alt-label" x="116" y="1164" width="150" height="30" rx="15"/>
  <text class="region" x="140" y="1184">else success</text>

  <path class="call" d="M181 310 L495 310" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="260" y="268" width="156" height="30" rx="15"/>
  <circle class="badge" cx="280" cy="283" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="280" y="287" text-anchor="middle">1</text>
  <text class="msg" x="344" y="288" text-anchor="middle" fill="#4f86c6">New(key)</text>

  <path class="call" d="M495 390 L820 390" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="564" y="348" width="190" height="30" rx="15"/>
  <circle class="badge" cx="584" cy="363" r="13" fill="#c1842f" stroke="#c1842f"/>
  <text class="badgeText" x="584" y="367" text-anchor="middle">2</text>
  <text class="msg" x="664" y="368" text-anchor="middle" fill="#c1842f">copy key + AEAD</text>

  <path class="call" d="M181 470 L495 470" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="224" y="428" width="230" height="30" rx="15"/>
  <circle class="badge" cx="244" cy="443" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="244" y="447" text-anchor="middle">3</text>
  <text class="msg" x="346" y="448" text-anchor="middle" fill="#4f86c6">Encrypt(plain, ad)</text>

  <path class="call" d="M495 550 L820 550" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="564" y="508" width="188" height="30" rx="15"/>
  <circle class="badge" cx="584" cy="523" r="13" fill="#c1842f" stroke="#c1842f"/>
  <text class="badgeText" x="584" y="527" text-anchor="middle">4</text>
  <text class="msg" x="666" y="528" text-anchor="middle" fill="#c1842f">Seal(nil, nil, ad)</text>

  <path class="return" d="M820 630 L495 630" stroke="#2f8f8a" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="562" y="588" width="194" height="30" rx="15"/>
  <circle class="badge" cx="582" cy="603" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="582" y="607" text-anchor="middle">5</text>
  <text class="msg" x="666" y="608" text-anchor="middle" fill="#2f8f8a">nonce+cipher+tag</text>

  <path class="state" d="M495 710 L1152 710" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="684" y="668" width="280" height="30" rx="15"/>
  <circle class="badge" cx="704" cy="683" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="704" y="687" text-anchor="middle">6</text>
  <text class="msg" x="832" y="688" text-anchor="middle" fill="#5f8d3e">prepend BTENC v1/aesgcm</text>

  <path class="return" d="M495 790 L181 790" stroke="#2f8f8a" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="238" y="748" width="200" height="30" rx="15"/>
  <circle class="badge" cx="258" cy="763" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="258" y="767" text-anchor="middle">7</text>
  <text class="msg" x="346" y="768" text-anchor="middle" fill="#2f8f8a">envelope/token</text>

  <path class="call" d="M181 850 L495 850" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="218" y="808" width="242" height="30" rx="15"/>
  <circle class="badge" cx="238" cy="823" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="238" y="827" text-anchor="middle">8</text>
  <text class="msg" x="344" y="828" text-anchor="middle" fill="#4f86c6">Decrypt(envelope, ad)</text>

  <path class="call" d="M495 910 L1152 910" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="710" y="868" width="228" height="30" rx="15"/>
  <circle class="badge" cx="730" cy="883" r="13" fill="#c1842f" stroke="#c1842f"/>
  <text class="badgeText" x="730" y="887" text-anchor="middle">9</text>
  <text class="msg" x="834" y="888" text-anchor="middle" fill="#c1842f">parse BTENC header</text>

  <path class="call" d="M495 970 L820 970" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="558" y="928" width="198" height="30" rx="15"/>
  <circle class="badge" cx="580" cy="943" r="13" fill="#c1842f" stroke="#c1842f"/>
  <text class="badgeText" x="580" y="947" text-anchor="middle">10</text>
  <text class="msg" x="666" y="948" text-anchor="middle" fill="#c1842f">Open(nil, nil, ad)</text>

  <path class="error" d="M820 1072 L495 1072" stroke="#b65b67" marker-end="url(#seqArrow-red)"/>
  <rect class="pill" x="548" y="1030" width="220" height="30" rx="15"/>
  <circle class="badge" cx="570" cy="1045" r="13" fill="#b65b67" stroke="#b65b67"/>
  <text class="badgeText" x="570" y="1049" text-anchor="middle">11</text>
  <text class="msg" x="666" y="1050" text-anchor="middle" fill="#b65b67">auth failed</text>

  <path class="error" d="M495 1130 L1488 1130" stroke="#b65b67" marker-end="url(#seqArrow-red)"/>
  <rect class="pill" x="824" y="1088" width="336" height="30" rx="15"/>
  <circle class="badge" cx="846" cy="1103" r="13" fill="#b65b67" stroke="#b65b67"/>
  <text class="badgeText" x="846" y="1107" text-anchor="middle">12</text>
  <text class="msg" x="1000" y="1108" text-anchor="middle" fill="#b65b67">ErrAuthenticationFailed</text>

  <path class="return" d="M820 1212 L495 1212" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="586" y="1170" width="144" height="30" rx="15"/>
  <circle class="badge" cx="608" cy="1185" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="608" y="1189" text-anchor="middle">13</text>
  <text class="msg" x="666" y="1190" text-anchor="middle" fill="#5f8d3e">plaintext</text>

  <path class="return" d="M495 1272 L181 1272" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="270" y="1230" width="136" height="30" rx="15"/>
  <circle class="badge" cx="292" cy="1245" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="292" y="1249" text-anchor="middle">14</text>
  <text class="msg" x="346" y="1250" text-anchor="middle" fill="#5f8d3e">bytes/text</text>

  <rect class="pill" x="362" y="1340" width="976" height="34" rx="17"/>
  <text class="footer" x="850" y="1362" text-anchor="middle">String helpers add raw URL-safe base64 and UTF-8 validation around the same byte envelope.</text>
</svg>
