<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Integration Recipe Contract Map</title>
  <desc id="desc">Class-style contract map for examples/integration recipes, showing compile-checked recipe functions, local batch fixtures, and the bluetape-go packages they compose.</desc>
  <defs>
    <filter id="softShadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .card-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; fill: #24364f; }
      .title { font-size: 42px; }
      .subtitle, .section, .member, .label, .legend { font-family: "Comic Mono", "SFMono-Regular", monospace; fill: #526276; }
      .subtitle { font-size: 17px; }
      .section { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0; }
      .card-title { font-size: 25px; }
      .member { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; }
      .legend { font-size: 13px; }
      .card { stroke-width: 2.2; rx: 12; filter: url(#softShadow); }
      .rule { stroke-width: 1.2; opacity: 0.42; }
      .connector { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3.1; }
      .dependency { stroke-dasharray: 10 8; }
      .head { stroke-linejoin: round; stroke-dasharray: none; }
      .legendBox { fill: #ffffff; stroke: #d7e0ea; stroke-width: 1.4; rx: 12; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1200"/>
  <rect class="frame" x="34" y="30" width="1732" height="1138" rx="8"/>
  <text class="title" x="74" y="88">Integration Recipe Contract Map</text>
  <text class="subtitle" x="78" y="120">Compile-checked examples compose corrected 0.6.x packages without adding public helper APIs.</text>

  <rect class="card" x="640" y="160" width="480" height="220" fill="#edf9f4" stroke="#63b891"/>
  <text class="card-title" x="880" y="198" text-anchor="middle">examples/integration recipes</text>
  <text class="section" x="674" y="228">entrypoints</text>
  <line class="rule" x1="674" y1="238" x2="1086" y2="238" stroke="#63b891"/>
  <text class="member" x="674" y="266">Example_batchWorkflowJWTCacheAndResilienceRecipe</text>
  <text class="member" x="674" y="294">TestConcurrentIDAndJWTRecipe</text>
  <text class="member" x="674" y="322">TestRedisCoordinationRecipeSmoke</text>
  <text class="member" x="674" y="350">context deadlines bound every recipe</text>

  <rect class="card" x="90" y="190" width="390" height="220" fill="#f3efff" stroke="#9b7aec"/>
  <text class="card-title" x="285" y="228" text-anchor="middle">Request identity + JWT</text>
  <text class="section" x="122" y="258">packages</text>
  <line class="rule" x1="122" y1="268" x2="448" y2="268" stroke="#9b7aec"/>
  <text class="member" x="122" y="296">id.NewUUIDV7Generator / NewUUIDV7</text>
  <text class="member" x="122" y="324">jwt.NewFixedHMACProvider</text>
  <text class="member" x="122" y="352">Compose, Parse, expected claims</text>
  <text class="member" x="122" y="380">JWT ID carries request ID</text>

  <rect class="card" x="1320" y="190" width="380" height="220" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="card-title" x="1510" y="228" text-anchor="middle">Profile cache guard</text>
  <text class="section" x="1352" y="258">packages</text>
  <line class="rule" x1="1352" y1="268" x2="1668" y2="268" stroke="#6d9df0"/>
  <text class="member" x="1352" y="296">cache.Memory.GetOrLoad</text>
  <text class="member" x="1352" y="324">resilience.NewRetry[string]</text>
  <text class="member" x="1352" y="352">resilience.NewTimeout[string]</text>
  <text class="member" x="1352" y="380">temporary loader error retries once</text>

  <rect class="card" x="460" y="520" width="380" height="210" fill="#fff4de" stroke="#d59c3f"/>
  <text class="card-title" x="650" y="558" text-anchor="middle">workflow.Sequential</text>
  <text class="section" x="492" y="588">contract</text>
  <line class="rule" x1="492" y1="598" x2="808" y2="598" stroke="#d59c3f"/>
  <text class="member" x="492" y="626">StopOnFailure policy</text>
  <text class="member" x="492" y="654">profile-cache step</text>
  <text class="member" x="492" y="682">order-import step</text>
  <text class="member" x="492" y="710">returns workreport.Report</text>

  <rect class="card" x="950" y="520" width="440" height="250" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="card-title" x="1170" y="558" text-anchor="middle">batch order import</text>
  <text class="section" x="982" y="588">step options</text>
  <line class="rule" x1="982" y1="598" x2="1358" y2="598" stroke="#94a3b8"/>
  <text class="member" x="982" y="626">StepOptions[order, receipt]</text>
  <text class="member" x="982" y="654">ChunkSize=2, MemoryCheckpointStore</text>
  <text class="member" x="982" y="682">RetryErrors(temporary writer failure)</text>
  <text class="member" x="982" y="710">SkipErrors(invalid order)</text>
  <text class="member" x="982" y="738">Report: writes=2 skips=1 retries=1</text>

  <rect class="card" x="90" y="840" width="440" height="220" fill="#fff0f0" stroke="#d56b7d"/>
  <text class="card-title" x="310" y="878" text-anchor="middle">local batch fixtures</text>
  <text class="section" x="122" y="908">test-only types</text>
  <line class="rule" x1="122" y1="918" x2="498" y2="918" stroke="#d56b7d"/>
  <text class="member" x="122" y="946">sliceCheckpointReader[order]</text>
  <text class="member" x="122" y="974">Checkpoint / Restore index</text>
  <text class="member" x="122" y="1002">failingOnceWriter[receipt]</text>
  <text class="member" x="122" y="1030">errInvalidOrder / errTemporaryWrite</text>

  <rect class="card" x="650" y="845" width="460" height="220" fill="#edf9f4" stroke="#63b891"/>
  <text class="card-title" x="880" y="883" text-anchor="middle">Redis coordination smoke</text>
  <text class="section" x="682" y="913">recipe boundary</text>
  <line class="rule" x1="682" y1="923" x2="1078" y2="923" stroke="#63b891"/>
  <text class="member" x="682" y="951">BLUETAPE_INTEGRATION_RECIPE_SMOKE=1</text>
  <text class="member" x="682" y="979">namespace isolates Redis keys</text>
  <text class="member" x="682" y="1007">runs batch recipe under leadership</text>
  <text class="member" x="682" y="1035">stores write count result in Redis</text>

  <rect class="card" x="1220" y="845" width="440" height="220" fill="#f3efff" stroke="#9b7aec"/>
  <text class="card-title" x="1440" y="883" text-anchor="middle">Redis-backed packages</text>
  <text class="section" x="1252" y="913">cleanup-owned resources</text>
  <line class="rule" x1="1252" y1="923" x2="1628" y2="923" stroke="#9b7aec"/>
  <text class="member" x="1252" y="951">testcontainers/redis.Start</text>
  <text class="member" x="1252" y="979">lock/redis owner-token lease</text>
  <text class="member" x="1252" y="1007">leader/redis campaign + resign</text>
  <text class="member" x="1252" y="1035">go-redis client Close cleanup</text>

  <path class="connector" d="M480 300H590Q610 300 610 280V260Q610 240 630 240H640" stroke="#8a65d6"/>
  <polygon class="head" points="640,240 622,230 622,250" fill="#8a65d6" stroke="#8a65d6"/>
  <rect class="legendBox" x="510" y="254" width="90" height="28"/>
  <text class="label" x="555" y="273" text-anchor="middle" fill="#8a65d6">claims</text>

  <path class="connector" d="M1120 300H1320" stroke="#4f86c6"/>
  <polygon class="head" points="1320,300 1302,290 1302,310" fill="#4f86c6" stroke="#4f86c6"/>
  <rect class="legendBox" x="1188" y="250" width="108" height="28"/>
  <text class="label" x="1242" y="269" text-anchor="middle" fill="#4f86c6">subject load</text>

  <path class="connector" d="M760 380V440Q760 460 740 460H670Q650 460 650 480V520" stroke="#a2652f"/>
  <polygon class="head" points="650,520 640,502 660,502" fill="#a2652f" stroke="#a2652f"/>
  <rect class="legendBox" x="674" y="426" width="106" height="28"/>
  <text class="label" x="727" y="445" text-anchor="middle" fill="#a2652f">wraps steps</text>

  <path class="connector" d="M1000 380V460Q1000 480 1020 480H1100Q1120 480 1120 500V520" stroke="#64748b"/>
  <polygon class="head" points="1120,520 1110,502 1130,502" fill="#64748b" stroke="#64748b"/>
  <rect class="legendBox" x="1024" y="426" width="112" height="28"/>
  <text class="label" x="1080" y="445" text-anchor="middle" fill="#64748b">imports</text>

  <path class="connector" d="M840 625H950" stroke="#d59c3f"/>
  <polygon class="head" points="950,625 932,615 932,635" fill="#d59c3f" stroke="#d59c3f"/>
  <rect class="legendBox" x="860" y="590" width="74" height="28"/>
  <text class="label" x="897" y="609" text-anchor="middle" fill="#d59c3f">runs</text>

  <path class="connector dependency" d="M450 840V820Q450 800 470 800H1020Q1040 800 1040 780V770" stroke="#b65b67"/>
  <polygon class="head" points="1040,770 1030,788 1050,788" fill="#ffffff" stroke="#b65b67" stroke-width="3.1"/>
  <rect class="legendBox" x="594" y="746" width="116" height="28"/>
  <text class="label" x="652" y="765" text-anchor="middle" fill="#b65b67">implements</text>

  <path class="connector" d="M1110 955H1220" stroke="#8a65d6"/>
  <polygon class="head" points="1220,955 1202,945 1202,965" fill="#8a65d6" stroke="#8a65d6"/>
  <rect class="legendBox" x="1132" y="918" width="74" height="28"/>
  <text class="label" x="1169" y="937" text-anchor="middle" fill="#8a65d6">owns</text>

  <path class="connector" d="M880 845V825Q880 805 900 805H1170Q1190 805 1190 785V770" stroke="#3f8d65"/>
  <polygon class="head" points="1190,770 1180,788 1200,788" fill="#3f8d65" stroke="#3f8d65"/>
  <rect class="legendBox" x="956" y="792" width="124" height="28"/>
  <text class="label" x="1018" y="811" text-anchor="middle" fill="#3f8d65">leader runs</text>

  <rect class="legendBox" x="92" y="1100" width="1120" height="44"/>
  <path class="connector" d="M124 1122H194" stroke="#4f86c6"/>
  <polygon class="head" points="194,1122 176,1112 176,1132" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="legend" x="214" y="1127">solid = recipe composes runtime package contract</text>
  <path class="connector dependency" d="M704 1122H774" stroke="#b65b67"/>
  <polygon class="head" points="774,1122 756,1112 756,1132" fill="#ffffff" stroke="#b65b67" stroke-width="3.1"/>
  <text class="legend" x="794" y="1127">dashed = local test fixture implements batch interface</text>
</svg>
