<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" data-role="primary" data-tip-direction="positive-x"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb" stroke-dasharray="none"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" data-role="primary" data-tip-direction="positive-x"><path d="M0,0 L10,5 L0,10 z" fill="#059669" stroke-dasharray="none"/></marker>
  <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" data-role="primary" data-tip-direction="positive-x"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626" stroke-dasharray="none"/></marker>
  <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 10" data-role="primary" data-tip-direction="positive-x"><path d="M0,0 L10,5 L0,10 z" fill="#64748b" stroke-dasharray="none"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity=".22"/></filter>
</defs>
<style>
  @font-face{font-family:'Architects Daughter';src:local('Architects Daughter');}
  @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
  .bg{fill:#f8fafc}.title{font:42px 'Architects Daughter';fill:#111827}.sub{font:20px 'Comic Mono';fill:#475569}.card-title{font:24px 'Comic Mono';font-weight:700;fill:#111827}.body{font:17px 'Comic Mono';fill:#334155}.small{font:15px 'Comic Mono';fill:#475569}.label{font:16px 'Comic Mono';fill:#2563eb;font-weight:700}.line{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.line-green{stroke:#059669;stroke-width:3.5;fill:none;marker-end:url(#arrow-green);stroke-linecap:round;stroke-linejoin:round}.line-red{stroke:#dc2626;stroke-width:3.5;fill:none;marker-end:url(#arrow-red);stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow-gray);stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke-width:4}.alt{fill:#f59e0b;fill-opacity:.12;stroke:#f59e0b;stroke-opacity:.55;stroke-dasharray:10 8;stroke-width:3}
</style>
<rect class="bg" width="1440" height="820"/>
<text class="title" x="56" y="72">State Transition Model</text>
<text class="sub" x="60" y="112">Comparable states and events become an explicit transition table with optional guards and final states.</text>
<rect class="card" x="70" y="175" width="310" height="185" rx="16" fill="#eff6ff" stroke="#2563eb" filter="url(#shadow)"/>
<text class="card-title" x="96" y="215">Caller types</text>
<text class="body" x="98" y="252">S comparable state</text>
<text class="body" x="98" y="279">E comparable event</text>
<text class="body" x="98" y="306">context.Context</text>
<text class="body" x="98" y="333">optional Guard[S,E]</text>
<rect class="card" x="500" y="145" width="380" height="245" rx="16" fill="#ecfdf5" stroke="#059669" filter="url(#shadow)"/>
<text class="card-title" x="526" y="185">NewMachine</text>
<text class="body" x="528" y="222">register transitions</text>
<text class="body" x="528" y="249">reject duplicate from+event</text>
<text class="body" x="528" y="276">build allowed event order</text>
<text class="body" x="528" y="303">collect known states</text>
<text class="body" x="528" y="330">verify initial state exists</text>
<rect class="card" x="1000" y="175" width="350" height="185" rx="16" fill="#f5f3ff" stroke="#7c3aed" filter="url(#shadow)"/>
<text class="card-title" x="1026" y="215">Machine</text>
<text class="body" x="1028" y="252">current state</text>
<text class="body" x="1028" y="279">transition map</text>
<text class="body" x="1028" y="306">allowed events</text>
<text class="body" x="1028" y="333">final state set</text>
<rect class="card" x="150" y="500" width="270" height="140" rx="16" fill="#fefce8" stroke="#ca8a04" filter="url(#shadow)"/>
<text class="card-title" x="176" y="540">AllowedEvents</text>
<text class="body" x="178" y="576">read current state</text>
<text class="body" x="178" y="603">return copy only</text>
<text class="body" x="178" y="630">no guard execution</text>
<rect class="card" x="570" y="500" width="270" height="140" rx="16" fill="#fff7ed" stroke="#ea580c" filter="url(#shadow)"/>
<text class="card-title" x="596" y="540">CanTransition</text>
<text class="body" x="598" y="576">lookup current edge</text>
<text class="body" x="598" y="603">may execute guard</text>
<text class="body" x="598" y="630">never mutates state</text>
<rect class="card" x="990" y="500" width="300" height="140" rx="16" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
<text class="card-title" x="1016" y="540">Sentinel errors</text>
<text class="body" x="1018" y="576">invalid/final/guard</text>
<text class="body" x="1018" y="603">duplicate/unknown initial</text>
<text class="body" x="1018" y="630">concurrent conflict</text>
<path class="line" d="M380 268H500" marker-end="url(#arrow)"/><text class="label" x="410" y="255">transitions</text>
<path class="line-green" d="M880 268H1000" marker-end="url(#arrow-green)"/><text class="label" x="913" y="255">validated</text>
<path class="dash" d="M610 390V430Q610 455 580 455H315Q285 455 285 485V500" marker-end="url(#arrow-gray)"/><text class="label" x="410" y="445">allowed order</text>
<path class="dash" d="M705 390V500" marker-end="url(#arrow-gray)"/><text class="label" x="723" y="448">inquiry</text>
<path class="dash" d="M1170 360V500" marker-end="url(#arrow-gray)"/><text class="label" x="1180" y="440">errors.Is</text>
<rect class="alt" x="70" y="710" width="1280" height="58" rx="16"/>
<text class="small" x="96" y="745">Boundary: final states reject further events; TransitionError preserves the package sentinel for errors.Is checks.</text>
</svg>
