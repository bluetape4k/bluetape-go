<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">sqlkit Helper Contract Map</title>
  <desc id="desc">Class-style contract map for sqlkit showing database/sql caller-owned session boundaries, transaction helper, row mapping helpers, PostgreSQL-first statement builders, inspectable Statement, and unsupported ORM or migration responsibilities.</desc>
  <defs>
    <filter id="softShadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .card-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; fill: #24364f; }
      .title { font-size: 42px; }
      .subtitle, .section, .member, .label, .legend { font-family: "Comic Mono", "SFMono-Regular", monospace; fill: #526276; }
      .subtitle { font-size: 17px; }
      .section { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0; }
      .card-title { font-size: 25px; }
      .member { font-size: 14px; }
      .label { font-size: 13px; font-weight: 700; }
      .legend { font-size: 13px; }
      .card { stroke-width: 2.2; rx: 12; filter: url(#softShadow); }
      .rule { stroke-width: 1.2; opacity: 0.42; }
      .connector { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3.1; }
      .dependency { stroke-dasharray: 10 8; }
      .head { stroke-linejoin: round; stroke-dasharray: none; }
      .legendBox { fill: #ffffff; stroke: #d7e0ea; stroke-width: 1.4; rx: 12; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1000"/>
  <rect class="frame" x="34" y="30" width="1532" height="932" rx="8"/>
  <text class="title" x="72" y="88">sqlkit Helper Contract Map</text>
  <text class="subtitle" x="76" y="120">Small database/sql helpers keep SQL visible: caller-owned sessions, explicit row mapping, PostgreSQL-first builders.</text>

  <rect class="card" x="86" y="178" width="396" height="220" fill="#f3efff" stroke="#9b7aec"/>
  <text class="card-title" x="284" y="216" text-anchor="middle">database/sql boundary</text>
  <text class="section" x="116" y="246">caller-owned handles</text>
  <line class="rule" x1="116" y1="256" x2="452" y2="256" stroke="#9b7aec"/>
  <text class="member" x="116" y="284">Beginner: BeginTx</text>
  <text class="member" x="116" y="312">Execer / Queryer / QueryRower</text>
  <text class="member" x="116" y="340">Session matches *sql.DB and *sql.Tx</text>
  <text class="member" x="116" y="368">pool lifecycle stays outside sqlkit</text>

  <rect class="card" x="590" y="150" width="420" height="244" fill="#edf9f4" stroke="#63b891"/>
  <text class="card-title" x="800" y="188" text-anchor="middle">Transaction + rows</text>
  <text class="section" x="622" y="218">runtime helpers</text>
  <line class="rule" x1="622" y1="228" x2="978" y2="228" stroke="#63b891"/>
  <text class="member" x="622" y="256">WithTx(ctx, db, opts, fn)</text>
  <text class="member" x="622" y="284">commit only when callback returns nil</text>
  <text class="member" x="622" y="312">QueryAll / QueryOptional / QueryOne</text>
  <text class="member" x="622" y="340">Mapper[T] receives *sql.Rows</text>
  <text class="member" x="622" y="368">Rows close on success and failure</text>

  <rect class="card" x="1118" y="178" width="396" height="220" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="card-title" x="1316" y="216" text-anchor="middle">Statement builders</text>
  <text class="section" x="1148" y="246">PostgreSQL-first</text>
  <line class="rule" x1="1148" y1="256" x2="1484" y2="256" stroke="#6d9df0"/>
  <text class="member" x="1148" y="284">SelectFrom / InsertInto</text>
  <text class="member" x="1148" y="312">Update / DeleteFrom</text>
  <text class="member" x="1148" y="340">identifier validation + quoting</text>
  <text class="member" x="1148" y="368">? rewritten to $1, $2, ...</text>

  <rect class="card" x="86" y="588" width="396" height="210" fill="#fff4de" stroke="#d59c3f"/>
  <text class="card-title" x="284" y="626" text-anchor="middle">Statement</text>
  <text class="section" x="116" y="656">inspectable SQL</text>
  <line class="rule" x1="116" y1="666" x2="452" y2="666" stroke="#d59c3f"/>
  <text class="member" x="116" y="694">SQL string remains visible</text>
  <text class="member" x="116" y="722">Args copied at boundaries</text>
  <text class="member" x="116" y="750">Exec(ctx, Execer)</text>
  <text class="member" x="116" y="778">driver/context errors preserve %w</text>

  <rect class="card" x="590" y="588" width="420" height="210" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="card-title" x="800" y="626" text-anchor="middle">Safety checks</text>
  <text class="section" x="622" y="656">small guardrails</text>
  <line class="rule" x1="622" y1="666" x2="978" y2="666" stroke="#94a3b8"/>
  <text class="member" x="622" y="694">ErrInvalidArgument</text>
  <text class="member" x="622" y="722">ErrNoRows / ErrTooManyRows</text>
  <text class="member" x="622" y="750">Update/Delete require Where</text>
  <text class="member" x="622" y="778">placeholder count must match args</text>

  <rect class="card" x="1118" y="588" width="396" height="210" fill="#fff0f0" stroke="#d56b7d"/>
  <text class="card-title" x="1316" y="626" text-anchor="middle">Unsupported boundary</text>
  <text class="section" x="1148" y="656">use other tools when needed</text>
  <line class="rule" x1="1148" y1="666" x2="1484" y2="666" stroke="#d56b7d"/>
  <text class="member" x="1148" y="694">no pool lifecycle or migration owner</text>
  <text class="member" x="1148" y="722">no ORM state or model hooks</text>
  <text class="member" x="1148" y="750">no broad dialect abstraction</text>
  <text class="member" x="1148" y="778">sqlc, Jet, Atlas stay workflow tools</text>

  <path class="connector" d="M482 288H590" stroke="#8a65d6"/>
  <polygon class="head" points="590,288 572,278 572,298" fill="#8a65d6" stroke="#8a65d6"/>
  <rect class="legendBox" x="496" y="252" width="84" height="28"/>
  <text class="label" x="538" y="271" text-anchor="middle" fill="#8a65d6">executes</text>

  <path class="connector" d="M1010 288H1118" stroke="#4f86c6"/>
  <polygon class="head" points="1118,288 1100,278 1100,298" fill="#4f86c6" stroke="#4f86c6"/>
  <rect class="legendBox" x="1024" y="252" width="90" height="28"/>
  <text class="label" x="1069" y="271" text-anchor="middle" fill="#4f86c6">builds</text>

  <path class="connector" d="M1316 398V474Q1316 494 1296 494H304Q284 494 284 514V588" stroke="#c1842f"/>
  <polygon class="head" points="284,588 274,570 294,570" fill="#c1842f" stroke="#c1842f"/>
  <rect class="legendBox" x="638" y="478" width="132" height="28"/>
  <text class="label" x="704" y="497" text-anchor="middle" fill="#c1842f">returns stmt</text>

  <path class="connector" d="M284 588V534Q284 514 304 514H690Q710 514 710 494V394" stroke="#64748b"/>
  <polygon class="head" points="710,394 700,412 720,412" fill="#64748b" stroke="#64748b"/>
  <rect class="legendBox" x="420" y="498" width="94" height="28"/>
  <text class="label" x="467" y="517" text-anchor="middle" fill="#64748b">Exec</text>

  <path class="connector" d="M800 394V588" stroke="#64748b"/>
  <polygon class="head" points="800,588 790,570 810,570" fill="#64748b" stroke="#64748b"/>
  <rect class="legendBox" x="858" y="478" width="100" height="28"/>
  <text class="label" x="908" y="497" text-anchor="middle" fill="#64748b">guards</text>

  <path class="connector dependency" d="M1316 398V588" stroke="#d56b7d"/>
  <polygon class="head" points="1316,588 1306,570 1326,570" fill="#ffffff" stroke="#d56b7d" stroke-width="3.1"/>
  <rect class="legendBox" x="1338" y="478" width="112" height="28"/>
  <text class="label" x="1394" y="497" text-anchor="middle" fill="#d56b7d">not owned</text>

  <rect class="legendBox" x="94" y="846" width="1050" height="76"/>
  <path class="connector" d="M126 872H196" stroke="#4f86c6"/>
  <polygon class="head" points="196,872 178,862 178,882" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="legend" x="216" y="877">solid = caller-visible SQL, explicit transaction, and row mapping contract</text>
  <path class="connector dependency" d="M126 902H196" stroke="#d56b7d"/>
  <polygon class="head" points="196,902 178,892 178,912" fill="#ffffff" stroke="#d56b7d" stroke-width="3.1"/>
  <text class="legend" x="216" y="907">dashed = larger ORM, dialect, migration, or workflow responsibility</text>
</svg>
