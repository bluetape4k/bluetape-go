<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">rediscoord Cold Burst Sequence</title>
  <desc id="desc">The winner owns the load token; waiters accept only the matching result envelope.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4f77c9"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#319873"/></marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#cf8428"/></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#c85d73"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#7e62d9"/></marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7d9c"/></marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .part-title, .card-title, .panel-title { font-family: "Architects Daughter"; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .body, .small, .msg, .region, .footer { font-family: "Comic Mono"; fill: #526276; }
      .subtitle { font-size: 17px; }
      .panel-title { font-size: 24px; }
      .card-title { font-size: 22px; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 12px; font-weight: 700; }
      .footer { font-size: 14px; }
      .panel { stroke: #d0deeb; stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card { stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card-divider { stroke-width: 1.1; opacity: .45; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: .88; }
      .route { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .alt { fill: #f7f2ff; fill-opacity: .22; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .alt-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .else-line { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 14; }
      .badge { stroke-width: 1.6; }
      .badge-text { font-family: "Comic Mono"; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .legend { fill: #ffffff; stroke: #d4e0ec; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect class="canvas" width="1500" height="1080"/>
  <rect class="frame" x="34" y="30" width="1432" height="1016" rx="8"/>
  <text class="title" x="72" y="88">rediscoord Cold Burst Sequence</text>
  <text class="subtitle" x="76" y="120">The winner owns the load token; waiters accept only the matching result envelope.</text>
  <rect class="participant" x="55" y="174" width="160" height="68" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="part-title" x="135" y="202" text-anchor="middle">Process A</text>
  <text class="small" x="135" y="224" text-anchor="middle">winner</text>
  <line class="lifeline" x1="135" y1="242" x2="135" y2="954"/>
  <rect class="participant" x="255" y="174" width="160" height="68" fill="#f3efff" stroke="#9b7aec"/>
  <text class="part-title" x="335" y="202" text-anchor="middle">Process B</text>
  <text class="small" x="335" y="224" text-anchor="middle">waiter</text>
  <line class="lifeline" x1="335" y1="242" x2="335" y2="954"/>
  <rect class="participant" x="490" y="174" width="160" height="68" fill="#edf9f4" stroke="#63b891"/>
  <text class="part-title" x="570" y="202" text-anchor="middle">StampedeCache</text>
  <text class="small" x="570" y="224" text-anchor="middle">wrapper</text>
  <line class="lifeline" x1="570" y1="242" x2="570" y2="954"/>
  <rect class="participant" x="740" y="174" width="160" height="68" fill="#fff0f0" stroke="#dc2626"/>
  <text class="part-title" x="820" y="202" text-anchor="middle">Redis</text>
  <text class="small" x="820" y="224" text-anchor="middle">lock/result</text>
  <line class="lifeline" x1="820" y1="242" x2="820" y2="954"/>
  <rect class="participant" x="1000" y="174" width="160" height="68" fill="#fff4de" stroke="#d59c3f"/>
  <text class="part-title" x="1080" y="202" text-anchor="middle">Local cache</text>
  <text class="small" x="1080" y="224" text-anchor="middle">wrapped</text>
  <line class="lifeline" x1="1080" y1="242" x2="1080" y2="954"/>
  <rect class="participant" x="1205" y="174" width="160" height="68" fill="#f8fafc" stroke="#64748b"/>
  <text class="part-title" x="1285" y="202" text-anchor="middle">Loader</text>
  <text class="small" x="1285" y="224" text-anchor="middle">user func</text>
  <line class="lifeline" x1="1285" y1="242" x2="1285" y2="954"/>
  <rect class="activation" x="563" y="298" width="14" height="644" rx="7"/>
  <rect class="activation" x="813" y="358" width="14" height="524" rx="7"/>
  <rect class="activation" x="1073" y="478" width="14" height="464" rx="7"/>
  <rect class="alt" x="78" y="330" width="1276" height="330" rx="16"/>
  <rect class="alt-label" x="96" y="348" width="174" height="30" rx="15"/>
  <text class="region" x="118" y="368">alt owner path</text>
  <line class="else-line" x1="92" y1="690" x2="1340" y2="690"/>
  <rect class="alt-label" x="96" y="708" width="192" height="30" rx="15"/>
  <text class="region" x="118" y="728">else waiter path</text>
  <path class="route" d="M135 310 L570 310" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <rect class="pill" x="257" y="268" width="190" height="30" rx="15"/>
  <circle class="badge" cx="275" cy="283" r="13" fill="#4f77c9"/>
  <text class="badge-text" x="275" y="287" text-anchor="middle">1</text>
  <text class="msg" x="367" y="288" text-anchor="middle" fill="#4f77c9">GetOrLoad cold key</text>
  <path class="route" d="M570 370 L820 370" stroke="#319873" marker-end="url(#arrow-green)"/>
  <rect class="pill" x="600" y="328" width="190" height="30" rx="15"/>
  <circle class="badge" cx="618" cy="343" r="13" fill="#319873"/>
  <text class="badge-text" x="618" y="347" text-anchor="middle">2</text>
  <text class="msg" x="710" y="348" text-anchor="middle" fill="#319873">acquire load token</text>
  <path class="return" d="M820 430 L570 430" stroke="#319873" marker-end="url(#arrow-green)"/>
  <rect class="pill" x="624" y="388" width="142" height="30" rx="15"/>
  <circle class="badge" cx="642" cy="403" r="13" fill="#319873"/>
  <text class="badge-text" x="642" y="407" text-anchor="middle">3a</text>
  <text class="msg" x="710" y="408" text-anchor="middle" fill="#319873">winner token</text>
  <path class="route" d="M570 490 L1080 490" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <rect class="pill" x="734" y="448" width="182" height="30" rx="15"/>
  <circle class="badge" cx="752" cy="463" r="13" fill="#4f77c9"/>
  <text class="badge-text" x="752" y="467" text-anchor="middle">4a</text>
  <text class="msg" x="840" y="468" text-anchor="middle" fill="#4f77c9">wrapped GetOrLoad</text>
  <path class="route" d="M1080 550 L1285 550" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <rect class="pill" x="1099" y="508" width="166" height="30" rx="15"/>
  <circle class="badge" cx="1117" cy="523" r="13" fill="#4f77c9"/>
  <text class="badge-text" x="1117" y="527" text-anchor="middle">5a</text>
  <text class="msg" x="1197" y="528" text-anchor="middle" fill="#4f77c9">run loader once</text>
  <path class="route" d="M570 610 L820 610" stroke="#7e62d9" marker-end="url(#arrow-purple)"/>
  <rect class="pill" x="608" y="568" width="174" height="30" rx="15"/>
  <circle class="badge" cx="626" cy="583" r="13" fill="#7e62d9"/>
  <text class="badge-text" x="626" y="587" text-anchor="middle">6a</text>
  <text class="msg" x="710" y="588" text-anchor="middle" fill="#7e62d9">publish envelope</text>
  <path class="route" d="M335 730 L570 730" stroke="#cf8428" marker-end="url(#arrow-amber)"/>
  <rect class="pill" x="377" y="688" width="150" height="30" rx="15"/>
  <circle class="badge" cx="395" cy="703" r="13" fill="#cf8428"/>
  <text class="badge-text" x="395" y="707" text-anchor="middle">1b</text>
  <text class="msg" x="467" y="708" text-anchor="middle" fill="#cf8428">same cold key</text>
  <path class="route" d="M570 790 L820 790" stroke="#cf8428" marker-end="url(#arrow-amber)"/>
  <rect class="pill" x="604" y="748" width="182" height="30" rx="15"/>
  <circle class="badge" cx="622" cy="763" r="13" fill="#cf8428"/>
  <text class="badge-text" x="622" y="767" text-anchor="middle">2b</text>
  <text class="msg" x="710" y="768" text-anchor="middle" fill="#cf8428">poll token result</text>
  <path class="return" d="M820 850 L570 850" stroke="#cf8428" marker-end="url(#arrow-amber)"/>
  <rect class="pill" x="604" y="808" width="182" height="30" rx="15"/>
  <circle class="badge" cx="622" cy="823" r="13" fill="#cf8428"/>
  <text class="badge-text" x="622" y="827" text-anchor="middle">3b</text>
  <text class="msg" x="710" y="828" text-anchor="middle" fill="#cf8428">matching envelope</text>
  <path class="route" d="M570 910 L1080 910" stroke="#319873" marker-end="url(#arrow-green)"/>
  <rect class="pill" x="706" y="868" width="238" height="30" rx="15"/>
  <circle class="badge" cx="724" cy="883" r="13" fill="#319873"/>
  <text class="badge-text" x="724" y="887" text-anchor="middle">4b</text>
  <text class="msg" x="840" y="888" text-anchor="middle" fill="#319873">fill local via GetOrLoad</text>
  <rect class="legend" x="82" y="1002" width="1336" height="40" rx="8"/>
  <text class="footer" x="750" y="1028" text-anchor="middle">Redis envelope is transient coordination metadata, not a durable cache value.</text>
</svg>
