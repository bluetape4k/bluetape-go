<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity=".22"/></filter>
</defs>
<style>
  @font-face{font-family:'Architects Daughter';src:local('Architects Daughter');}
  @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
  .bg{fill:#f8fafc}.title{font:42px 'Architects Daughter','Comic Sans MS',cursive;fill:#111827}.sub{font:20px 'Comic Mono','Courier New',monospace;fill:#475569}.card-title{font:24px 'Comic Mono','Courier New',monospace;font-weight:700;fill:#111827}.body{font:17px 'Comic Mono','Courier New',monospace;fill:#334155}.small{font:15px 'Comic Mono','Courier New',monospace;fill:#475569}.label{font:16px 'Comic Mono','Courier New',monospace;fill:#2563eb;font-weight:700}.line{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.line-green{stroke:#059669;stroke-width:3.5;fill:none;marker-end:url(#arrow-green)}.line-red{stroke:#dc2626;stroke-width:3.5;fill:none;marker-end:url(#arrow-red)}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke-width:4}.alt{fill:#f59e0b;fill-opacity:.12;stroke:#f59e0b;stroke-opacity:.55;stroke-dasharray:10 8;stroke-width:3}
</style>
<rect class="bg" width="1440" height="840"/>
<text class="title" x="56" y="72">Workflow Runner Flow</text>
<text class="sub" x="60" y="112">Small runners execute context-aware Work functions and aggregate workreport.Report trees.</text>
<rect class="card" x="60" y="180" width="275" height="185" rx="16" fill="#eff6ff" stroke="#2563eb" filter="url(#shadow)"/>
<text class="card-title" x="86" y="220">Caller</text>
<text class="body" x="88" y="256">Runner.Run(ctx)</text>
<text class="body" x="88" y="283">nil ctx -> Background</text>
<text class="body" x="88" y="310">Work returns Report</text>
<text class="body" x="88" y="337">closures own data</text>
<rect class="card" x="455" y="145" width="300" height="220" rx="16" fill="#ecfdf5" stroke="#059669" filter="url(#shadow)"/>
<text class="card-title" x="482" y="185">Sequential</text>
<text class="body" x="484" y="222">run input order</text>
<text class="body" x="484" y="249">aggregate child reports</text>
<text class="body" x="484" y="276">StopOnFailure stops early</text>
<text class="body" x="484" y="303">terminal reports stop</text>
<rect class="card" x="455" y="455" width="300" height="205" rx="16" fill="#fff7ed" stroke="#ea580c" filter="url(#shadow)"/>
<text class="card-title" x="482" y="495">Conditional</text>
<text class="body" x="484" y="532">predicate evaluated once</text>
<text class="body" x="484" y="559">one selected branch</text>
<text class="body" x="484" y="586">no false branch -> completed</text>
<text class="body" x="484" y="613">context errors -> cancelled</text>
<rect class="card" x="880" y="145" width="330" height="220" rx="16" fill="#f5f3ff" stroke="#7c3aed" filter="url(#shadow)"/>
<text class="card-title" x="908" y="185">Parallel</text>
<text class="body" x="910" y="222">shared cancellable context</text>
<text class="body" x="910" y="249">start all works</text>
<text class="body" x="910" y="276">preserve input order</text>
<text class="body" x="910" y="303">cancel siblings on stop cause</text>
<text class="body" x="910" y="330">wait for started goroutines</text>
<rect class="card" x="880" y="455" width="330" height="205" rx="16" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
<text class="card-title" x="908" y="495">Report boundary</text>
<text class="body" x="910" y="532">unknown status -> failed</text>
<text class="body" x="910" y="559">nil work -> failed report</text>
<text class="body" x="910" y="586">invalid policy -> failed</text>
<text class="body" x="910" y="613">Aggregate copies children</text>
<path class="line" d="M335 270 L455 255"/><text class="label" x="365" y="248">sequence</text>
<path class="line" d="M335 300 C380 420 420 510 455 555"/><text class="label" x="355" y="455">branch</text>
<path class="line-green" d="M755 255 L880 255"/><text class="label" x="785" y="242">fan out</text>
<path class="dash" d="M605 365 C690 430 815 480 880 530"/><text class="label" x="705" y="445">reports</text>
<path class="dash" d="M1045 365 L1045 455"/><text class="label" x="1065" y="416">aggregate</text>
<path class="line-red" d="M1210 275 C1305 355 1300 525 1210 555"/><text class="label" x="1245" y="430">cancel on terminal</text>
<rect class="alt" x="70" y="735" width="1240" height="58" rx="16"/>
<text class="small" x="96" y="770">alt: no durable engine, retry scheduler, Kotlin-style DSL, mutable WorkContext map, FIFO fairness, or hidden shared state is provided.</text>
</svg>
