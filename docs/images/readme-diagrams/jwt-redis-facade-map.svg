<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">jwt/redis Facade Map</title>
  <desc id="desc">This subpackage exposes the Redis repository aliases while the jwt package owns rotation and parsing logic.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4f77c9"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#319873"/></marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#cf8428"/></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#c85d73"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#7e62d9"/></marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7d9c"/></marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .part-title, .card-title, .panel-title { font-family: "Architects Daughter"; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .body, .small, .msg, .region, .footer { font-family: "Comic Mono"; fill: #526276; }
      .subtitle { font-size: 17px; }
      .panel-title { font-size: 24px; }
      .card-title { font-size: 22px; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 12px; font-weight: 700; }
      .footer { font-size: 14px; }
      .panel { stroke: #d0deeb; stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card { stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card-divider { stroke-width: 1.1; opacity: .45; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: .88; }
      .route { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .alt { fill: #f7f2ff; fill-opacity: .22; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .alt-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .else-line { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 14; }
      .badge { stroke-width: 1.6; }
      .badge-text { font-family: "Comic Mono"; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .legend { fill: #ffffff; stroke: #d4e0ec; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect class="canvas" width="1500" height="920"/>
  <rect class="frame" x="34" y="30" width="1432" height="856" rx="8"/>
  <text class="title" x="72" y="88">jwt/redis Facade Map</text>
  <text class="subtitle" x="76" y="120">This subpackage exposes the Redis repository aliases while the jwt package owns rotation and parsing logic.</text>
  <rect class="card" x="92" y="210" width="330" height="175" rx="8" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="card-title" x="257" y="252" text-anchor="middle">Application</text>
  <path class="card-divider" d="M92 272H422" stroke="#6d9df0"/>
  <path class="card-divider" d="M92 342H422" stroke="#6d9df0"/>
  <text class="body" x="116" y="300">imports jwt/redis</text>
  <text class="body" x="116" y="324">builds Options</text>
  <text class="body" x="116" y="366">receives Repository</text>
  <rect class="card" x="500" y="180" width="390" height="230" rx="8" fill="#edf9f4" stroke="#63b891"/>
  <text class="card-title" x="695" y="222" text-anchor="middle">jwt/redis</text>
  <path class="card-divider" d="M500 242H890" stroke="#63b891"/>
  <path class="card-divider" d="M500 312H890" stroke="#63b891"/>
  <text class="body" x="524" y="270">Options alias</text>
  <text class="body" x="524" y="294">Repository alias</text>
  <text class="body" x="524" y="336">New delegates to jwt</text>
  <text class="body" x="524" y="360">small import boundary</text>
  <rect class="card" x="1010" y="170" width="390" height="250" rx="8" fill="#fff0f0" stroke="#dc2626"/>
  <image href="data:image/svg+xml;base64," x="1030" y="188" width="46" height="46"/>
  <text class="card-title" x="1225" y="212" text-anchor="middle">jwt RedisRepository</text>
  <path class="card-divider" d="M1010 232H1400" stroke="#dc2626"/>
  <path class="card-divider" d="M1010 302H1400" stroke="#dc2626"/>
  <text class="body" x="1034" y="260">KeyChain storage</text>
  <text class="body" x="1034" y="284">current kid metadata</text>
  <text class="body" x="1034" y="326">retention order</text>
  <text class="body" x="1034" y="350">CAS-style scripts</text>
  <rect class="card" x="500" y="545" width="390" height="165" rx="8" fill="#f3efff" stroke="#9b7aec"/>
  <text class="card-title" x="695" y="587" text-anchor="middle">Provider layer</text>
  <path class="card-divider" d="M500 607H890" stroke="#9b7aec"/>
  <path class="card-divider" d="M500 674H890" stroke="#9b7aec"/>
  <text class="body" x="524" y="635">DistributedProvider</text>
  <text class="body" x="524" y="659">ComposeContext</text>
  <text class="body" x="524" y="701">ParseContext</text>
  <rect class="card" x="1010" y="545" width="390" height="165" rx="8" fill="#fff4de" stroke="#d59c3f"/>
  <text class="card-title" x="1205" y="587" text-anchor="middle">Operational boundary</text>
  <path class="card-divider" d="M1010 607H1400" stroke="#d59c3f"/>
  <path class="card-divider" d="M1010 674H1400" stroke="#d59c3f"/>
  <text class="body" x="1034" y="635">Redis stores signing keys</text>
  <text class="body" x="1034" y="659">reset is explicit</text>
  <text class="body" x="1034" y="701">retention protects readers</text>
  <path class="route" d="M422 300H500" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <text class="msg" x="460" y="282" text-anchor="middle" fill="#4f77c9">New</text>
  <path class="route" d="M890 300H1010" stroke="#c85d73" marker-end="url(#arrow-red)"/>
  <text class="msg" x="950" y="282" text-anchor="middle" fill="#c85d73">delegate</text>
  <path class="route" d="M695 410V545" stroke="#7e62d9" marker-end="url(#arrow-purple)"/>
  <text class="msg" x="750" y="492" text-anchor="middle" fill="#7e62d9">provider uses</text>
  <path class="route" d="M890 620H1010" stroke="#cf8428" marker-end="url(#arrow-amber)"/>
  <text class="msg" x="950" y="602" text-anchor="middle" fill="#cf8428">runtime rule</text>
  <rect class="legend" x="82" y="842" width="1336" height="40" rx="8"/>
  <text class="footer" x="750" y="868" text-anchor="middle">Use jwt/redis when callers want a Redis-specific import path without depending on internal repository types.</text>
</svg>
