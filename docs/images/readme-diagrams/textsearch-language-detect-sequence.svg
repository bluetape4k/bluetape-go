  <circle class="badge" cx="618" cy="773" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="618" y="777" text-anchor="middle">7</text>
  <text class="msg" x="690" y="778" text-anchor="middle" fill="#4f86c6">Detect(text)</text>

  <path class="call" d="M1203 880H1465" stroke="#2f8f8a" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="1260" y="838" width="154" height="30" rx="15"/>
  <circle class="badge" cx="1280" cy="853" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="1280" y="857" text-anchor="middle">8</text>
  <text class="msg" x="1342" y="858" text-anchor="middle" fill="#2f8f8a">Result</text>

  <path class="return" d="M1465 960H164" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="682" y="918" width="264" height="30" rx="15"/>
  <circle class="badge" cx="704" cy="933" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="704" y="937" text-anchor="middle">9</text>
  <text class="msg" x="820" y="938" text-anchor="middle" fill="#5f8d3e">Detected + confidence</text>

  <path class="call" d="M164 1040H1203" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="564" y="998" width="250" height="30" rx="15"/>
  <circle class="badge" cx="586" cy="1013" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="586" y="1017" text-anchor="middle">10</text>
  <text class="msg" x="696" y="1018" text-anchor="middle" fill="#4f86c6">Confidences(text)</text>

  <path class="return" d="M1465 1120H164" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="680" y="1078" width="268" height="30" rx="15"/>
  <circle class="badge" cx="702" cy="1093" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
