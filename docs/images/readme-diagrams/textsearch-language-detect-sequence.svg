  <rect class="pill" x="560" y="518" width="236" height="30" rx="15"/>
  <circle class="badge" cx="582" cy="533" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="582" y="537" text-anchor="middle">4</text>
  <text class="msg" x="684" y="538" text-anchor="middle" fill="#4f86c6">apply model options</text>

  <path class="call" d="M939 640H1203" stroke="#2f8f8a" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="1008" y="598" width="128" height="30" rx="15"/>
