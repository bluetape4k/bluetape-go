  <text class="badgeText" x="584" y="697" text-anchor="middle">6</text>
  <text class="msg" x="688" y="698" text-anchor="middle" fill="#5f8d3e">reusable Detector</text>

  <path class="call" d="M164 800H1203" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
