  <text class="msg" x="820" y="1258" text-anchor="middle" fill="#5f8d3e">sections with byte offsets</text>

  <path class="call" d="M164 1360H1697" stroke="#b65b67" marker-end="url(#seqArrow-red)"/>
  <rect class="pill" x="768" y="1318" width="292" height="30" rx="15"/>
  <circle class="badge" cx="790" cy="1333" r="13" fill="#b65b67" stroke="#b65b67"/>
