<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1600" viewBox="0 0 1800 1600" role="img" aria-labelledby="title desc">
  <title id="title">textsearch/language Detect Sequence</title>
  <desc id="desc">Sequence diagram for textsearch/language showing detector construction from selected language subsets, option application, Lingua builder setup, reusable detector return, Detect, Confidences, DetectMultiple, result mapping with ISO codes and byte offsets, and Unicode script helper checks.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="seqArrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8d3e" stroke="#5f8d3e" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c1842f" stroke="#c1842f" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-teal" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f8f8a" stroke="#2f8f8a" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-red" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b65b67" stroke="#b65b67" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .participant-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .role, .msg, .region, .footer { font-family: "Comic Mono", "SFMono-Regular", monospace; fill: #526276; }
      .subtitle { font-size: 17px; }
      .participant-title { font-size: 21px; }
      .role { font-size: 13px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: 0.88; }
      .call, .return, .error { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .call { stroke-width: 3; }
      .return, .error { stroke-width: 2.7; stroke-dasharray: 9 8; }
      .phase { fill: none; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .phase-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 15; }
      .badge { stroke-width: 1.6; }
      .badgeText { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1600"/>
  <rect class="frame" x="34" y="30" width="1732" height="1536" rx="8"/>
  <text class="title" x="72" y="88">textsearch/language Detect Sequence</text>
  <text class="subtitle" x="76" y="120">Build detectors once for chosen subsets; detection validates input, delegates to Lingua, and returns caller-visible hints with metadata.</text>

  <rect class="participant" x="72" y="174" width="184" height="72" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="participant-title" x="164" y="202" text-anchor="middle">Caller</text>
  <text class="role" x="164" y="224" text-anchor="middle">subset + text</text>
  <line class="lifeline" x1="164" y1="246" x2="164" y2="1492"/>

  <rect class="participant" x="318" y="174" width="196" height="72" fill="#edf9f4" stroke="#63b891"/>
  <text class="participant-title" x="416" y="202" text-anchor="middle">Adapter</text>
  <text class="role" x="416" y="224" text-anchor="middle">language package</text>
  <line class="lifeline" x1="416" y1="246" x2="416" y2="1492"/>

  <rect class="participant" x="578" y="174" width="198" height="72" fill="#fff4de" stroke="#d59c3f"/>
  <text class="participant-title" x="677" y="202" text-anchor="middle">Options</text>
  <text class="role" x="677" y="224" text-anchor="middle">subset + mode</text>
  <line class="lifeline" x1="677" y1="246" x2="677" y2="1492"/>

  <rect class="participant" x="840" y="174" width="198" height="72" fill="#f3efff" stroke="#9b7aec"/>
  <text class="participant-title" x="939" y="202" text-anchor="middle">Lingua builder</text>
  <text class="role" x="939" y="224" text-anchor="middle">model loader</text>
  <line class="lifeline" x1="939" y1="246" x2="939" y2="1492"/>

  <rect class="participant" x="1104" y="174" width="198" height="72" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="participant-title" x="1203" y="202" text-anchor="middle">Detector</text>
  <text class="role" x="1203" y="224" text-anchor="middle">reusable wrapper</text>
  <line class="lifeline" x1="1203" y1="246" x2="1203" y2="1492"/>

  <rect class="participant" x="1366" y="174" width="198" height="72" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="participant-title" x="1465" y="202" text-anchor="middle">Result mapper</text>
  <text class="role" x="1465" y="224" text-anchor="middle">ISO + sections</text>
  <line class="lifeline" x1="1465" y1="246" x2="1465" y2="1492"/>

  <rect class="participant" x="1626" y="174" width="142" height="72" fill="#fff0f0" stroke="#d56b7d"/>
  <text class="participant-title" x="1697" y="202" text-anchor="middle">Scripts</text>
  <text class="role" x="1697" y="224" text-anchor="middle">Unicode</text>
  <line class="lifeline" x1="1697" y1="246" x2="1697" y2="1492"/>

  <rect class="activation" x="157" y="304" width="14" height="1110" rx="7"/>
  <rect class="activation" x="409" y="318" width="14" height="760" rx="7"/>
  <rect class="activation" x="670" y="398" width="14" height="190" rx="7"/>
  <rect class="activation" x="932" y="478" width="14" height="258" rx="7"/>
  <rect class="activation" x="1196" y="620" width="14" height="572" rx="7"/>
  <rect class="activation" x="1458" y="838" width="14" height="354" rx="7"/>
  <rect class="activation" x="1690" y="1328" width="14" height="86" rx="7"/>

  <rect class="phase" x="296" y="292" width="674" height="344" rx="16"/>
  <rect class="phase-label" x="318" y="254" width="220" height="30" rx="15"/>
  <text class="region" x="342" y="274">detector build</text>

  <rect class="phase" x="388" y="668" width="1112" height="548" rx="16"/>
  <rect class="phase-label" x="410" y="630" width="214" height="30" rx="15"/>
  <text class="region" x="434" y="650">detection calls</text>

  <rect class="phase" x="1598" y="1282" width="126" height="156" rx="16"/>
  <rect class="phase-label" x="1406" y="1244" width="268" height="30" rx="15"/>
  <text class="region" x="1430" y="1264">script helper shortcut</text>

  <path class="call" d="M164 320H416" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="212" y="278" width="162" height="30" rx="15"/>
  <circle class="badge" cx="232" cy="293" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="232" y="297" text-anchor="middle">1</text>
  <text class="msg" x="300" y="298" text-anchor="middle" fill="#4f86c6">NewDetector</text>

  <path class="call" d="M416 400H677" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="480" y="358" width="136" height="30" rx="15"/>
  <circle class="badge" cx="500" cy="373" r="13" fill="#c1842f" stroke="#c1842f"/>
  <text class="badgeText" x="500" y="377" text-anchor="middle">2</text>
  <text class="msg" x="554" y="378" text-anchor="middle" fill="#c1842f">normalize</text>

  <path class="call" d="M416 480H939" stroke="#8a65d6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="584" y="438" width="188" height="30" rx="15"/>
  <circle class="badge" cx="606" cy="453" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="606" y="457" text-anchor="middle">3</text>
  <text class="msg" x="684" y="458" text-anchor="middle" fill="#4f86c6">FromLanguages</text>

