  <text class="msg" x="920" y="1338" text-anchor="middle" fill="#b65b67">Contains* script check</text>

  <path class="return" d="M1697 1440H164" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="812" y="1398" width="214" height="30" rx="15"/>
  <circle class="badge" cx="834" cy="1413" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="834" y="1417" text-anchor="middle">15</text>
  <text class="msg" x="924" y="1418" text-anchor="middle" fill="#5f8d3e">boolean hint</text>

  <rect class="pill" x="320" y="1506" width="1160" height="34" rx="17"/>
  <text class="footer" x="900" y="1528" text-anchor="middle">Detection output is a preprocessing hint; security, moderation, compliance, and authorization decisions remain caller-owned.</text>
