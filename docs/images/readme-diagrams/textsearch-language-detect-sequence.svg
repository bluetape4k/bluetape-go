  <text class="msg" x="820" y="1098" text-anchor="middle" fill="#5f8d3e">sorted confidence values</text>

  <path class="call" d="M164 1200H1203" stroke="#4f86c6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="556" y="1158" width="270" height="30" rx="15"/>
  <circle class="badge" cx="578" cy="1173" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="578" y="1177" text-anchor="middle">12</text>
  <text class="msg" x="696" y="1178" text-anchor="middle" fill="#4f86c6">DetectMultiple(text)</text>

  <path class="return" d="M1465 1280H164" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="650" y="1238" width="328" height="30" rx="15"/>
  <circle class="badge" cx="672" cy="1253" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
