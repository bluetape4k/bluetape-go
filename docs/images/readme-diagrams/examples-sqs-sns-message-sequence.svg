<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">SQS/SNS Example Message Sequence</title>
  <desc id="desc">Sequence diagram for examples/sqs-sns showing JSON message encoding, SQS send and long-poll receive, visibility extension, delete acknowledgement, SNS topic subscription, publish, SQS fanout receive, and payload unwrap.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="seqArrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c1842f" stroke="#c1842f" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8d3e" stroke="#5f8d3e" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-teal" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f8f8a" stroke="#2f8f8a" stroke-dasharray="none"/>
    </marker>
    <marker id="seqArrow-red" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b65b67" stroke="#b65b67" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .participant-title { font-family: "Architects Daughter", "Comic Sans MS", cursive; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .role, .msg, .region, .footer { font-family: "Comic Mono", "SFMono-Regular", monospace; fill: #526276; }
      .subtitle { font-size: 17px; }
      .participant-title { font-size: 22px; }
      .role { font-size: 13px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 13px; font-weight: 700; }
      .footer { font-size: 14px; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: 0.88; }
      .call, .return, .error { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .call { stroke-width: 3; }
      .return, .error { stroke-width: 2.7; stroke-dasharray: 9 8; }
      .phase { fill: none; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .phase-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 15; }
      .badge { stroke-width: 1.6; }
      .badgeText { font-family: "Comic Mono", "SFMono-Regular", monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1320"/>
  <rect class="frame" x="34" y="30" width="1732" height="1256" rx="8"/>
  <text class="title" x="72" y="88">SQS/SNS Example Message Sequence</text>
  <text class="subtitle" x="76" y="120">The smoke test composes AWS SDK clients directly: queue acknowledgement is explicit and SNS fanout is verified by receiving from SQS.</text>

  <rect class="participant" x="72" y="174" width="216" height="72" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="participant-title" x="180" y="202" text-anchor="middle">Example/Test</text>
  <text class="role" x="180" y="224" text-anchor="middle">caller owns ctx</text>
  <line class="lifeline" x1="180" y1="246" x2="180" y2="1210"/>

  <rect class="participant" x="376" y="174" width="214" height="72" fill="#fff4de" stroke="#d59c3f"/>
  <text class="participant-title" x="483" y="202" text-anchor="middle">JSON codec</text>
  <text class="role" x="483" y="224" text-anchor="middle">marshal/unmarshal</text>
  <line class="lifeline" x1="483" y1="246" x2="483" y2="1210"/>

  <rect class="participant" x="682" y="174" width="220" height="72" fill="#f3efff" stroke="#9b7aec"/>
  <text class="participant-title" x="792" y="202" text-anchor="middle">SQS client</text>
  <text class="role" x="792" y="224" text-anchor="middle">AWS SDK v2</text>
  <line class="lifeline" x1="792" y1="246" x2="792" y2="1210"/>

  <rect class="participant" x="986" y="174" width="226" height="72" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="participant-title" x="1099" y="202" text-anchor="middle">Floci SQS</text>
  <text class="role" x="1099" y="224" text-anchor="middle">queue + receipt</text>
  <line class="lifeline" x1="1099" y1="246" x2="1099" y2="1210"/>

  <rect class="participant" x="1300" y="174" width="220" height="72" fill="#fff0f0" stroke="#d56b7d"/>
  <text class="participant-title" x="1410" y="202" text-anchor="middle">SNS client</text>
  <text class="role" x="1410" y="224" text-anchor="middle">topic API</text>
  <line class="lifeline" x1="1410" y1="246" x2="1410" y2="1210"/>

  <rect class="participant" x="1582" y="174" width="176" height="72" fill="#edf9f4" stroke="#63b891"/>
  <text class="participant-title" x="1670" y="202" text-anchor="middle">Floci SNS</text>
  <text class="role" x="1670" y="224" text-anchor="middle">topic fanout</text>
  <line class="lifeline" x1="1670" y1="246" x2="1670" y2="1210"/>

  <rect class="activation" x="173" y="296" width="14" height="876" rx="7"/>
  <rect class="activation" x="476" y="310" width="14" height="704" rx="7"/>
  <rect class="activation" x="785" y="470" width="14" height="534" rx="7"/>
  <rect class="activation" x="1092" y="550" width="14" height="536" rx="7"/>
  <rect class="activation" x="1403" y="846" width="14" height="182" rx="7"/>
  <rect class="activation" x="1663" y="926" width="14" height="102" rx="7"/>

  <rect class="phase" x="638" y="436" width="504" height="388" rx="16"/>
  <rect class="phase-label" x="660" y="454" width="194" height="30" rx="15"/>
  <text class="region" x="684" y="474">direct SQS flow</text>

  <rect class="phase" x="1036" y="812" width="676" height="292" rx="16"/>
  <rect class="phase-label" x="1058" y="830" width="206" height="30" rx="15"/>
  <text class="region" x="1082" y="850">SNS fanout flow</text>

  <path class="call" d="M180 320H483" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="244" y="278" width="178" height="30" rx="15"/>
  <circle class="badge" cx="264" cy="293" r="13" fill="#c1842f" stroke="#c1842f"/>
  <text class="badgeText" x="264" y="297" text-anchor="middle">1</text>
  <text class="msg" x="336" y="298" text-anchor="middle" fill="#c1842f">encode order</text>

  <path class="return" d="M483 400H180" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="244" y="358" width="178" height="30" rx="15"/>
  <circle class="badge" cx="264" cy="373" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="264" y="377" text-anchor="middle">2</text>
  <text class="msg" x="336" y="378" text-anchor="middle" fill="#5f8d3e">JSON string</text>

  <path class="call" d="M180 480H792" stroke="#8a65d6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="376" y="438" width="224" height="30" rx="15"/>
  <circle class="badge" cx="398" cy="453" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="398" y="457" text-anchor="middle">3</text>
  <text class="msg" x="492" y="458" text-anchor="middle" fill="#4f86c6">SendMessage</text>

  <path class="call" d="M792 560H1099" stroke="#64748b" marker-end="url(#seqArrow-teal)"/>
  <rect class="pill" x="862" y="518" width="170" height="30" rx="15"/>
  <circle class="badge" cx="882" cy="533" r="13" fill="#2f8f8a" stroke="#2f8f8a"/>
  <text class="badgeText" x="882" y="537" text-anchor="middle">4</text>
  <text class="msg" x="952" y="538" text-anchor="middle" fill="#2f8f8a">enqueue</text>

  <path class="call" d="M180 640H792" stroke="#8a65d6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="342" y="598" width="288" height="30" rx="15"/>
  <circle class="badge" cx="364" cy="613" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="364" y="617" text-anchor="middle">5</text>
  <text class="msg" x="492" y="618" text-anchor="middle" fill="#4f86c6">ReceiveMessage long poll</text>

  <path class="return" d="M1099 720H180" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="486" y="678" width="308" height="30" rx="15"/>
  <circle class="badge" cx="508" cy="693" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="508" y="697" text-anchor="middle">6</text>
  <text class="msg" x="646" y="698" text-anchor="middle" fill="#5f8d3e">message + receipt handle</text>

  <path class="call" d="M180 800H483" stroke="#c1842f" marker-end="url(#seqArrow-amber)"/>
  <rect class="pill" x="234" y="758" width="198" height="30" rx="15"/>
  <circle class="badge" cx="254" cy="773" r="13" fill="#c1842f" stroke="#c1842f"/>
  <text class="badgeText" x="254" y="777" text-anchor="middle">7</text>
  <text class="msg" x="336" y="778" text-anchor="middle" fill="#c1842f">decode body</text>

  <path class="call" d="M180 880H792" stroke="#8a65d6" marker-end="url(#seqArrow-blue)"/>
  <rect class="pill" x="304" y="838" width="364" height="30" rx="15"/>
  <circle class="badge" cx="326" cy="853" r="13" fill="#4f86c6" stroke="#4f86c6"/>
  <text class="badgeText" x="326" y="857" text-anchor="middle">8</text>
  <text class="msg" x="492" y="858" text-anchor="middle" fill="#4f86c6">ChangeVisibility + Delete</text>

  <path class="call" d="M180 960H1410" stroke="#b65b67" marker-end="url(#seqArrow-red)"/>
  <rect class="pill" x="638" y="918" width="314" height="30" rx="15"/>
  <circle class="badge" cx="660" cy="933" r="13" fill="#b65b67" stroke="#b65b67"/>
  <text class="badgeText" x="660" y="937" text-anchor="middle">9</text>
  <text class="msg" x="800" y="938" text-anchor="middle" fill="#b65b67">CreateTopic + Subscribe</text>

  <path class="call" d="M1410 1020H1670" stroke="#b65b67" marker-end="url(#seqArrow-red)"/>
  <rect class="pill" x="1462" y="978" width="158" height="30" rx="15"/>
  <circle class="badge" cx="1484" cy="993" r="13" fill="#b65b67" stroke="#b65b67"/>
  <text class="badgeText" x="1484" y="997" text-anchor="middle">10</text>
  <text class="msg" x="1544" y="998" text-anchor="middle" fill="#b65b67">Publish</text>

  <path class="call" d="M1670 1080H1099" stroke="#63b891" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="1284" y="1038" width="208" height="30" rx="15"/>
  <circle class="badge" cx="1306" cy="1053" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="1306" y="1057" text-anchor="middle">11</text>
  <text class="msg" x="1392" y="1058" text-anchor="middle" fill="#5f8d3e">fanout to queue</text>

  <path class="return" d="M1099 1160H180" stroke="#5f8d3e" marker-end="url(#seqArrow-green)"/>
  <rect class="pill" x="506" y="1118" width="266" height="30" rx="15"/>
  <circle class="badge" cx="528" cy="1133" r="13" fill="#5f8d3e" stroke="#5f8d3e"/>
  <text class="badgeText" x="528" y="1137" text-anchor="middle">12</text>
  <text class="msg" x="644" y="1138" text-anchor="middle" fill="#5f8d3e">receiveUntil + snsPayload</text>

  <rect class="pill" x="330" y="1234" width="1140" height="34" rx="17"/>
  <text class="footer" x="900" y="1256" text-anchor="middle">Production SNS-to-SQS fanout normally needs a queue policy; Floci smoke verifies the SDK request flow without IAM enforcement.</text>
</svg>
