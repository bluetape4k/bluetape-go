<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
  <title id="title">imagekit bounded transform flow</title>
  <desc id="desc">The imagekit transform path reads a bounded image, validates format and pixel limits, resizes, then encodes to bytes or a writer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10.7692 10.7692" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none"/>
    </marker>
    <style>
      @font-face{font-family:'Architects Daughter';src:url('/Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf');}
      @font-face{font-family:'Comic Mono';src:url('/Users/debop/Library/Fonts/ComicMono.ttf');font-weight:400;}
      @font-face{font-family:'Comic Mono';src:url('/Users/debop/Library/Fonts/ComicMono-Bold.ttf');font-weight:700;}
      <![CDATA[
      .bg{fill:#f8fafc}
      .title{font-family:'Architects Daughter','Comic Mono';font-size:32px;fill:#111827}
      .sub{font-family:'Comic Mono','Architects Daughter';font-size:15px;fill:#475569}
      .card{rx:14;stroke-width:2.2}
      .cardTitle{font-family:'Comic Mono','Architects Daughter';font-size:16px;font-weight:700;fill:#111827}
      .cardText{font-family:'Comic Mono','Architects Daughter';font-size:12px;fill:#374151}
      .chip{font-family:'Comic Mono','Architects Daughter';font-size:11px;fill:#1d4ed8}
      .arrow{fill:none;stroke:#2563eb;stroke-width:4.2;marker-end:url(#arrow)}
      .label{font-family:'Comic Mono','Architects Daughter';font-size:11px;fill:#1d4ed8}
      .footer{font-family:'Comic Mono','Architects Daughter';font-size:12px;fill:#475569}
      ]]>
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1320" height="520"/>
  <text class="title" x="48" y="54">imagekit bounded transform flow</text>
  <text class="sub" x="50" y="84">Pure-Go resize path with explicit format, byte, pixel, and writer boundaries.</text>

  <rect class="card" x="48" y="156" width="180" height="132" fill="#eff6ff" stroke="#2563eb"/>
  <text class="cardTitle" x="66" y="188">Reader input</text>
  <text class="cardText" x="66" y="216">io.Reader</text>
  <text class="cardText" x="66" y="236">MaxInputBytes</text>
  <text class="cardText" x="66" y="256">context before read</text>

  <rect class="card" x="270" y="142" width="190" height="160" fill="#ecfdf5" stroke="#059669"/>
  <text class="cardTitle" x="288" y="174">Decode guard</text>
  <text class="cardText" x="288" y="202">DecodeConfig first</text>
  <text class="cardText" x="288" y="222">JPEG, PNG, GIF only</text>
  <text class="cardText" x="288" y="242">no process-global drift</text>
  <text class="chip" x="288" y="274">ErrUnsupportedFormat</text>

  <rect class="card" x="502" y="142" width="190" height="160" fill="#fffbeb" stroke="#d97706"/>
  <text class="cardTitle" x="520" y="174">Bounds check</text>
  <text class="cardText" x="520" y="202">input dimensions</text>
  <text class="cardText" x="520" y="222">output dimensions</text>
  <text class="cardText" x="520" y="242">pixel budgets</text>
  <text class="chip" x="520" y="274">ErrImageTooLarge</text>

  <rect class="card" x="734" y="142" width="190" height="160" fill="#fdf2f8" stroke="#db2777"/>
  <text class="cardTitle" x="752" y="174">Resize</text>
  <text class="cardText" x="752" y="202">fit preserves ratio</text>
  <text class="cardText" x="752" y="222">fill crop first</text>
  <text class="cardText" x="752" y="242">exact allows stretch</text>
  <text class="chip" x="752" y="274">draw.Filter</text>

  <rect class="card" x="966" y="142" width="180" height="160" fill="#eef2ff" stroke="#4f46e5"/>
  <text class="cardTitle" x="984" y="174">Encode</text>
  <text class="cardText" x="984" y="202">JPEG or PNG</text>
  <text class="cardText" x="984" y="222">quality 1..100</text>
  <text class="cardText" x="984" y="242">context before encode</text>
  <text class="chip" x="984" y="274">ErrEncode</text>

  <rect class="card" x="1188" y="156" width="84" height="132" fill="#f8fafc" stroke="#64748b"/>
  <text class="cardTitle" x="1206" y="188">Result</text>
  <text class="cardText" x="1206" y="216">Bytes</text>
  <text class="cardText" x="1206" y="236">or writer</text>
  <text class="cardText" x="1206" y="256">metadata</text>

  <path class="arrow" d="M 228 222 L 270 222"/>
  <text class="label" x="236" y="210">read</text>
  <path class="arrow" d="M 460 222 L 502 222"/>
  <text class="label" x="468" y="210">limit</text>
  <path class="arrow" d="M 692 222 L 734 222"/>
  <text class="label" x="700" y="210">decode</text>
  <path class="arrow" d="M 924 222 L 966 222"/>
  <text class="label" x="932" y="210">pixels</text>
  <path class="arrow" d="M 1146 222 L 1188 222"/>
  <text class="label" x="1154" y="210">write</text>

  <rect x="78" y="350" width="1164" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="footer" x="100" y="378">Transform returns encoded bytes; direct TransformTo output is non-atomic and should only target writers where partial bytes are acceptable.</text>
  <text class="footer" x="100" y="402">For final responses or storage objects, stage TransformTo in a temporary buffer/object before publishing; I/O deadlines stay at the caller boundary.</text>
</svg>
