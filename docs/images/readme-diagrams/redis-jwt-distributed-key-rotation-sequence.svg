<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Redis JWT Distributed Rotation Sequence</title>
  <desc id="desc">Concurrent instances converge on one current kid, while retained keys remain available for validation.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4f77c9"/></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#319873"/></marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#cf8428"/></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#c85d73"/></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#7e62d9"/></marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7d9c"/></marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .part-title, .card-title, .panel-title { font-family: "Architects Daughter"; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .body, .small, .msg, .region, .footer { font-family: "Comic Mono"; fill: #526276; }
      .subtitle { font-size: 17px; }
      .panel-title { font-size: 24px; }
      .card-title { font-size: 22px; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 12px; font-weight: 700; }
      .footer { font-size: 14px; }
      .panel { stroke: #d0deeb; stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card { stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card-divider { stroke-width: 1.1; opacity: .45; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: .88; }
      .route { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .alt { fill: #f7f2ff; fill-opacity: .22; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .alt-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .else-line { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 14; }
      .badge { stroke-width: 1.6; }
      .badge-text { font-family: "Comic Mono"; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .legend { fill: #ffffff; stroke: #d4e0ec; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect class="canvas" width="1500" height="980"/>
  <rect class="frame" x="34" y="30" width="1432" height="916" rx="8"/>
  <text class="title" x="72" y="88">Redis JWT Distributed Rotation Sequence</text>
  <text class="subtitle" x="76" y="120">Concurrent instances converge on one current kid, while retained keys remain available for validation.</text>
  <rect class="participant" x="70" y="174" width="160" height="68" fill="#eaf2ff" stroke="#6d9df0"/>
  <text class="part-title" x="150" y="202" text-anchor="middle">Instance A</text>
  <text class="small" x="150" y="224" text-anchor="middle">Compose</text>
  <line class="lifeline" x1="150" y1="242" x2="150" y2="854"/>
  <rect class="participant" x="300" y="174" width="160" height="68" fill="#edf9f4" stroke="#63b891"/>
  <text class="part-title" x="380" y="202" text-anchor="middle">Provider</text>
  <text class="small" x="380" y="224" text-anchor="middle">rotation logic</text>
  <line class="lifeline" x1="380" y1="242" x2="380" y2="854"/>
  <rect class="participant" x="570" y="174" width="160" height="68" fill="#fff0f0" stroke="#dc2626"/>
  <text class="part-title" x="650" y="202" text-anchor="middle">Redis repo</text>
  <text class="small" x="650" y="224" text-anchor="middle">CAS scripts</text>
  <line class="lifeline" x1="650" y1="242" x2="650" y2="854"/>
  <rect class="participant" x="820" y="174" width="160" height="68" fill="#f3efff" stroke="#9b7aec"/>
  <text class="part-title" x="900" y="202" text-anchor="middle">Key store</text>
  <text class="small" x="900" y="224" text-anchor="middle">meta/current/keys</text>
  <line class="lifeline" x1="900" y1="242" x2="900" y2="854"/>
  <rect class="participant" x="1080" y="174" width="160" height="68" fill="#fff4de" stroke="#d59c3f"/>
  <text class="part-title" x="1160" y="202" text-anchor="middle">Instance B</text>
  <text class="small" x="1160" y="224" text-anchor="middle">Parse</text>
  <line class="lifeline" x1="1160" y1="242" x2="1160" y2="854"/>
  <rect class="activation" x="143" y="298" width="14" height="284" rx="7"/>
  <rect class="activation" x="373" y="298" width="14" height="284" rx="7"/>
  <rect class="activation" x="643" y="358" width="14" height="464" rx="7"/>
  <rect class="activation" x="893" y="418" width="14" height="344" rx="7"/>
  <rect class="activation" x="1153" y="658" width="14" height="164" rx="7"/>
  <rect class="alt" x="78" y="330" width="1276" height="250" rx="16"/>
  <rect class="alt-label" x="96" y="348" width="228" height="30" rx="15"/>
  <text class="region" x="118" y="368">alt rotate if needed</text>
  <rect class="alt" x="78" y="640" width="1276" height="190" rx="16"/>
  <rect class="alt-label" x="96" y="658" width="183" height="30" rx="15"/>
  <text class="region" x="118" y="678">validation path</text>
  <path class="route" d="M150 310 L380 310" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <rect class="pill" x="186" y="268" width="158" height="30" rx="15"/>
  <circle class="badge" cx="204" cy="283" r="13" fill="#4f77c9"/>
  <text class="badge-text" x="204" y="287" text-anchor="middle">1</text>
  <text class="msg" x="280" y="288" text-anchor="middle" fill="#4f77c9">ComposeContext</text>
  <path class="route" d="M380 370 L650 370" stroke="#319873" marker-end="url(#arrow-green)"/>
  <rect class="pill" x="400" y="328" width="230" height="30" rx="15"/>
  <circle class="badge" cx="418" cy="343" r="13" fill="#319873"/>
  <text class="badge-text" x="418" y="347" text-anchor="middle">2</text>
  <text class="msg" x="530" y="348" text-anchor="middle" fill="#319873">current missing/expired</text>
  <path class="route" d="M650 430 L900 430" stroke="#319873" marker-end="url(#arrow-green)"/>
  <rect class="pill" x="676" y="388" width="198" height="30" rx="15"/>
  <circle class="badge" cx="694" cy="403" r="13" fill="#319873"/>
  <text class="badge-text" x="694" y="407" text-anchor="middle">3</text>
  <text class="msg" x="790" y="408" text-anchor="middle" fill="#319873">CAS store fresh key</text>
  <path class="return" d="M900 490 L650 490" stroke="#319873" marker-end="url(#arrow-green)"/>
  <rect class="pill" x="709" y="448" width="132" height="30" rx="15"/>
  <circle class="badge" cx="727" cy="463" r="13" fill="#319873"/>
  <text class="badge-text" x="727" y="467" text-anchor="middle">4</text>
  <text class="msg" x="790" y="468" text-anchor="middle" fill="#319873">winner kid</text>
  <path class="return" d="M380 550 L150 550" stroke="#4f77c9" marker-end="url(#arrow-blue)"/>
  <rect class="pill" x="158" y="508" width="214" height="30" rx="15"/>
  <circle class="badge" cx="176" cy="523" r="13" fill="#4f77c9"/>
  <text class="badge-text" x="176" y="527" text-anchor="middle">5</text>
  <text class="msg" x="280" y="528" text-anchor="middle" fill="#4f77c9">signed token with kid</text>
  <path class="route" d="M1160 670 L650 670" stroke="#7e62d9" marker-end="url(#arrow-purple)"/>
  <rect class="pill" x="786" y="628" width="238" height="30" rx="15"/>
  <circle class="badge" cx="804" cy="643" r="13" fill="#7e62d9"/>
  <text class="badge-text" x="804" y="647" text-anchor="middle">6</text>
  <text class="msg" x="920" y="648" text-anchor="middle" fill="#7e62d9">FindKeyChainContext(kid)</text>
  <path class="route" d="M650 730 L900 730" stroke="#7e62d9" marker-end="url(#arrow-purple)"/>
  <rect class="pill" x="684" y="688" width="182" height="30" rx="15"/>
  <circle class="badge" cx="702" cy="703" r="13" fill="#7e62d9"/>
  <text class="badge-text" x="702" y="707" text-anchor="middle">7</text>
  <text class="msg" x="790" y="708" text-anchor="middle" fill="#7e62d9">read retained key</text>
  <path class="return" d="M650 790 L1160 790" stroke="#7e62d9" marker-end="url(#arrow-purple)"/>
  <rect class="pill" x="770" y="748" width="270" height="30" rx="15"/>
  <circle class="badge" cx="788" cy="763" r="13" fill="#7e62d9"/>
  <text class="badge-text" x="788" y="767" text-anchor="middle">8</text>
  <text class="msg" x="920" y="768" text-anchor="middle" fill="#7e62d9">verify key or ErrKeyNotFound</text>
  <rect class="legend" x="82" y="902" width="1336" height="40" rx="8"/>
  <text class="footer" x="750" y="928" text-anchor="middle">DeleteKeyChainsContext is for test/operator reset, not normal rotation or rollback.</text>
</svg>
