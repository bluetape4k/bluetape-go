<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">probabilistic/redis Runtime Map</title>
  <desc id="desc">Bloom filters and HyperLogLog use core Redis commands; Cuckoo remains RedisBloom-module follow-up scope.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10" /></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4f77c9" stroke-dasharray="none" /></marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#319873" stroke-dasharray="none" /></marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#cf8428" stroke-dasharray="none" /></marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#c85d73" stroke-dasharray="none" /></marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#7e62d9" stroke-dasharray="none" /></marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7d9c" stroke-dasharray="none" /></marker>
    <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b" /></marker>
    <style>
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title, .part-title, .card-title, .panel-title { font-family: "Architects Daughter"; fill: #263a57; }
      .title { font-size: 42px; }
      .subtitle, .body, .small, .msg, .region, .footer { font-family: "Comic Mono"; fill: #526276; }
      .subtitle { font-size: 17px; }
      .panel-title { font-size: 24px; }
      .card-title { font-size: 22px; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .msg { font-size: 13px; font-weight: 700; }
      .region { font-size: 12px; font-weight: 700; }
      .footer { font-size: 14px; }
      .panel { stroke: #d0deeb; stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card { stroke-width: 1.8; rx: 8; filter: url(#softShadow); }
      .card-divider { stroke-width: 1.1; opacity: .45; }
      .participant { stroke-width: 2.2; rx: 12; }
      .lifeline { stroke: #c5d4e3; stroke-width: 2; stroke-dasharray: 8 8; }
      .activation { fill: #f3eeff; stroke: #8a65d8; stroke-width: 1.7; rx: 7; opacity: .88; }
      .route { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .return { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; }
      .alt { fill: #f7f2ff; fill-opacity: .22; stroke: #78909c; stroke-width: 2.4; stroke-dasharray: 12 7; rx: 16; }
      .alt-label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; rx: 15; }
      .else-line { stroke: #78909c; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .pill { fill: #ffffff; stroke: #cbd9e7; stroke-width: 1.5; rx: 14; }
      .badge { stroke-width: 1.6; }
      .badge-text { font-family: "Comic Mono"; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .legend { fill: #ffffff; stroke: #d4e0ec; stroke-width: 1.5; rx: 12; }
    </style>
  </defs>
  <rect class="canvas" width="1500" height="920" />
  <rect class="frame" x="34" y="30" width="1432" height="856" rx="8" />
  <text class="title" x="72" y="88">probabilistic/redis Runtime Map</text>
  <text class="subtitle" x="76" y="120">Bloom filters and HyperLogLog use core Redis commands; Cuckoo remains RedisBloom-module follow-up scope.</text>
  <rect class="card" x="92" y="235" width="330" height="185" rx="8" fill="#eaf2ff" stroke="#6d9df0" />
  <text class="card-title" x="257" y="277" text-anchor="middle">Caller</text>
  <path class="card-divider" d="M92 297H422" stroke="#6d9df0" />
  <path class="card-divider" d="M92 367H422" stroke="#6d9df0" />
  <text class="body" x="116" y="325">Bloom membership</text>
  <text class="body" x="116" y="349">HLL distinct count</text>
  <text class="body" x="116" y="391">context-owned calls</text>
  <rect class="card" x="500" y="170" width="390" height="215" rx="8" fill="#edf9f4" stroke="#63b891" />
  <text class="card-title" x="695" y="212" text-anchor="middle">BloomFilter</text>
  <path class="card-divider" d="M500 232H890" stroke="#63b891" />
  <path class="card-divider" d="M500 302H890" stroke="#63b891" />
  <text class="body" x="524" y="260">NewStringBloomFilter</text>
  <text class="body" x="524" y="284">hashes values to offsets</text>
  <text class="body" x="524" y="326">checks config fingerprint</text>
  <text class="body" x="524" y="350">maps script errors</text>
  <rect class="card" x="500" y="520" width="390" height="180" rx="8" fill="#f3efff" stroke="#9b7aec" />
  <text class="card-title" x="695" y="562" text-anchor="middle">HyperLogLog</text>
  <path class="card-divider" d="M500 582H890" stroke="#9b7aec" />
  <path class="card-divider" d="M500 652H890" stroke="#9b7aec" />
  <text class="body" x="524" y="610">NewStringHyperLogLog</text>
  <text class="body" x="524" y="634">SHA-256 value digests</text>
  <text class="body" x="524" y="676">Add / Count / Merge</text>
  <rect class="card" x="1010" y="160" width="390" height="220" rx="8" fill="#fff0f0" stroke="#dc2626" />
  <image href="data:image/svg+xml;base64," x="1030" y="178" width="46" height="46" />
  <text class="card-title" x="1225" y="202" text-anchor="middle">Redis core commands</text>
  <path class="card-divider" d="M1010 222H1400" stroke="#dc2626" />
  <path class="card-divider" d="M1010 292H1400" stroke="#dc2626" />
  <text class="body" x="1034" y="250">Lua EVAL / EVALSHA</text>
  <text class="body" x="1034" y="274">PFADD / PFCOUNT / PFMERGE</text>
  <text class="body" x="1034" y="316">no RedisBloom module</text>
  <rect class="card" x="1010" y="455" width="390" height="165" rx="8" fill="#fff4de" stroke="#d59c3f" />
  <text class="card-title" x="1205" y="497" text-anchor="middle">Bloom keys</text>
  <path class="card-divider" d="M1010 517H1400" stroke="#d59c3f" />
  <path class="card-divider" d="M1010 584H1400" stroke="#d59c3f" />
  <text class="body" x="1034" y="545">:config hash metadata</text>
  <text class="body" x="1034" y="569">:bits bitmap string</text>
  <text class="body" x="1034" y="611">Cluster hash-tag slot</text>
  <rect class="card" x="1010" y="690" width="390" height="120" rx="8" fill="#edf7ff" stroke="#3f7d9c" />
  <text class="card-title" x="1205" y="732" text-anchor="middle">HLL key</text>
  <path class="card-divider" d="M1010 752H1400" stroke="#3f7d9c" />
  <text class="body" x="1034" y="780">one HyperLogLog string</text>
  <text class="body" x="1034" y="804">approximate cardinality</text>
  <path class="route" d="M422 300H500" stroke="#4f77c9" marker-end="url(#arrow-blue)" />
  <text class="msg" x="460" y="282" text-anchor="middle" fill="#4f77c9">Bloom API</text>
  <path class="route" d="M422 360H462Q482 360 482 380V590Q477 610 485 610H500" stroke="#7e62d9" marker-end="url(#arrow-purple)" />
  <text class="msg" x="452" y="538" text-anchor="middle" fill="#7e62d9">HLL API</text>
  <path class="route" d="M890 280H1010" stroke="#c85d73" marker-end="url(#arrow-red)" />
  <text class="msg" x="950" y="262" text-anchor="middle" fill="#c85d73">scripts</text>
  <path class="route" d="M890 610H950Q970 610 970 590V325Q970 305 990 305H1010" stroke="#319873" marker-end="url(#arrow-green)" />
  <text class="msg" x="940" y="520" text-anchor="middle" fill="#319873">PF*</text>
  <path class="route" d="M890 315H950Q970 315 970 335V535Q970 555 990 555H1010" stroke="#cf8428" marker-end="url(#arrow-amber)" />
  <text class="msg" x="830" y="435" text-anchor="middle" fill="#cf8428">metadata + bits</text>
  <path class="route" d="M890 676H950Q970 676 970 696V742Q970 762 990 762H1010" stroke="#3f7d9c" marker-end="url(#arrow-teal)" />
  <text class="msg" x="950" y="724" text-anchor="middle" fill="#3f7d9c">estimate key</text>
  <rect class="legend" x="82" y="842" width="1336" height="40" rx="8" />
  <text class="footer" x="750" y="868" text-anchor="middle">Bloom and HLL require only core Redis; RedisBloom CF* Cuckoo support is intentionally outside this scope.</text>
</svg>