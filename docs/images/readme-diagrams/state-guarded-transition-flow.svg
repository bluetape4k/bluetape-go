<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#94a3b8" flood-opacity=".22"/></filter>
</defs>
<style>
  @font-face{font-family:'Architects Daughter';src:local('Architects Daughter');}
  @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
  .bg{fill:#f8fafc}.title{font:42px 'Architects Daughter';fill:#111827}.sub{font:20px 'Comic Mono';fill:#475569}.card-title{font:24px 'Comic Mono';font-weight:700;fill:#111827}.body{font:17px 'Comic Mono';fill:#334155}.small{font:15px 'Comic Mono';fill:#475569}.label{font:16px 'Comic Mono';fill:#2563eb;font-weight:700}.line{stroke:#2563eb;stroke-width:3.5;fill:none;marker-end:url(#arrow)}.line-green{stroke:#059669;stroke-width:3.5;fill:none;marker-end:url(#arrow-green)}.line-red{stroke:#dc2626;stroke-width:3.5;fill:none;marker-end:url(#arrow-red)}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}.card{fill:#fff;stroke-width:4}.alt{fill:#f59e0b;fill-opacity:.12;stroke:#f59e0b;stroke-opacity:.55;stroke-dasharray:10 8;stroke-width:3}
</style>
<rect class="bg" width="1440" height="820"/>
<text class="title" x="56" y="72">Guarded Transition Flow</text>
<text class="sub" x="60" y="112">Transition looks up the edge under read lock, runs guards outside the lock, then rechecks state before commit.</text>
<rect class="card" x="70" y="180" width="280" height="170" rx="16" fill="#eff6ff" stroke="#2563eb" filter="url(#shadow)"/>
<text class="card-title" x="96" y="220">Transition</text>
<text class="body" x="98" y="256">normalize context</text>
<text class="body" x="98" y="283">check ctx.Err()</text>
<text class="body" x="98" y="310">event request</text>
<rect class="card" x="455" y="145" width="300" height="230" rx="16" fill="#ecfdf5" stroke="#059669" filter="url(#shadow)"/>
<text class="card-title" x="482" y="185">lookup(event)</text>
<text class="body" x="484" y="222">RLock current</text>
<text class="body" x="484" y="249">reject final state</text>
<text class="body" x="484" y="276">find from+event</text>
<text class="body" x="484" y="303">return from,target</text>
<text class="body" x="484" y="330">release lock</text>
<rect class="card" x="860" y="145" width="305" height="230" rx="16" fill="#fff7ed" stroke="#ea580c" filter="url(#shadow)"/>
<text class="card-title" x="888" y="185">optional guard</text>
<text class="body" x="890" y="222">runs outside lock</text>
<text class="body" x="890" y="249">receives ctx/from/event</text>
<text class="body" x="890" y="276">error becomes guard rejected</text>
<text class="body" x="890" y="303">ctx checked again</text>
<rect class="card" x="455" y="500" width="330" height="160" rx="16" fill="#f5f3ff" stroke="#7c3aed" filter="url(#shadow)"/>
<text class="card-title" x="482" y="540">commit lock</text>
<text class="body" x="484" y="576">Lock current state</text>
<text class="body" x="484" y="603">must still equal from</text>
<text class="body" x="484" y="630">set current = target.to</text>
<rect class="card" x="920" y="500" width="330" height="160" rx="16" fill="#fef2f2" stroke="#dc2626" filter="url(#shadow)"/>
<text class="card-title" x="948" y="540">Result / errors</text>
<text class="body" x="950" y="576">Result Previous/Event/Current</text>
<text class="body" x="950" y="603">ErrConcurrentTransition</text>
<text class="body" x="950" y="630">context or guard cause</text>
<path class="line" d="M350 265H455" marker-end="url(#arrow)"/><text class="label" x="378" y="252">read</text>
<path class="line-green" d="M755 265H860" marker-end="url(#arrow-green)"/><text class="label" x="787" y="252">guard?</text>
<path class="line-green" d="M1010 375V420Q1010 450 980 450H735Q705 450 705 480V500" marker-end="url(#arrow-green)"/><text class="label" x="900" y="438">ok</text>
<path class="line" d="M785 580H920" marker-end="url(#arrow)"/><text class="label" x="820" y="567">commit result</text>
<path class="line-red" d="M620 500V455Q620 435 600 435H450Q420 435 420 405V340" marker-end="url(#arrow-red)"/><text class="label" x="485" y="425">conflict if state moved</text>
<rect class="alt" x="70" y="710" width="1280" height="72" rx="16"/>
<text class="small" x="96" y="740">alt: invalid event, final state, guard rejection, context cancellation, or concurrent state movement returns an error without mutating state.</text>
<text class="small" x="96" y="765">Guard note: CanTransition can also execute guard code, so inquiry guards should avoid irreversible side effects.</text>
</svg>
