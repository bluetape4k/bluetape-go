<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
  <defs>
    <style>
      @font-face {
        font-family: 'Architects Daughter';
        src: url('/Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf');
      }
      @font-face {
        font-family: 'Comic Mono';
        src: url('/Users/debop/Library/Fonts/ComicMono.ttf');
        font-weight: normal;
      }
      @font-face {
        font-family: 'Comic Mono';
        src: url('/Users/debop/Library/Fonts/ComicMono-Bold.ttf');
        font-weight: bold;
      }
      .title { font-family: 'Architects Daughter'; font-size: 30px; fill: #1E293B; font-weight: bold; }
      .subtitle { font-family: 'Comic Mono'; font-size: 14px; fill: #64748B; }
      .label { font-family: 'Comic Mono'; font-size: 14px; fill: #334155; }
      .value { font-family: 'Comic Mono'; font-size: 13px; fill: #0F172A; font-weight: bold; }
      .axis { font-family: 'Comic Mono'; font-size: 11px; fill: #64748B; }
      .legend { font-family: 'Comic Mono'; font-size: 12px; fill: #334155; }
      .badge { font-family: 'Comic Mono'; font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="540" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" rx="18"/>
  <text x="540" y="44" text-anchor="middle" dominant-baseline="middle" class="title">ratelimit Benchmark Snapshot</text>
  <text x="540" y="72" text-anchor="middle" dominant-baseline="middle" class="subtitle">Local smoke · Apple M4 Pro · darwin/arm64 · latency scale, lower is better</text>

  <rect x="56" y="104" width="968" height="356" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="14"/>

  <g opacity="0.85">
    <line x1="324" y1="136" x2="324" y2="396" stroke="#E2E8F0"/>
    <line x1="510" y1="136" x2="510" y2="396" stroke="#E2E8F0"/>
    <line x1="697" y1="136" x2="697" y2="396" stroke="#E2E8F0"/>
    <line x1="884" y1="136" x2="884" y2="396" stroke="#E2E8F0"/>
  </g>

  <text x="324" y="424" text-anchor="middle" class="axis">0</text>
  <text x="510" y="424" text-anchor="middle" class="axis">40</text>
  <text x="697" y="424" text-anchor="middle" class="axis">80</text>
  <text x="884" y="424" text-anchor="middle" class="axis">120 ns/op</text>

  <g>
    <text x="84" y="174" dominant-baseline="middle" class="label">Token bucket allow</text>
    <rect x="324" y="151" width="543" height="46" fill="#93C5FD" stroke="#60A5FA" rx="8"/>
    <text x="904" y="174" dominant-baseline="middle" class="value">116.4 ns/op</text>
    <text x="904" y="193" dominant-baseline="middle" class="badge">0 B/op · 0 allocs/op</text>

    <text x="84" y="262" dominant-baseline="middle" class="label">Token bucket reject</text>
    <rect x="324" y="239" width="358" height="46" fill="#A7F3D0" stroke="#34D399" rx="8"/>
    <text x="904" y="262" dominant-baseline="middle" class="value">76.76 ns/op</text>
    <text x="904" y="281" dominant-baseline="middle" class="badge">0 B/op · 0 allocs/op</text>

    <text x="84" y="350" dominant-baseline="middle" class="label">HTTP handler allow</text>
    <rect x="324" y="327" width="239" height="46" fill="#FDE68A" stroke="#F59E0B" rx="8"/>
    <text x="904" y="350" dominant-baseline="middle" class="value">51.26 ns/op</text>
    <text x="904" y="369" dominant-baseline="middle" class="badge">160 B/op · 3 allocs/op</text>
  </g>

  <g>
    <rect x="78" y="482" width="12" height="12" fill="#93C5FD" stroke="#60A5FA" rx="2"/>
    <text x="98" y="492" class="legend">local allowed path</text>
    <rect x="250" y="482" width="12" height="12" fill="#A7F3D0" stroke="#34D399" rx="2"/>
    <text x="270" y="492" class="legend">local rejected path</text>
    <rect x="436" y="482" width="12" height="12" fill="#FDE68A" stroke="#F59E0B" rx="2"/>
    <text x="456" y="492" class="legend">standard-library HTTP middleware</text>
    <text x="784" y="492" class="axis">Measured with make bench-ratelimit</text>
  </g>
</svg>
