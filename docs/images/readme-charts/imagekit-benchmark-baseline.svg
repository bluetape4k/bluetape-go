<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">imagekit pure-Go benchmark baseline</title>
  <desc id="desc">Horizontal bars compare imagekit transform benchmark latency in milliseconds per operation. Lower values are better.</desc>
  <defs>
    <style>
      @font-face{font-family:'Architects Daughter';src:url('/Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf');}
      @font-face{font-family:'Comic Mono';src:url('/Users/debop/Library/Fonts/ComicMono.ttf');font-weight:400;}
      @font-face{font-family:'Comic Mono';src:url('/Users/debop/Library/Fonts/ComicMono-Bold.ttf');font-weight:700;}
      <![CDATA[
      .title{font-family:'Architects Daughter','Comic Mono';font-size:34px;fill:#111827}
      .subtitle{font-family:'Comic Mono','Architects Daughter';font-size:14px;fill:#64748b}
      .section{font-family:'Architects Daughter','Comic Mono';font-size:24px;fill:#111827}
      .label{font-family:'Comic Mono','Architects Daughter';font-size:13px;fill:#334155}
      .axis{font-family:'Comic Mono','Architects Daughter';font-size:11px;fill:#64748b}
      .value{font-family:'Comic Mono','Architects Daughter';font-size:12px;fill:#0f172a;font-weight:700}
      .note{font-family:'Comic Mono','Architects Daughter';font-size:12px;fill:#475569}
      .calloutTitle{font-family:'Architects Daughter','Comic Mono';font-size:20px;fill:#111827}
      .callout{font-family:'Comic Mono','Architects Daughter';font-size:12px;fill:#334155}
      .legend{font-family:'Comic Mono','Architects Daughter';font-size:12px;fill:#334155}
      ]]>
    </style>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" rx="18"/>
  <text class="title" x="640" y="44" text-anchor="middle" dominant-baseline="middle">imagekit pure-Go benchmark baseline</text>
  <text class="subtitle" x="640" y="75" text-anchor="middle" dominant-baseline="middle">Issue #309 local snapshot - ms/op - lower is better - Apple M5 darwin/arm64</text>

  <rect x="58" y="112" width="1164" height="430" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="14"/>
  <text class="section" x="88" y="150" dominant-baseline="middle">Transform latency</text>
  <text class="axis" x="1190" y="150" text-anchor="end" dominant-baseline="middle">0 to 20 ms/op</text>

  <g opacity="0.92">
    <line x1="410" y1="186" x2="410" y2="444" stroke="#e2e8f0"/>
    <line x1="590" y1="186" x2="590" y2="444" stroke="#e2e8f0"/>
    <line x1="770" y1="186" x2="770" y2="444" stroke="#e2e8f0"/>
    <line x1="950" y1="186" x2="950" y2="444" stroke="#e2e8f0"/>
    <line x1="1130" y1="186" x2="1130" y2="444" stroke="#e2e8f0"/>
  </g>
  <text class="axis" x="410" y="474" text-anchor="middle">0</text>
  <text class="axis" x="590" y="474" text-anchor="middle">5</text>
  <text class="axis" x="770" y="474" text-anchor="middle">10</text>
  <text class="axis" x="950" y="474" text-anchor="middle">15</text>
  <text class="axis" x="1130" y="474" text-anchor="middle">20 ms/op</text>

  <text class="label" x="88" y="214" dominant-baseline="middle">Small JPEG to JPEG</text>
  <rect x="410" y="198" width="39" height="24" fill="#93c5fd" stroke="#2563eb" stroke-width="1.4" rx="6"/>
  <text class="value" x="465" y="214" dominant-baseline="middle">1.08 ms - 38 allocs</text>

  <text class="label" x="88" y="276" dominant-baseline="middle">Small PNG to PNG</text>
  <rect x="410" y="260" width="31" height="24" fill="#86efac" stroke="#16a34a" stroke-width="1.4" rx="6"/>
  <text class="value" x="457" y="276" dominant-baseline="middle">0.85 ms - 67 allocs</text>

  <text class="label" x="88" y="338" dominant-baseline="middle">Medium JPEG to PNG</text>
  <rect x="410" y="322" width="649" height="24" fill="#fdba74" stroke="#ea580c" stroke-width="1.4" rx="6"/>
  <text class="value" x="1076" y="338" dominant-baseline="middle">18.02 ms - 70 allocs</text>

  <text class="label" x="88" y="400" dominant-baseline="middle">TransformTo medium JPEG to PNG</text>
  <rect x="410" y="384" width="645" height="24" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.4" rx="6"/>
  <text class="value" x="1072" y="400" dominant-baseline="middle">17.92 ms - 67 allocs</text>

  <rect x="88" y="498" width="1064" height="26" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text class="note" x="106" y="516" dominant-baseline="middle">Source of truth: docs/benchmarks/2026-07-01-issue-309-imagekit.md preserves raw go test -bench output and environment.</text>

  <rect x="58" y="574" width="1164" height="86" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4" rx="12"/>
  <text class="calloutTitle" x="88" y="608" dominant-baseline="middle">How to read this chart</text>
  <text class="callout" x="360" y="594" dominant-baseline="middle">Pure-Go baseline for libvips follow-up evaluation, not a production throughput promise.</text>
  <text class="callout" x="360" y="622" dominant-baseline="middle">Small operations are codec overhead dominated; medium rows expose resize and PNG encode cost.</text>
  <rect x="88" y="638" width="12" height="12" fill="#93c5fd" stroke="#2563eb" rx="2"/>
  <text class="legend" x="108" y="648">JPEG</text>
  <rect x="162" y="638" width="12" height="12" fill="#86efac" stroke="#16a34a" rx="2"/>
  <text class="legend" x="182" y="648">PNG</text>
  <rect x="226" y="638" width="12" height="12" fill="#c4b5fd" stroke="#7c3aed" rx="2"/>
  <text class="legend" x="246" y="648">writer path</text>
</svg>
