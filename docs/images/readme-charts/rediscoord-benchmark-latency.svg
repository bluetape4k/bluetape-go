<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
  <defs>
    <style>
      @font-face {
        font-family: 'Architects Daughter';
        src: url('/Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf');
      }
      @font-face {
        font-family: 'Comic Mono';
        src: url('/Users/debop/Library/Fonts/ComicMono.ttf');
        font-weight: normal;
      }
      @font-face {
        font-family: 'Comic Mono';
        src: url('/Users/debop/Library/Fonts/ComicMono-Bold.ttf');
        font-weight: bold;
      }
      .title { font-family: 'Architects Daughter'; font-size: 30px; fill: #1E293B; font-weight: bold; }
      .subtitle { font-family: 'Comic Mono'; font-size: 14px; fill: #64748B; }
      .label { font-family: 'Comic Mono'; font-size: 13px; fill: #334155; }
      .value { font-family: 'Comic Mono'; font-size: 12px; fill: #0F172A; font-weight: bold; }
      .axis { font-family: 'Comic Mono'; font-size: 11px; fill: #64748B; }
      .legend { font-family: 'Comic Mono'; font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="760" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" rx="18"/>
  <text x="590" y="44" text-anchor="middle" dominant-baseline="middle" class="title">Redis Coordinator Benchmark Snapshot</text>
  <text x="590" y="72" text-anchor="middle" dominant-baseline="middle" class="subtitle">Local smoke · Apple M4 Pro · Redis 7.4 Testcontainers · latency log scale, lower is better</text>

  <rect x="56" y="102" width="1088" height="604" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="14"/>

  <g opacity="0.85">
    <line x1="306" y1="128" x2="306" y2="648" stroke="#E2E8F0"/>
    <line x1="458" y1="128" x2="458" y2="648" stroke="#E2E8F0"/>
    <line x1="610" y1="128" x2="610" y2="648" stroke="#E2E8F0"/>
    <line x1="762" y1="128" x2="762" y2="648" stroke="#E2E8F0"/>
    <line x1="914" y1="128" x2="914" y2="648" stroke="#E2E8F0"/>
  </g>

  <text x="306" y="672" text-anchor="middle" class="axis">10^2</text>
  <text x="458" y="672" text-anchor="middle" class="axis">10^3</text>
  <text x="610" y="672" text-anchor="middle" class="axis">10^4</text>
  <text x="762" y="672" text-anchor="middle" class="axis">10^5</text>
  <text x="914" y="672" text-anchor="middle" class="axis">10^6 ns/op</text>

  <g>
    <text x="84" y="146" dominant-baseline="middle" class="label">Memory hit</text>
    <rect x="276" y="130" width="30" height="32" fill="#93C5FD" stroke="#60A5FA" rx="7"/>
    <text x="326" y="146" dominant-baseline="middle" class="value">42.68 ns/op</text>

    <text x="84" y="214" dominant-baseline="middle" class="label">Coord hot</text>
    <rect x="276" y="198" width="34" height="32" fill="#A7F3D0" stroke="#34D399" rx="7"/>
    <text x="330" y="214" dominant-baseline="middle" class="value">52.92 ns/op</text>

    <text x="84" y="282" dominant-baseline="middle" class="label">Near hit</text>
    <rect x="276" y="266" width="42" height="32" fill="#BAE6FD" stroke="#38BDF8" rx="7"/>
    <text x="338" y="282" dominant-baseline="middle" class="value">57.83 ns/op</text>

    <text x="84" y="350" dominant-baseline="middle" class="label">Near invalidated</text>
    <rect x="276" y="334" width="143" height="32" fill="#FDE68A" stroke="#F59E0B" rx="7"/>
    <text x="439" y="350" dominant-baseline="middle" class="value">279.9 ns/op · 0.005107 loads/op</text>

    <text x="84" y="418" dominant-baseline="middle" class="label">Memory cold</text>
    <rect x="276" y="402" width="232" height="32" fill="#C4B5FD" stroke="#8B5CF6" rx="7"/>
    <text x="528" y="418" dominant-baseline="middle" class="value">1,065 ns/op · 1.000 loads/op</text>

    <text x="84" y="486" dominant-baseline="middle" class="label">Memory same-key</text>
    <rect x="276" y="470" width="386" height="32" fill="#FBCFE8" stroke="#EC4899" rx="7"/>
    <text x="682" y="486" dominant-baseline="middle" class="value">11,030 ns/op · 1.000 loads/op</text>

    <text x="84" y="554" dominant-baseline="middle" class="label">Near publish</text>
    <rect x="276" y="538" width="627" height="32" fill="#FDBA74" stroke="#F97316" rx="7"/>
    <text x="923" y="554" dominant-baseline="middle" class="value">424,923 ns/op</text>

    <text x="84" y="622" dominant-baseline="middle" class="label">Coord cold winner</text>
    <rect x="276" y="606" width="740" height="32" fill="#5EEAD4" stroke="#14B8A6" rx="7"/>
    <text x="996" y="622" text-anchor="end" dominant-baseline="middle" class="value">1,685,522 ns/op · 1.000 loads/op</text>
  </g>

  <g>
    <rect x="78" y="704" width="12" height="12" fill="#93C5FD" stroke="#60A5FA" rx="2"/>
    <text x="98" y="714" class="legend">cache.Memory</text>
    <rect x="218" y="704" width="12" height="12" fill="#BAE6FD" stroke="#38BDF8" rx="2"/>
    <text x="238" y="714" class="legend">cache/redisnear</text>
    <rect x="386" y="704" width="12" height="12" fill="#A7F3D0" stroke="#34D399" rx="2"/>
    <text x="406" y="714" class="legend">cache/rediscoord</text>
    <text x="940" y="714" class="axis">Measured with -benchtime=100ms</text>
  </g>
</svg>
