<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1020" viewBox="0 0 1280 1020">
  <defs>
    <style>
      @font-face {
        font-family: 'Architects Daughter';
        src: url('/Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf');
      }
      @font-face {
        font-family: 'Comic Mono';
        src: url('/Users/debop/Library/Fonts/ComicMono.ttf');
        font-weight: normal;
      }
      @font-face {
        font-family: 'Comic Mono';
        src: url('/Users/debop/Library/Fonts/ComicMono-Bold.ttf');
        font-weight: bold;
      }
      .title { font-family: 'Architects Daughter'; font-size: 34px; fill: #1E293B; font-weight: bold; }
      .subtitle { font-family: 'Comic Mono'; font-size: 14px; fill: #64748B; }
      .section { font-family: 'Architects Daughter'; font-size: 24px; fill: #1E293B; font-weight: bold; }
      .label { font-family: 'Comic Mono'; font-size: 13px; fill: #334155; }
      .value { font-family: 'Comic Mono'; font-size: 12px; fill: #0F172A; font-weight: bold; }
      .axis { font-family: 'Comic Mono'; font-size: 11px; fill: #64748B; }
      .legend { font-family: 'Comic Mono'; font-size: 12px; fill: #334155; }
      .note { font-family: 'Comic Mono'; font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="1020" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" rx="18"/>
  <text x="640" y="42" text-anchor="middle" dominant-baseline="middle" class="title">Kotlin vs Go ID Generator Performance</text>
  <text x="640" y="72" text-anchor="middle" dominant-baseline="middle" class="subtitle">Issue #168 · normalized to ns/id · lower is better · Apple M4 Pro local snapshot</text>

  <g>
    <rect x="56" y="106" width="1168" height="388" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="14"/>
    <text x="84" y="139" dominant-baseline="middle" class="section">Single-thread comparison</text>
    <text x="1188" y="139" text-anchor="end" dominant-baseline="middle" class="axis">both plotted as ns/id</text>

    <g opacity="0.9">
      <line x1="360" y1="174" x2="360" y2="430" stroke="#E2E8F0"/>
      <line x1="546" y1="174" x2="546" y2="430" stroke="#E2E8F0"/>
      <line x1="731" y1="174" x2="731" y2="430" stroke="#E2E8F0"/>
      <line x1="917" y1="174" x2="917" y2="430" stroke="#E2E8F0"/>
      <line x1="1103" y1="174" x2="1103" y2="430" stroke="#E2E8F0"/>
    </g>
    <text x="360" y="458" text-anchor="middle" class="axis">0</text>
