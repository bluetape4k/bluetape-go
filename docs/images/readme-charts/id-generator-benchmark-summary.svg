    <text x="685" y="357" dominant-baseline="middle" class="value">Kotlin 167.80</text>

    <text x="84" y="378" dominant-baseline="middle" class="label">KSUID seconds</text>
    <rect x="360" y="366" width="724" height="12" fill="#FDBA74" stroke="#F97316" rx="4"/>
    <rect x="360" y="383" width="349" height="12" fill="#93C5FD" stroke="#3B82F6" rx="4"/>
    <text x="1097" y="378" dominant-baseline="middle" class="value">Go 389.70</text>
    <text x="722" y="395" dominant-baseline="middle" class="value">Kotlin 187.93</text>
  </g>

  <g>
    <rect x="56" y="532" width="1168" height="388" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="14"/>
