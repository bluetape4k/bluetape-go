      <line x1="694" y1="600" x2="694" y2="856" stroke="#E2E8F0"/>
      <line x1="806" y1="600" x2="806" y2="856" stroke="#E2E8F0"/>
      <line x1="917" y1="600" x2="917" y2="856" stroke="#E2E8F0"/>
      <line x1="1029" y1="600" x2="1029" y2="856" stroke="#E2E8F0"/>
      <line x1="1140" y1="600" x2="1140" y2="856" stroke="#E2E8F0"/>
