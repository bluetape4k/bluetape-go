    <text x="740" y="707" dominant-baseline="middle" class="value">Kotlin 329.69</text>

    <text x="84" y="728" dominant-baseline="middle" class="label">UUID v7 reused</text>
    <rect x="360" y="716" width="419" height="12" fill="#FDBA74" stroke="#F97316" rx="4"/>
    <rect x="360" y="733" width="128" height="12" fill="#93C5FD" stroke="#3B82F6" rx="4"/>
    <text x="792" y="728" dominant-baseline="middle" class="value">Go 376.40</text>
    <text x="501" y="745" dominant-baseline="middle" class="value">Kotlin 115.42</text>

    <text x="84" y="766" dominant-baseline="middle" class="label">KSUID millis</text>
    <rect x="360" y="754" width="704" height="12" fill="#FDBA74" stroke="#F97316" rx="4"/>
    <rect x="360" y="771" width="441" height="12" fill="#93C5FD" stroke="#3B82F6" rx="4"/>
    <text x="1077" y="766" dominant-baseline="middle" class="value">Go 632.30</text>
    <text x="814" y="783" dominant-baseline="middle" class="value">Kotlin 396.50</text>

    <text x="84" y="804" dominant-baseline="middle" class="label">KSUID seconds</text>
    <rect x="360" y="792" width="731" height="12" fill="#FDBA74" stroke="#F97316" rx="4"/>
    <rect x="360" y="809" width="433" height="12" fill="#93C5FD" stroke="#3B82F6" rx="4"/>
    <text x="1104" y="804" dominant-baseline="middle" class="value">Go 656.30</text>
    <text x="806" y="821" dominant-baseline="middle" class="value">Kotlin 388.70</text>
