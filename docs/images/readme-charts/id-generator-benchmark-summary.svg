    <rect x="360" y="193" width="453" height="12" fill="#93C5FD" stroke="#3B82F6" rx="4"/>
    <text x="395" y="188" dominant-baseline="middle" class="value">Go 11.98</text>
    <text x="826" y="205" dominant-baseline="middle" class="value">Kotlin 244.06</text>

    <text x="84" y="226" dominant-baseline="middle" class="label">ULID monotonic</text>
    <rect x="360" y="214" width="122" height="12" fill="#FDBA74" stroke="#F97316" rx="4"/>
    <rect x="360" y="231" width="69" height="12" fill="#93C5FD" stroke="#3B82F6" rx="4"/>
